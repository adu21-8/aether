<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Offline trading journal for MetaTrader 5. Import your statement, tag your trades and hold yourself to your own risk rules. Your data never leaves your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Aether — Trading Journal">
<meta property="og:description" content="Offline trading journal for MetaTrader 5. No account, no server — your data never leaves your browser.">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aether">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Aether — Trading Journal</title>
<style>
:root{
  --bg:#0a0a0b; --panel:#111113; --panel2:#17171a;
  --line:#1d1d20; --line2:#26262b; --border:#37373d;
  --text:#ececee; --muted:#8f8f97; --faint:#74747d;   /* faint is 4.3:1 on the page — it labels data, so it has to be readable */
  --accent:#9c5550; --accent-bright:#cf837c;
  --win:#3f6b55; --win-bright:#8bbd9f;
  --gbp:#93a7bb; --xau:#b8aa8b;
  --amber:#b9a26b;
  --r:10px; --r-lg:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --elev:none;
  --dur:.15s; --dur-pg:.22s; --ease:cubic-bezier(.4,0,.2,1);
  --sp:28px;
  --spring:cubic-bezier(.22,1,.36,1);   /* a critically damped settle: fast start, no overshoot */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:.875rem;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:.004em;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-optical-sizing:auto}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:.8125rem}
a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232327;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#2e2e33}
::-webkit-scrollbar-track{background:transparent}
::selection{background:#2e2e33}

@keyframes fadeRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout: top bar instead of sidebar ---------- */
#app{display:flex;flex-direction:column;min-height:100vh}
#sidebar{width:100%;height:auto;position:sticky;top:0;z-index:40;display:flex;flex-direction:row;align-items:center;gap:10px;background:rgba(10,10,11,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid transparent;transition:border-color .25s ease;padding:0 20px;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:0 18px 0 0;border-bottom:0;border-right:1px solid var(--line);margin-right:4px;align-self:stretch;display:flex;align-items:center}
.brand .logo{font-size:.875rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.brand .logo b{color:inherit;font-weight:600}
.brand .tag{display:none}
nav{display:flex;flex:1;padding:0;overflow-x:auto;gap:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.navbtn{display:flex;align-items:center;width:auto;flex:none;white-space:nowrap;text-align:left;background:none;border:0;color:var(--muted);padding:16px 13px 14px;font-size:.8125rem;font-weight:500;border-left:0;border-bottom:2px solid transparent;transition:color var(--dur),border-color var(--dur)}
.navbtn:hover{color:var(--text);background:none}
.navbtn.active{color:var(--text);font-weight:600;background:none;border-bottom-color:var(--text)}
.navbtn .ico{display:none}
.navlabel{display:none}
.sidefoot{display:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:static;background:none;border-bottom:0;padding:30px 28px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1160px;width:100%;margin:0 auto}
header .ttl{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
header .spacer{flex:1}
.segmented{display:inline-flex;background:none;border:1px solid var(--line2);border-radius:8px;overflow:hidden;padding:2px;gap:2px}
.segmented button{background:none;border:0;color:var(--muted);padding:5px 13px;font-size:.75rem;font-weight:600;letter-spacing:.02em;border-radius:6px;transition:background var(--dur),color var(--dur)}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--text);color:var(--bg)}
.acctchip{font-size:.6875rem;color:var(--faint);text-align:right;line-height:1.35}
.acctchip b{color:var(--muted);font-weight:600}
.content{padding:18px 28px 64px;max-width:1160px;width:100%;margin:0 auto}

.page{display:none}
.page.active{display:block;animation:fadeRise var(--dur-pg) var(--ease)}

/* sub-tabs */
.subtabs{display:inline-flex;gap:2px;background:none;border:1px solid var(--line2);border-radius:8px;padding:3px;margin-bottom:24px;flex-wrap:wrap}
.subtabs button{background:none;border:0;color:var(--muted);padding:7px 15px;font-size:.78125rem;font-weight:500;letter-spacing:.01em;border-radius:6px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.subtabs button:hover{color:var(--text)}
.subtabs button.on{background:var(--text);color:var(--bg);font-weight:600}
.subtabs button.on:hover{background:var(--text)}
.tabbody.fadein{animation:fadeIn var(--dur-pg) var(--ease)}

/* performance hero */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 30px;margin-bottom:16px;background:var(--panel)}
.hero .pnllabel{font-size:.625rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:14px}
.hero .pnl{font-family:var(--mono);font-size:3.625rem;font-weight:600;letter-spacing:-.04em;line-height:.95}
.hero .mini{display:flex;gap:38px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.hero .mini .m .k{font-size:.59375rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.hero .mini .m .v{font-family:var(--mono);font-size:1.375rem;font-weight:600;margin-top:6px;letter-spacing:-.01em}
@media(max-width:600px){.hero{padding:20px}.hero .pnl{font-size:2.5rem}.hero .mini{gap:22px}}

/* ---------- Bits ---------- */
.eyebrow{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;font-weight:600}
h2.sec{font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;margin:42px 0 16px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:11px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h2.sec::before{content:none}
h2.sec:first-child{margin-top:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:1fr 1fr}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;transition:border-color var(--dur)}
.stat:hover{border-color:var(--border)}
.stat .k{font-size:.59375rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-size:1.625rem;font-weight:600;font-family:var(--mono);margin-top:9px;letter-spacing:-.025em;line-height:1.05}
.stat .sub{font-size:.6875rem;color:var(--muted);margin-top:4px}
.pos{color:var(--win-bright)} .neg{color:var(--accent-bright)} .num{font-family:var(--mono)}
.pill{display:inline-block;font-size:.65625rem;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);background:none;font-weight:500}
.pill.gbp{color:var(--gbp);border-color:#333c46}
.pill.xau{color:var(--xau);border-color:#413c30}
.pill.win{color:var(--win-bright);border-color:#2c4638}
.pill.loss{color:var(--accent-bright);border-color:#4a322f}
.pill.flag{color:var(--accent-bright);border-color:#4a322f;background:#171112}
.pill.soft{color:var(--amber);border-color:#413c2c}
.tag-chip{display:inline-block;font-size:.6875rem;padding:4px 11px;border-radius:20px;background:none;border:1px solid var(--line2);color:var(--muted);margin:2px 4px 2px 0;transition:border-color var(--dur),color var(--dur)}
.tag-chip:hover{border-color:var(--border);color:var(--text)}
.tag-chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

.btn{background:none;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 15px;font-size:.8125rem;font-weight:500;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{border-color:var(--border);background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#fff;border-color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:5px 11px;font-size:.75rem}
.btn.danger{color:var(--accent-bright);border-color:#4a322f}
.btn.danger:hover{background:#171112;border-color:#5c3f3b}

table{width:100%;border-collapse:collapse;font-size:.78125rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--faint);font-size:.59375rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th .arr{opacity:.5;font-size:.5625rem}
tbody tr{transition:background var(--dur)}
tbody tr:hover{background:#151517;cursor:pointer}
td.r,th.r{text-align:right}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.muted{color:var(--muted)} .faint{color:var(--faint)}

.empty{text-align:center;color:var(--muted);padding:56px 22px;border:1px dashed var(--line2);border-radius:var(--r-lg)}
.empty .big{font-size:1rem;color:var(--text);margin-bottom:7px;font-weight:600}

.warn{background:#171112;border:1px solid #43302d;border-radius:var(--r);padding:12px 15px;color:#d6b0aa;font-size:.78125rem;line-height:1.55}
.note{background:#131316;border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;color:var(--muted);font-size:.78125rem;line-height:1.6}

input[type=text],input[type=number],input[type=date],select,textarea{
  background:#0d0d0f;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%;transition:border-color var(--dur)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--border)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label.fld{display:block;font-size:.625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 7px;font-weight:600}
.fld-amber input{border-color:#4d4630;background:#141209}
.fld-amber label.fld{color:var(--amber)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}

.dropzone{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--faint);background:none;font-size:.8125rem;transition:border-color var(--dur),color var(--dur),background var(--dur)}
.dropzone:hover{border-color:var(--border);color:var(--muted)}
.dropzone.hot{border-color:var(--muted);color:var(--text);background:var(--panel2)}
@media(hover:none){.dropzone.drag-only{display:none}}

/* loading */
.spinner{width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--muted);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;flex-shrink:0}
.loading{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:.8125rem;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- Modal ---------- */
#overlay{position:fixed;inset:0;display:none;z-index:50;overscroll-behavior:contain}
/* the scrim is its own layer so it can dim in step with the sheet (--scrim is driven by the spring) */
#overlay::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);opacity:var(--scrim,1)}
#overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
#overlay.closing,#overlay.closing .modal{pointer-events:none}
.modal{position:relative;background:var(--panel);border:1px solid var(--line2);border-top-color:#35353b;border-radius:var(--r-lg);width:100%;max-width:760px;box-shadow:0 32px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.4)}
.modal .mhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:1}
.modal .mhead h3{margin:0;font-size:.9375rem;font-weight:600}
.modal .mbody{padding:22px}
.closeX{margin-left:auto;background:none;border:0;color:var(--faint);font-size:1.375rem;line-height:1;transition:color var(--dur)}
.closeX:hover{color:var(--text)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.shot{position:relative;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#000}
.shot img{width:100%;display:block;cursor:zoom-in}
.shot .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.72);border:0;color:#fff;border-radius:5px;font-size:.6875rem;padding:2px 6px}

/* charts */
canvas{display:block;width:100%;touch-action:pan-y}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative}
.chartbox h4{margin:0 0 4px;font-size:.8125rem;font-weight:600;letter-spacing:.01em}
.chartbox .cap{font-size:.6875rem;color:var(--faint);margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:.6875rem;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.charttip{position:absolute;pointer-events:none;background:#0d0d0f;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.71875rem;font-family:var(--mono);color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5;white-space:nowrap;transform:translate(-50%,-118%);opacity:0;transition:opacity .12s}
.charttip.on{opacity:1}
.charttip .tl{color:var(--faint);font-size:.59375rem;letter-spacing:.06em;display:block;font-family:var(--sans)}
.rangebtns{display:inline-flex;gap:2px;background:none;border:1px solid var(--line2);border-radius:8px;padding:2px;margin-left:auto}
.rangebtns button{background:none;border:0;color:var(--muted);font-size:.6875rem;font-weight:600;padding:4px 10px;border-radius:6px;transition:background var(--dur),color var(--dur);letter-spacing:.04em}
.rangebtns button:hover{color:var(--text)}
.rangebtns button.on{background:var(--text);color:var(--bg)}

.insight{display:flex;gap:13px;padding:14px 16px;border:1px solid var(--line);border-left:2px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:10px}
.insight.good{border-left-color:var(--win)}
.insight .mk{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--muted);min-width:20px;line-height:1.4}
.insight.good .mk{color:var(--win-bright)}
.insight p{margin:0;font-size:.8125rem;line-height:1.6}
.insight .lab{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px;font-weight:600}
.insight .act{display:flex;gap:7px;margin-top:8px;font-size:.78125rem;color:var(--text);align-items:baseline}
.insight .act b{color:var(--muted);font-weight:600;flex-shrink:0}
.insight.good .act b{color:var(--win-bright)}

/* day-ahead */
.dayahead{border:1px solid var(--line);border-left:2px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:20px;background:var(--panel)}
.dayahead .doline{display:flex;gap:9px;font-size:.8125rem;margin-bottom:7px;align-items:baseline}
.dayahead .doline .ar{color:var(--muted);font-weight:600;flex-shrink:0}

/* daily debrief */
.debrief{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;background:var(--panel)}
.debrief .dbhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.debrief .dbtitle{margin:0;font-size:1.1875rem;letter-spacing:.01em;font-family:var(--mono)}
.dbtrades{display:flex;flex-direction:column;gap:6px;margin:11px 0 2px}
.dbtrade{display:flex;align-items:center;gap:10px;font-size:.78125rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#131316}
.debrief-card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#131316}
.md h4.mdh{margin:16px 0 7px;font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border:0;padding:0;display:block}
.md h4.mdh::before{content:none}
.md h4.mdh:first-child{margin-top:0}
.md .mdp{margin:0 0 9px;font-size:.8125rem;line-height:1.65}
.md .mdul{margin:0 0 10px;padding-left:20px}
.md .mdul li{margin:4px 0;font-size:.8125rem;line-height:1.6}
.md b{color:var(--text)}
.debrief.collapsible{padding:0;overflow:hidden}
.dbhead-row{display:flex;align-items:center;gap:11px;padding:15px 20px;cursor:pointer;transition:background var(--dur) var(--ease)}
.dbhead-row:hover{background:rgba(255,255,255,.025)}
.dbhead-row .chev{color:var(--faint);font-size:.6875rem;width:12px;flex-shrink:0}
.dbbody{padding:0 20px 18px}

.zone{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:10px;background:var(--panel)}
.zone>h2.sec:first-child{margin-top:0}

.check{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;background:var(--panel);transition:border-color var(--dur)}
.check input{margin-top:3px;width:auto}
.check .ttl{font-weight:600;font-size:.84375rem}
.check .desc{font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.5}
.check.auto-ok{border-color:#2c4638}
.check.auto-bad{border-color:#4a322f;background:#151011}

.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.78125rem}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{font-family:var(--mono);text-align:right;min-width:0;overflow-wrap:anywhere}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare .col{padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.compare .col.clean{border-color:#2c4638}
.compare .col.broken{border-color:#4a322f}
.compare h4{margin:0 0 10px;font-size:.8125rem;font-weight:600}

.levelrow{display:flex;gap:8px;margin-bottom:7px;align-items:center}
.levelrow input{flex:1}
.levelrow .lblw{width:120px;flex:none}

#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(10px) scale(.97);background:rgba(22,22,25,.8);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line2);border-top-color:rgba(255,255,255,.13);border-left:2px solid var(--muted);color:var(--text);padding:12px 18px;border-radius:var(--r);font-size:.8125rem;z-index:80;opacity:0;transition:opacity var(--dur-pg) var(--ease),transform .4s var(--spring);pointer-events:none;box-shadow:0 10px 32px rgba(0,0,0,.5);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#toast.good{border-left-color:var(--win-bright)}
#toast.bad{border-left-color:var(--accent-bright);color:#d6b0aa}

.bars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.barrow{display:grid;grid-template-columns:122px 1fr 86px;gap:10px;align-items:center;font-size:.75rem}
.barrow .track{background:#1a1a1d;border-radius:4px;height:16px;position:relative;overflow:hidden}
.barrow .fill{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .4s var(--ease)}
.barrow .val{text-align:right;font-family:var(--mono)}

.menutoggle{display:none!important}

/* ---------- Period strip ---------- */
.periodgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative;transition:border-color var(--dur)}
.pcard:hover{border-color:var(--border)}
.pcard .k{font-size:.59375rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pcard .v{font-family:var(--mono);font-size:1.5625rem;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1}
.pcard .sub{font-size:.6875rem;color:var(--muted);margin-top:5px}
.pcard .delta{font-size:.6875rem;font-family:var(--mono);font-weight:500;margin-top:4px}
.gauge{margin-top:11px}
.gauge .glabel{display:flex;justify-content:space-between;gap:8px;font-size:.5625rem;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.gauge .track{height:4px;border-radius:2px;background:#1d1d20;overflow:hidden}
.gauge .fill{height:100%;border-radius:2px;width:0;transition:width .6s var(--ease)}
.periodgrid .pcard,.cards .stat{animation:fadeRise .34s var(--ease) backwards}
.periodgrid .pcard:nth-child(2),.cards .stat:nth-child(2){animation-delay:.05s}
.periodgrid .pcard:nth-child(3),.cards .stat:nth-child(3){animation-delay:.10s}
.periodgrid .pcard:nth-child(4),.cards .stat:nth-child(4){animation-delay:.15s}

/* ---------- Lock banner ---------- */
#lockBanner{margin-bottom:18px}
#lockBanner:empty{display:none}
.lockbar{border-radius:var(--r);padding:14px 17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.84375rem}
.lockbar.stop{background:#171112;border:1px solid #4c332f;color:#d6a8a1}
.lockbar.cool{background:#16130c;border:1px solid #46402c;color:#cfc19a}
.lockbar.ok{background:#0f1512;border:1px solid #2c4638;color:#a8c9b6}
.lockbar .big{font-weight:600;font-size:.90625rem;letter-spacing:.01em}
.lockbar .cd{font-family:var(--mono);font-size:1.125rem;font-weight:600}
.lockbar .sep{opacity:.4}
.lockbar .spacer{flex:1}
.streakchip{display:inline-flex;align-items:center;gap:7px;font-size:.75rem;background:none;border:1px solid var(--line2);border-radius:20px;padding:4px 12px;color:var(--muted)}
.streakchip b{font-family:var(--mono);font-size:.875rem;color:var(--text)}
.streakchip .fire{color:var(--win-bright)}

/* ---------- Calendar ---------- */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.calhead .mname{font-weight:600;font-size:.875rem;min-width:140px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.calgrid .dow{font-size:.59375rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;padding:2px 0;font-weight:600}
.calcell{aspect-ratio:1/.82;border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;flex-direction:column;background:#131316;min-height:46px;overflow:hidden;transition:border-color var(--dur),transform var(--dur)}
.calcell.empty{background:transparent;border-color:transparent}
.calcell .dn{font-size:.6875rem;color:var(--muted)}
.calcell .cp{margin-top:auto;font-family:var(--mono);font-size:.75rem;font-weight:600;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.calcell .ct{font-size:.5625rem;color:var(--faint)}
.calcell.hot .dn{color:rgba(255,255,255,.92);font-weight:600}
.calcell.hot .cp{color:#fff}
.calcell.hot .ct{color:rgba(255,255,255,.75)}
.calcell.has{cursor:pointer}
.calcell.has:hover{border-color:var(--border);transform:translateY(-1px)}
.calcell.today{outline:1.5px solid var(--text);outline-offset:-1px}
.calcell.breach{box-shadow:inset 0 0 0 1.5px var(--amber)}
.capline{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:12px 0 4px;font-size:.78125rem}
.capline .capres b{font-family:var(--mono)}

/* ---------- Heatmap ---------- */
.heatwrap{overflow-x:auto}
.heatgrid{display:grid;gap:3px;font-size:.625rem}
.heatgrid .hh{color:var(--faint);text-align:center;font-family:var(--mono);font-size:.5625rem}
.heatgrid .rl{color:var(--faint);font-size:.625rem;display:flex;align-items:center;padding-right:6px}
.heatcell{height:20px;border-radius:4px;background:#161619;position:relative;transition:outline var(--dur)}
.heatcell.win-window{box-shadow:inset 0 0 0 1px #46402c}
.heatcell:hover{outline:1px solid var(--muted)}

/* ---------- Plan builder ---------- */
.plancard{border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:10px;background:var(--panel);transition:border-color var(--dur)}
.plancard.executed{border-color:#2c4638}
.plancard.skipped{opacity:.55}
.plancard .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.plancard .meta{font-size:.75rem;color:var(--muted)}
.statusbtns{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;padding:2px;gap:2px}
.statusbtns button{background:none;border:0;color:var(--muted);padding:4px 10px;font-size:.71875rem;border-radius:5px;transition:background var(--dur),color var(--dur)}
.statusbtns button:hover{color:var(--text)}
.statusbtns button.on{background:var(--text);color:var(--bg);font-weight:600}
.dev{font-size:.6875rem;font-family:var(--mono)}
.dev .off{color:var(--accent-bright)}
.dev .match{color:var(--win-bright)}
.calc-out{font-family:var(--mono);font-size:1.625rem;font-weight:600;letter-spacing:-.02em}
.wl-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}

@media(max-width:860px){
  #sidebar{padding:0 12px;padding-top:env(safe-area-inset-top,0px)}
  .brand{padding-right:12px}
  .navbtn{padding:14px 10px 12px;font-size:.78125rem}
  header{padding:20px 16px 0}
  .content{padding:14px 16px 56px}
  .compare{grid-template-columns:1fr}
}
@media(max-width:640px){
  .brand{display:none}
  .acctchip{display:none}
  .calgrid{gap:4px}
  .calcell{aspect-ratio:auto;min-height:56px;padding:6px}
  .calcell .dn{font-size:.625rem}
  .calcell .cp{font-size:.625rem;letter-spacing:-.02em}
  .calcell .ct{display:none}
}
@media(max-width:760px){
  .grid.two{grid-template-columns:1fr}
}
/* ============================================================
   FLUID INTERFACE PASS
   Response on press, sliding indicators, material depth,
   and the sheet/dialog presentation driven by the spring
   layer in the motion script below.
   ============================================================ */

/* ---------- Response: feedback on pointer-down, instant ---------- */
html{-webkit-tap-highlight-color:transparent}
a,button,input,select,textarea,label,tbody tr,.calcell.has,.dbhead-row,.dropzone{touch-action:manipulation}
.btn{transition:background var(--dur),border-color var(--dur),transform .32s var(--spring)}
.btn:active{transform:scale(.97);transition-duration:var(--dur),var(--dur),.09s}
.btn:disabled:active{transform:none}
button.tag-chip{transition:border-color var(--dur),color var(--dur),transform .32s var(--spring)}
button.tag-chip:active{transform:scale(.95);transition-duration:var(--dur),var(--dur),.09s}
.segmented button,.subtabs button,.rangebtns button,.statusbtns button{transition:background var(--dur),color var(--dur),transform .32s var(--spring)}
.segmented button:active,.subtabs button:active,.rangebtns button:active,.statusbtns button:active{transform:scale(.96);transition-duration:var(--dur),var(--dur),.09s}
.navbtn:active{color:var(--text);transition-duration:0s}
tbody tr:active{background:#1b1b1f;transition-duration:0s}
.dbhead-row:active{background:rgba(255,255,255,.05);transition-duration:0s}
.calcell.has:active{transform:scale(.97);transition-duration:.09s}
.closeX{width:36px;height:36px;margin:-8px -8px -8px auto;border-radius:50%;display:grid;place-items:center;flex:none;transition:color var(--dur),background var(--dur),transform .32s var(--spring)}
.closeX:hover{background:var(--panel2)}
.closeX:active{transform:scale(.9);transition-duration:var(--dur),var(--dur),.09s}
input:focus,select:focus,textarea:focus{border-color:var(--muted);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
input[type=text],input[type=number],input[type=date],select,textarea{transition:border-color var(--dur),box-shadow var(--dur)}
/* iOS zooms the page when a focused field is under 16px — keep touch fields at 16 */
@media(pointer:coarse){input[type=text],input[type=number],input[type=date],select,textarea{font-size:1rem}}

/* ---------- Sliding indicators: the selection travels, it doesn't jump ---------- */
nav{position:relative}
nav.thumbed::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--tw,0px);transform:translateX(var(--tx,0px));background:var(--text);border-radius:2px 2px 0 0;pointer-events:none}
nav.thumbed.thumb-anim::after{transition:transform .42s var(--spring),width .42s var(--spring)}
nav.thumbed .navbtn.active{border-bottom-color:transparent}
.segmented,.subtabs,.rangebtns,.statusbtns{position:relative;isolation:isolate}
/* The thumb sits above the labels and blends by difference, so a label reads
   dark-on-light exactly where the thumb covers it — mid-slide included. */
.segmented.thumbed::before,.subtabs.thumbed::before,.rangebtns.thumbed::before,.statusbtns.thumbed::before{content:"";position:absolute;z-index:1;left:0;top:0;width:var(--tw,0px);height:var(--th,0px);transform:translate(var(--tx,0px),var(--ty,0px));background:var(--text);border-radius:6px;mix-blend-mode:difference;pointer-events:none}
.segmented.thumbed.thumb-anim::before,.subtabs.thumbed.thumb-anim::before,.rangebtns.thumbed.thumb-anim::before,.statusbtns.thumbed.thumb-anim::before{transition:transform .38s var(--spring),width .38s var(--spring),height .38s var(--spring)}
.segmented.thumbed button.on,.subtabs.thumbed button.on,.subtabs.thumbed button.on:hover,.rangebtns.thumbed button.on,.statusbtns.thumbed button.on{background:transparent;color:var(--text)}

/* ---------- Materials: scroll-edge instead of a permanent divider ---------- */
#sidebar::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(rgba(0,0,0,.34),transparent);opacity:0;transition:opacity .25s ease;pointer-events:none}
#sidebar.scrolled{border-bottom-color:rgba(255,255,255,.07)}
#sidebar.scrolled::after{opacity:1}

/* ---------- Sheet: on a phone the detail view is a bottom sheet you can throw ---------- */
@media(max-width:640px){
  #overlay{touch-action:none}
  #overlay.open{align-items:flex-end;padding:0;overflow:hidden}
  .modal{display:flex;flex-direction:column;max-width:none;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;border-left:0;border-right:0;border-bottom:0;box-shadow:0 -14px 50px rgba(0,0,0,.6)}
  /* fills the gap under the sheet when it rubber-bands past its open position */
  .modal::after{content:"";position:absolute;left:0;right:0;top:100%;height:60vh;background:var(--panel)}
  .modal .mhead{position:relative;top:auto;flex:none;padding-top:26px;border-radius:18px 18px 0 0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
  .modal .mhead::before{content:"";position:absolute;top:9px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--border)}
  .modal .mbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  #overlay.closing .modal .mhead{pointer-events:auto}
}

/* ---------- Navigation extras ---------- */
.navbtn .lbl{display:block}
.navbtn.more{display:none}
.only-phone{display:none}
.modal:focus{outline:none}
.morelist{padding-top:6px!important}
.morerow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font-size:1rem;text-align:left;transition:background var(--dur)}
.morerow:last-child{border-bottom:0}
.morerow .ico{display:block;line-height:0;color:var(--muted)}
.morerow .lbl{flex:1}
.morerow .chev{color:var(--faint);font-size:1.25rem;line-height:1}
.morerow.on{font-weight:600}
.morerow.on .ico{color:var(--text)}
.morerow:active{background:var(--panel2);transition-duration:0s}

/* notch / rounded corners: keep the gutters clear when the page runs edge to edge */
@supports(padding:max(0px)){
  #sidebar{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  header,.content{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  @media(max-width:860px){
    #sidebar{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
    header,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  }
}

/* ---------- Phone: a bottom tab bar, with the rest behind More ---------- */
@media(max-width:640px){
  #app{padding-top:env(safe-area-inset-top,0px)}
  /* the bar is fixed to the viewport, so its old container must not filter or pad */
  #sidebar{position:static;height:0;padding:0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  #sidebar::after{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;overflow:visible;gap:0;justify-content:space-around;
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));
    background:rgba(14,14,16,.8);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(255,255,255,.08)}
  nav.thumbed::after{display:none}
  .navbtn{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;padding:5px 2px 4px;border:0;font-size:.625rem;font-weight:500;letter-spacing:.01em;transition:color var(--dur),transform .32s var(--spring)}
  .navbtn.active{font-weight:600}
  .navbtn:active{transform:scale(.92);transition-duration:0s,.09s}
  .navbtn .ico{display:block;line-height:0}
  .navbtn .ico svg{width:23px;height:23px}
  .navbtn.sec{display:none}
  .navbtn.more{display:flex}
  .content{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  header{padding-top:16px}
  .periodgrid{grid-template-columns:1fr 1fr;gap:10px}
  .pcard{padding:14px 13px}
  .pcard .v{font-size:1.375rem}
  .row>.only-phone{display:block}
  .subtabs{display:flex;flex-wrap:nowrap}
  .subtabs button{flex:1 1 auto;padding:7px 6px;text-align:center}
  .lockbar{padding:12px 14px;gap:8px 12px;font-size:.8125rem}
  .lockbar .spacer{display:none}
  .calhead{flex-wrap:wrap;gap:8px 10px}
  .calhead .mname{min-width:0;flex:1}
  .gauge .glabel{flex-direction:column;gap:2px}

  /* the trade log reads as a list of trades, not a table to scroll sideways */
  .logtable,.logtable tbody{display:block}
  .logtable thead{display:none}
  .logtable tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .logtable tr:last-child{border-bottom:0}
  .logtable td{padding:0;border:0;white-space:normal;font-size:.75rem}
  .logtable tr::before,.logtable tr::after{content:"";flex-basis:100%;height:0}
  .logtable td[data-k=symbol]{order:1}
  .logtable td[data-k=type]{order:2}
  .logtable td[data-k=R]{order:3;margin-left:auto;color:var(--muted)}
  .logtable td[data-k=R][data-empty]{visibility:hidden}
  .logtable td[data-k=pl]{order:4;font-size:.9375rem;font-weight:600;min-width:64px;text-align:right}
  .logtable tr::before{order:5}
  .logtable td[data-k=openTime]{order:6;color:var(--muted)}
  .logtable td[data-k=session]{order:7;color:var(--muted)}
  .logtable td[data-k=volume]{order:8;color:var(--muted)}
  .logtable td[data-k=durationMin]{order:9;color:var(--muted)}
  .logtable td[data-k=session]::before,.logtable td[data-k=volume]::before,.logtable td[data-k=durationMin]::before{content:"· ";color:var(--faint)}
  .logtable td[data-k=volume]::after{content:" lots"}
  .logtable td[data-k=R]:not([data-empty])::after{content:"R"}
  .logtable td[data-k=pips]{display:none}
  .logtable tr::after{order:10}
  .logtable td[data-k=flags]{order:11;flex-basis:100%}
  .logtable td[data-k=flags]:empty{display:none}
  .logtable td[data-k=flags] .pill{margin-right:5px}
}

/* ---------- Accessibility: gentler, not absent ---------- */
@media(prefers-reduced-motion:reduce){
  /* keep opacity and colour feedback; drop travel, scale and overshoot */
  .page.active,.tabbody.fadein,.periodgrid .pcard,.cards .stat{animation-name:fadeOnly;animation-duration:.2s;animation-delay:0s}
  .navbtn:active,.btn:active,button.tag-chip:active,.segmented button:active,.subtabs button:active,.rangebtns button:active,.statusbtns button:active,.calcell.has:active,.calcell.has:hover,.closeX:active{transform:none}
  nav.thumbed.thumb-anim::after,.thumbed.thumb-anim::before{transition:none}
  #toast,#toast.show{transform:translateX(-50%)}
  .barrow .fill,.gauge .fill{transition:none}
}
@media(prefers-reduced-transparency:reduce){
  #sidebar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  #overlay::before{background:rgba(0,0,0,.84);-webkit-backdrop-filter:none;backdrop-filter:none}
  #toast{background:#141416;-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media(prefers-contrast:more){
  :root{--line:#2e2e33;--line2:#47474e;--border:#6f6f78;--muted:#b9b9c0;--faint:#96969e}
  #sidebar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom-color:var(--border)}
  #overlay::before{background:rgba(0,0,0,.88);-webkit-backdrop-filter:none;backdrop-filter:none}
  #toast{background:#141416;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--border)}
  .modal{border-color:var(--border)}
}

<script>
/* ============================================================
   MOTION — springs, the sheet gesture, sliding indicators.
   Self-contained and dependency-free (the app stays offline).

   The rule all of it follows: motion starts from the value that is
   on screen right now, keeps the velocity it already has, and can be
   grabbed or reversed at any instant. Nothing here locks out input.

   Public surface, called by the app further down:
     presentModal()   show #overlay (dialog on desktop, sheet on a phone)
     dismissModal()   hide it along the path it arrived by
   ============================================================ */
(function(){
'use strict';
var overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
var bar=document.getElementById('sidebar'),nav=document.getElementById('nav');
var mqReduce=matchMedia('(prefers-reduced-motion: reduce)');
var mqSheet=matchMedia('(max-width: 640px)');
function clamp(n,a,b){return n<a?a:n>b?b:n;}

/* A spring on one number. Tuned with Apple's two designer parameters —
   damping ratio (1 = settles with no overshoot) and response (seconds) —
   instead of mass/stiffness/damping. Calling to() mid-flight keeps the live
   value and velocity, which is what makes every animation interruptible. */
function Spring(render){
  var x=0,v=0,target=0,k=0,c=0,prec=.5,raf=0,last=0,onRest=null;
  function tick(now){
    var dt=clamp((now-last)/1000,0,1);last=now;      // a late frame catches up instead of slowing the motion down
    while(dt>1e-6){var h=Math.min(dt,.004);v+=(-k*(x-target)-c*v)*h;x+=v*h;dt-=h;}
    if(Math.abs(x-target)<prec&&Math.abs(v)<prec*20){
      x=target;v=0;raf=0;render(x);
      var done=onRest;onRest=null;if(done)done();
      return;
    }
    render(x);raf=requestAnimationFrame(tick);
  }
  return{
    value:function(){return x;},
    moving:function(){return raf!==0;},
    /* the finger takes over: freeze where it is, forget the destination */
    stop:function(){if(raf){cancelAnimationFrame(raf);raf=0;}v=0;onRest=null;},
    set:function(n){this.stop();x=n;render(x);},
    to:function(n,o,done){
      var w=2*Math.PI/(o.response||.35);
      k=w*w;c=2*(o.damping==null?1:o.damping)*w;
      prec=o.precision||.5;target=n;onRest=done||null;
      if(o.velocity!=null)v=o.velocity;          // gesture hand-off; otherwise carry the live velocity
      if(!raf){last=performance.now();raf=requestAnimationFrame(tick);}
    }
  };
}

/* Where a flick would come to rest, by the same exponential decay scrolling uses. */
function project(velocity,rate){rate=rate||.998;return(velocity/1000)*rate/(1-rate);}
/* Past a boundary the sheet follows less and less — it resists, it doesn't stop dead. */
function rubberband(over,dim,k){k=k||.55;return(over*dim*k)/(dim+k*Math.abs(over));}

/* ---------- Modal: dialog on desktop, bottom sheet on a phone ---------- */
var state='closed';          // 'closed' | 'open' | 'closing'
var mode='dialog';           // 'dialog' | 'sheet' | 'fade' (reduced motion)
var H=1;                     // sheet travel in px
var handoff=null;            // release velocity passed from the drag to dismissModal
var lastPoint=null;          // where the user last pressed — the dialog grows from there
var returnFocus=null;        // what had focus before the dialog opened

function paint(n){
  if(mode==='sheet'){
    modal.style.transform='translate3d(0,'+n.toFixed(2)+'px,0)';
    overlay.style.setProperty('--scrim',clamp(1-n/H,0,1).toFixed(3));
  }else{
    var p=clamp(n,0,1);
    modal.style.opacity=p.toFixed(3);
    if(mode==='dialog')modal.style.transform='scale('+(.94+.06*n).toFixed(4)+')';
    overlay.style.setProperty('--scrim',p.toFixed(3));
  }
}
var sp=Spring(paint);
function pickMode(){return mqReduce.matches?'fade':mqSheet.matches?'sheet':'dialog';}
function clearInline(){modal.style.transform='';modal.style.opacity='';overlay.style.removeProperty('--scrim');}
function settleOpen(){if(state==='open'&&mode!=='sheet')modal.style.transform='';}
function finishClose(){
  state='closed';overlay.classList.remove('open','closing');
  clearInline();modal.style.transformOrigin='';
}

window.presentModal=function(){
  var fresh=state==='closed';
  var next=pickMode();
  if(fresh)returnFocus=document.activeElement;
  if(!fresh&&next!==mode){sp.stop();clearInline();fresh=true;}
  mode=next;state='open';
  overlay.classList.add('open');overlay.classList.remove('closing');
  if(!modal.contains(document.activeElement)){try{modal.focus({preventScroll:true});}catch(_){}}
  if(mode==='sheet'){
    if(fresh)modal.style.transform='';
    H=Math.max(1,modal.offsetHeight);
    if(fresh)sp.set(H);
    sp.to(0,{damping:1,response:.38});
    return;
  }
  if(fresh){
    if(mode==='dialog'){
      // anchor to the source: scale out of the row or button that was pressed
      var r=modal.getBoundingClientRect(),ox=r.width/2,oy=Math.min(r.height/2,220);
      if(lastPoint&&performance.now()-lastPoint.t<1500){ox=clamp(lastPoint.x-r.left,0,r.width);oy=clamp(lastPoint.y-r.top,0,r.height);}
      modal.style.transformOrigin=ox.toFixed(1)+'px '+oy.toFixed(1)+'px';
    }
    sp.set(0);
  }
  sp.to(1,{damping:1,response:mode==='fade'?.2:.34,precision:.002},settleOpen);
};

window.dismissModal=function(){
  if(state!=='open')return;
  state='closing';overlay.classList.add('closing');   // the page underneath is live again immediately
  if(returnFocus&&returnFocus.isConnected&&returnFocus.focus){try{returnFocus.focus({preventScroll:true});}catch(_){}}
  returnFocus=null;
  var vel=handoff;handoff=null;
  if(mode==='sheet'){
    H=Math.max(1,modal.offsetHeight);
    sp.to(H,{damping:1,response:.3,velocity:vel==null?undefined:vel},finishClose);
  }else{
    sp.to(0,{damping:1,response:mode==='fade'?.16:.26,precision:.002},finishClose);
  }
};
/* Tab stays inside the dialog while it is open */
document.addEventListener('keydown',function(e){
  if(e.key!=='Tab'||state!=='open')return;
  var f=[].filter.call(modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'),function(n){return !n.disabled&&n.offsetParent!==null;});
  if(!f.length){e.preventDefault();return;}
  var first=f[0],last=f[f.length-1],a=document.activeElement;
  if(!modal.contains(a)||a===modal){e.preventDefault();(e.shiftKey?last:first).focus();}
  else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
});
function requestClose(){if(typeof closeModal==='function')closeModal();else window.dismissModal();}

/* Sheet drag — 1:1 with the finger from the grabber/header, velocity kept at release. */
var drag=null,HYSTERESIS=6;
function sample(e){
  drag.hist.push({t:e.timeStamp,y:e.clientY});
  while(drag.hist.length>2&&e.timeStamp-drag.hist[0].t>100)drag.hist.shift();
}
function releaseVelocity(h,now){
  var a=h[0],b=h[h.length-1];
  if(h.length<2||now-b.t>80||b.t===a.t)return 0;   // the finger paused before lifting: no throw
  return(b.y-a.y)/(b.t-a.t)*1000;
}
modal.addEventListener('pointerdown',function(e){
  if(mode!=='sheet'||state==='closed'||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var head=e.target.closest&&e.target.closest('.mhead');
  if(!head||e.target.closest('button,a,input,select,textarea'))return;
  drag={id:e.pointerId,startY:e.clientY,base:sp.value(),active:false,hist:[],head:head};
  sample(e);
  H=Math.max(1,modal.offsetHeight);
  if(sp.moving()){
    // grabbed mid-flight — opening or closing — so it follows the finger from where it is
    sp.stop();drag.active=true;
    if(state==='closing'){state='open';overlay.classList.remove('closing');}
  }
  try{head.setPointerCapture(e.pointerId);}catch(_){}
});
modal.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  sample(e);
  if(!drag.active){
    if(Math.abs(e.clientY-drag.startY)<HYSTERESIS)return;
    drag.active=true;drag.startY=e.clientY;          // re-anchor so crossing the threshold doesn't jump
    drag.head.style.cursor='grabbing';
  }
  var y=drag.base+(e.clientY-drag.startY);
  if(y<0)y=-rubberband(-y,H);
  sp.set(y);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;d.head.style.cursor='';
  try{d.head.releasePointerCapture(e.pointerId);}catch(_){}
  if(!d.active)return;                               // it was a tap
  var vel=e.type==='pointercancel'?0:releaseVelocity(d.hist,e.timeStamp);
  var y=sp.value();
  // decide from where the throw would land, not from where the finger let go
  if(e.type!=='pointercancel'&&y+project(vel)>H*.5){handoff=vel;requestClose();}
  else sp.to(0,{response:.3,damping:Math.abs(vel)>400?.8:1,velocity:vel});
}
modal.addEventListener('pointerup',endDrag);
modal.addEventListener('pointercancel',endDrag);

function onModeChange(){
  if(state==='closed')return;
  sp.stop();drag=null;
  if(state==='closing'){finishClose();return;}
  mode=pickMode();clearInline();
}
[mqSheet,mqReduce].forEach(function(m){if(m.addEventListener)m.addEventListener('change',onModeChange);else if(m.addListener)m.addListener(onModeChange);});

/* ---------- Feedback on touch-down ---------- */
document.addEventListener('pointerdown',function(e){lastPoint={x:e.clientX,y:e.clientY,t:performance.now()};},true);
document.addEventListener('touchstart',function(){},{passive:true});   // lets :active fire on iOS

/* ---------- Scroll edge: the bar only separates once content is under it ---------- */
var scrolled=false;
function onScroll(){var s=(window.scrollY||document.documentElement.scrollTop)>4;if(s!==scrolled){scrolled=s;bar.classList.toggle('scrolled',s);}}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();

/* ---------- Sliding indicators for the nav and every segmented control ----------
   The app only toggles .active/.on. We measure the selected button and move a
   pseudo-element to it through custom properties, so no markup is added. */
var GROUPS='.segmented,.subtabs,.rangebtns,.statusbtns';
var placed=new WeakMap();
function place(box,cur,animate){
  if(!cur||!cur.offsetWidth){
    if(cur===null&&box.classList.contains('thumbed')){box.classList.remove('thumbed','thumb-anim');placed.delete(box);}
    return false;
  }
  var key=cur.offsetLeft+','+cur.offsetTop+','+cur.offsetWidth+','+cur.offsetHeight;
  var prev=placed.get(box);
  if(prev===key)return false;
  var glide=animate&&prev!==undefined;
  if(!glide&&box.classList.contains('thumb-anim'))box.classList.remove('thumb-anim');
  var s=box.style;
  s.setProperty('--tx',cur.offsetLeft+'px');s.setProperty('--ty',cur.offsetTop+'px');
  s.setProperty('--tw',cur.offsetWidth+'px');s.setProperty('--th',cur.offsetHeight+'px');
  if(!box.classList.contains('thumbed'))box.classList.add('thumbed');
  placed.set(box,key);
  if(!glide){void box.offsetWidth;requestAnimationFrame(function(){if(!box.classList.contains('thumb-anim'))box.classList.add('thumb-anim');});}
  return true;
}
function sync(animate){
  var active=nav.querySelector('.navbtn.active');
  if(place(nav,active,animate)&&active&&nav.scrollWidth>nav.clientWidth+1){
    // keep the current section in view in a scrolling tab bar
    var left=active.offsetLeft-(nav.clientWidth-active.offsetWidth)/2;
    try{nav.scrollTo({left:left,behavior:animate&&!mqReduce.matches?'smooth':'auto'});}catch(_){nav.scrollLeft=left;}
  }
  var boxes=document.querySelectorAll(GROUPS);
  for(var i=0;i<boxes.length;i++)place(boxes[i],boxes[i].querySelector(':scope > button.on'),animate);
}
var queued=0;
function queue(animate){
  if(queued){if(!animate)queued=2;return;}
  queued=animate?1:2;
  requestAnimationFrame(function(){var a=queued===1;queued=0;sync(a);});
}
function relevant(list){
  for(var i=0;i<list.length;i++){
    var m=list[i];
    if(m.type==='attributes'){
      var t=m.target;
      if(t===nav||t===bar||t===overlay||t===modal||t.id==='toast'||(t.matches&&t.matches(GROUPS)))continue;
      return true;
    }
    for(var j=0;j<m.addedNodes.length;j++)if(m.addedNodes[j].nodeType===1)return true;
  }
  return false;
}
if(window.MutationObserver){
  new MutationObserver(function(list){if(relevant(list))queue(true);})
    .observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
}
window.addEventListener('resize',function(){queue(false);},{passive:true});
window.addEventListener('load',function(){queue(false);});
queue(false);
})();
</script>

<script>
"use strict";
/* ============================================================
   AETHER — single-file trading journal
   Vanilla JS, IndexedDB, canvas charts. Offline-first.
   ============================================================ */

/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...kids)=>{const n=document.createElement(t);for(const k in a){if(k==='class')n.className=a[k];else if(k==='html')n.innerHTML=a[k];else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)n.setAttribute(k,a[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(c));}return n;};
const fmt=(n,d=2)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
/* Account currency, learned from the imported statement. Kept as a mutable
   symbol so every existing usd() call site formats correctly without change. */
const CUR_SYMBOLS={USD:'$',EUR:'€',GBP:'£',JPY:'¥',AUD:'A$',CAD:'C$',CHF:'CHF ',NZD:'NZ$',SGD:'S$',ZAR:'R',INR:'₹',AED:'AED '};
let CURSYM='$';
function setCurrency(code){CURSYM=CUR_SYMBOLS[String(code||'').toUpperCase()]||(code?code+' ':'$');}
const usd=n=>n==null||isNaN(n)?'—':(n<0?'-'+CURSYM:CURSYM)+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=n=>CURSYM+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null||isNaN(n)?'—':fmt(n,1)+'%';
const signCls=n=>n>0?'pos':n<0?'neg':'';
const escapeHtml=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* animated number count-up (respects reduced motion) */
function countUp(node,target,f,dur){dur=dur||650;if(REDUCED||target==null||!isFinite(target)){node.textContent=f(target);return;}const t0=performance.now();(function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);node.textContent=f(target*e);if(p<1)requestAnimationFrame(step);})(t0);}
let toastT;
function toast(msg,kind){const t=$('#toast');const bad=kind==='bad'||kind===true,good=kind==='good';t.textContent=(good?'✓  ':bad?'✕  ':'')+msg;t.className='show'+(bad?' bad':good?' good':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',Math.min(9000,Math.max(2800,1400+String(msg).length*55)));}

/* ---------- constants / config ---------- */
const SESSIONS=["Asian","London","NY","Late","Off"];
/* Defaults only — both are overwritten from saved settings on load, so the
   risk model and the setup vocabulary belong to whoever is using the app. */
const DEFAULT_SETUPS=["BOS","Liquidity sweep","Order block","Breaker block","Supply zone","Demand zone"];
const DEFAULT_RULES={maxRisk:5,scaleAfter:15,scaledRisk:3,drawback:6,dailyLoss:10,weeklyLoss:20,breakMins:60};
let SETUPS=DEFAULT_SETUPS.slice();
/* Whatever the user actually trades: learned from imported trades, plus any
   symbols they've added by hand in the planner or watchlist. */
let INSTRUMENTS=[];
function refreshInstruments(){
  const seen=new Set();
  (STATE.settings.instruments||[]).forEach(s=>s&&seen.add(s));
  (STATE.trades||[]).forEach(t=>t.symbol&&seen.add(t.symbol));
  ((STATE.settings.watchlist)||[]).forEach(w=>w&&w.symbol&&seen.add(w.symbol));
  Object.keys(STATE.settings.keyLevels||{}).forEach(s=>seen.add(s));
  INSTRUMENTS=[...seen].sort();
}
function renderSymFilter(){
  const host=document.getElementById('symFilter');if(!host)return;
  host.innerHTML='';
  host.append(el('button',{class:STATE.filter==='ALL'?'on':'','data-sym':'ALL'},'All'));
  INSTRUMENTS.forEach(s=>host.append(el('button',{class:STATE.filter===s?'on':'','data-sym':s},s)));
  host.style.visibility=INSTRUMENTS.length?'':'hidden';
}
let RULES=Object.assign({},DEFAULT_RULES);
function breakLabel(){const m=RULES.breakMins;return m%60===0?(m/60)+'-hour':m+'-minute';}
function applyUserConfig(){
  RULES=Object.assign({},DEFAULT_RULES,STATE.settings.rules||{});
  setCurrency((STATE.account&&STATE.account.currency)||STATE.settings.currency);
  const sf=document.getElementById('sidefootCaps');
  if(sf)sf.textContent=amt(RULES.dailyLoss)+' daily · '+amt(RULES.weeklyLoss)+' weekly cap';
  refreshInstruments();
  if(STATE.filter!=='ALL'&&!INSTRUMENTS.includes(STATE.filter))STATE.filter='ALL';
  renderSymFilter();
  const s=STATE.settings.setups;
  SETUPS=(Array.isArray(s)&&s.length)?s.slice():DEFAULT_SETUPS.slice();
}
const FX_CCY='USD|EUR|GBP|JPY|AUD|NZD|CAD|CHF|SGD|HKD|SEK|NOK|DKK|PLN|CZK|HUF|MXN|ZAR|TRY|CNH|CNY|INR|THB|ILS';
const FX_RE=new RegExp('^(?:'+FX_CCY+')(?:'+FX_CCY+')','i');
/* how an instrument's moves are counted (pip/point size) and how its prices print (dp) */
function symInfo(s){
  s=String(s||'');
  if(/JPY/i.test(s))return{label:'pips',size:0.01,dp:3,cls:'gbp'};
  if(FX_RE.test(s))return{label:'pips',size:0.0001,dp:5,cls:''};          // EURUSD, GBPUSD… (broker suffixes allowed)
  return{label:'pts',size:1,dp:2,cls:/^XAUUSD/i.test(s)?'xau':''};        // metals, indices, crypto, CFDs
}

/* ---------- IndexedDB ---------- */
const DB={db:null};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('aether',4);
  r.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('trades'))db.createObjectStore('trades',{keyPath:'ticket'});
    if(!db.objectStoreNames.contains('images')){const s=db.createObjectStore('images',{keyPath:'id'});s.createIndex('ticket','ticket');}
    if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});
    if(!db.objectStoreNames.contains('plans'))db.createObjectStore('plans',{keyPath:'id'});
    if(!db.objectStoreNames.contains('debriefs'))db.createObjectStore('debriefs',{keyPath:'date'});
    if(!db.objectStoreNames.contains('livetrades'))db.createObjectStore('livetrades',{keyPath:'id'});
  };
  r.onsuccess=e=>{DB.db=e.target.result;res();};r.onerror=e=>rej(e.target.error);});}
function tx(store,mode='readonly'){return DB.db.transaction(store,mode).objectStore(store);}
function idbAll(store){return new Promise((res,rej)=>{const out=[];const c=tx(store).openCursor();c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};c.onerror=e=>rej(e.target.error);});}
function idbPut(store,val){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>res();r.onerror=e=>rej(e.target.error);});}
function idbGet(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);});}
function idbDel(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=e=>rej(e.target.error);});}
function idbByIndex(store,index,key){return new Promise((res,rej)=>{const out=[];const c=tx(store).index(index).openCursor(IDBKeyRange.only(key));c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};c.onerror=e=>rej(e.target.error);});}
