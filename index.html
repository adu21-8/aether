/* ============================================================
   MT5 PARSER  (validated against real MT5 Trade History Report exports)
   ============================================================ */
function decodeEntities(s){return String(s).replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/\s+/g,' ').trim();}
function stripTags(s){return decodeEntities(String(s).replace(/<[^>]*>/g,''));}
function pnum(s){if(s==null)return null;const t=String(s).replace(/[^0-9.\-]/g,'');if(t===''||t==='-'||t==='.')return null;const v=parseFloat(t);return isNaN(v)?null:v;}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function parseMT5(html){
  const r={account:{},trades:[],summary:{}};
  const grabHead=label=>{const m=html.match(new RegExp('>\\s*'+escRe(label)+'\\s*<\\/th>\\s*<th[^>]*>([\\s\\S]*?)<\\/th>','i'));return m?stripTags(m[1]):null;};
  r.account.name=grabHead('Name:');
  const acct=grabHead('Account:');r.account.raw=acct;
  if(acct){const m=acct.match(/^(\d+)\s*\(([^)]*)\)/);if(m){r.account.number=m[1];const p=m[2].split(',').map(x=>x.trim());r.account.currency=p[0]||null;r.account.server=p[1]||null;r.account.kind=p.slice(2).join(', ')||null;}else r.account.number=acct;}
  r.account.company=grabHead('Company:');
  r.account.reportDate=grabHead('Date:');
  // leverage may appear in some statements
  const lev=html.match(/Leverage[:\s]*<\/[^>]*>\s*<[^>]*>\s*<b>([\s\S]*?)<\/b>/i);if(lev)r.account.leverage=stripTags(lev[1]);

  // Positions section only
  const posIdx=html.search(/<b>\s*Positions\s*<\/b>/i);
  const ordIdx=html.search(/<b>\s*Orders\s*<\/b>/i);
  const dealIdx=html.search(/<b>\s*Deals\s*<\/b>/i);
  if(posIdx<0) throw new Error("No 'Positions' section found — is this an MT5 Trade History Report?");
  let end=html.length;
  if(ordIdx>posIdx)end=ordIdx;else if(dealIdx>posIdx)end=dealIdx;
  const section=html.slice(posIdx,end);

  const rowRe=/<tr[^>]*align="right"[^>]*>([\s\S]*?)<\/tr>/gi;let rm;
  while((rm=rowRe.exec(section))){
    const cellsRaw=[...rm[1].matchAll(/<td([^>]*)>([\s\S]*?)<\/td>/gi)];
    const cells=cellsRaw.filter(c=>!/class\s*=\s*"[^"]*hidden/i.test(c[1])).map(c=>stripTags(c[2]));
    if(cells.length<13)continue;
    const ticket=cells[1], type=(cells[3]||'').toLowerCase();
    if(!/^\d+$/.test(ticket))continue;
    if(type!=='buy'&&type!=='sell')continue;
    r.trades.push({ticket,openTime:cells[0],symbol:cells[2],type,
      volume:pnum(cells[4]),openPrice:pnum(cells[5]),sl:pnum(cells[6]),tp:pnum(cells[7]),
      closeTime:cells[8],closePrice:pnum(cells[9]),commission:pnum(cells[10]),swap:pnum(cells[11]),profit:pnum(cells[12])});
  }

  const sg=label=>{const m=html.match(new RegExp(escRe(label)+'\\s*<\\/td>\\s*<td[^>]*>\\s*<b>([\\s\\S]*?)<\\/b>','i'));return m?stripTags(m[1]):null;};
  const S=r.summary;
  S.balance=sg('Balance:');S.equity=sg('Equity:');S.freeMargin=sg('Free Margin:');S.floatingPL=sg('Floating P/L:');
  S.netProfit=sg('Total Net Profit:');S.grossProfit=sg('Gross Profit:');S.grossLoss=sg('Gross Loss:');
  S.profitFactor=sg('Profit Factor:');S.expectedPayoff=sg('Expected Payoff:');S.recoveryFactor=sg('Recovery Factor:');S.sharpe=sg('Sharpe Ratio:');
  S.ddAbsolute=sg('Balance Drawdown Absolute:');S.ddMaximal=sg('Balance Drawdown Maximal:');S.ddRelative=sg('Balance Drawdown Relative:');
  S.totalTrades=sg('Total Trades:');S.shortTrades=sg('Short Trades (won %):');S.longTrades=sg('Long Trades (won %):');
  S.profitTrades=sg('Profit Trades (% of total):');S.lossTrades=sg('Loss Trades (% of total):');
  S.largestProfit=sg('Largest profit trade:');S.largestLoss=sg('Largest loss trade:');
  S.avgProfit=sg('Average profit trade:');S.avgLoss=sg('Average loss trade:');
  S.maxConsecWins=sg('Maximum consecutive wins ($):');S.maxConsecLosses=sg('Maximum consecutive losses ($):');
  return r;
}

/* read an MT5 file handling UTF-16 LE BOM (and falling back to UTF-8) */
function readMT5File(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const buf=fr.result;const bytes=new Uint8Array(buf);
      let text;
      if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE){text=new TextDecoder('utf-16le').decode(buf);}
      else if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF){text=new TextDecoder('utf-16be').decode(buf);}
      else {
        // heuristic: lots of NUL bytes => utf-16le without BOM
        let nul=0;for(let i=1;i<Math.min(bytes.length,400);i+=2)if(bytes[i]===0)nul++;
        text=nul>80?new TextDecoder('utf-16le').decode(buf):new TextDecoder('utf-8').decode(buf);
      }
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      res(text);
    };
    fr.onerror=()=>rej(fr.error);
    fr.readAsArrayBuffer(file);
  });
}

/* ============================================================
   ENRICHMENT — per-trade derived fields
   ============================================================ */
function parseMT5Date(str){ // accepts MT5 "2026.06.01 11:01:04" and eToro "01-06-2026 11:01:04"
  if(!str)return null;
  let m=str.match(/(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
  if(m)return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]||0);
  m=str.match(/(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
  if(m)return Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]||0);
  return null;
}
function shifted(ms){return ms==null?null:new Date(ms+(STATE.settings.brokerOffsetHours||0)*3600e3);}
/* A real timestamp, moved onto the statement's clock. Trade times are the broker's
   wall-clock read as if it were UTC, and brokerOffsetHours maps that clock onto the
   trader's own. So a real moment lands on the statement clock as the device's
   wall-clock (read the same way) minus that offset. The result compares directly
   with openMs/closeMs, and shifted(nowStmt()) is the trader's local date and time.
   Using Date.now() raw here is what made "today" and the stopout break drift by
   the broker's UTC offset. */
function toStmt(ms){return ms-new Date(ms).getTimezoneOffset()*60000-(STATE.settings.brokerOffsetHours||0)*3600e3;}
function nowStmt(){return toStmt(Date.now());}
function sessionFor(ms){const d=shifted(ms);if(!d)return'Off';const h=d.getUTCHours();
  if(h>=3&&h<11)return'Asian';if(h>=11&&h<16)return'London';if(h>=16&&h<24)return'NY';return'Late';}
function dayKey(ms){const d=shifted(ms);if(!d)return'';return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function isoWeek(ms){const d=shifted(ms);if(!d)return'';const dt=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const dn=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-dn+3);const f=new Date(Date.UTC(dt.getUTCFullYear(),0,4));const wk=1+Math.round(((dt-f)/86400000-3+((f.getUTCDay()+6)%7))/7);return dt.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function weekday(ms){const d=shifted(ms);return d?WD[d.getUTCDay()]:'';}

function enrich(t){
  const e=Object.assign({},t);
  e.broker=t.broker||'MT5';
  e.violations=t.violations||[];e.ruleBroken=!!t.ruleBroken;e.revenge=!!t.revenge;
  e.openMs=parseMT5Date(t.openTime);e.closeMs=parseMT5Date(t.closeTime);
  e.durationMin=(e.openMs!=null&&e.closeMs!=null)?Math.max(0,Math.round((e.closeMs-e.openMs)/60000)):null;
  const info=symInfo(t.symbol);e.unit=info.label;e.symCls=info.cls;
  const dir=t.type==='buy'?1:-1;
  e.priceMove=(t.closePrice!=null&&t.openPrice!=null)?dir*(t.closePrice-t.openPrice):null;
  e.pips=e.priceMove!=null?+(e.priceMove/info.size).toFixed(1):null;
  e.net=(t.profit||0)+(t.commission||0)+(t.swap||0); // many brokers report profit already net of comm/swap; keep raw profit as primary
  e.pl=t.profit==null?0:t.profit;
  e.win=e.pl>0; e.loss=e.pl<0;
  e.autoSession=sessionFor(e.openMs);
  e.session=e.session||e.autoSession;
  // R from SL (price-based) — robust without pip $ value
  if(t.sl!=null&&t.openPrice!=null&&Math.abs(t.openPrice-t.sl)>0&&e.priceMove!=null){
    e.rFromSL=+(e.priceMove/Math.abs(t.openPrice-t.sl)).toFixed(2);
  } else e.rFromSL=null;
  // effective R: user actualR > rFromSL > (profit/riskUSD)
  if(e.actualR!=null&&!isNaN(e.actualR))e.R=+e.actualR;
  else if(e.rFromSL!=null)e.R=e.rFromSL;
  else if(e.riskUSD>0)e.R=+(e.pl/e.riskUSD).toFixed(2);
  else e.R=null;
  e.dayKey=dayKey(e.openMs);e.weekKey=isoWeek(e.openMs);e.weekday=weekday(e.openMs);
  e.hour=shifted(e.openMs)?shifted(e.openMs).getUTCHours():null;
  return e;
}

/* ============================================================
   RULE ENGINE — pooled across all instruments
   ============================================================ */
function runRules(trades){
  const ts=trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  const dayPL={},dayCount={},weekPL={};
  ts.forEach(t=>{dayPL[t.dayKey]=(dayPL[t.dayKey]||0)+t.pl;dayCount[t.dayKey]=(dayCount[t.dayKey]||0)+1;weekPL[t.weekKey]=(weekPL[t.weekKey]||0)+t.pl;});
  let lastLossClose=null;
  ts.forEach(t=>{
    const v=[];
    // realized loss bigger than the $5 cap -> stop wasn't where it should be
    if(t.pl < -(RULES.maxRisk+0.05)) v.push({code:'loss>cap',label:'Loss exceeded the '+amt(RULES.maxRisk)+' cap',hard:true});
    // entered risk over cap
    if(t.riskUSD!=null&&t.riskUSD>RULES.maxRisk+0.001) v.push({code:'risk>5',label:'Planned risk over '+amt(RULES.maxRisk),hard:true});
    // kept trading AFTER the daily cap was already realized (forward-looking, pooled)
    const dayRealBefore=ts.filter(o=>o.dayKey===t.dayKey&&o.closeMs!=null&&t.openMs!=null&&o.closeMs<=t.openMs).reduce((a,o)=>a+o.pl,0);
    if(dayRealBefore<=-RULES.dailyLoss) v.push({code:'daily',label:'Traded after the −'+amt(RULES.dailyLoss)+' daily cap',hard:true});
    // kept trading AFTER the weekly cap was already realized
    const weekRealBefore=ts.filter(o=>o.weekKey===t.weekKey&&o.closeMs!=null&&t.openMs!=null&&o.closeMs<=t.openMs).reduce((a,o)=>a+o.pl,0);
    if(weekRealBefore<=-RULES.weeklyLoss) v.push({code:'weekly',label:'Traded after the −'+amt(RULES.weeklyLoss)+' weekly cap',hard:true});
    // revenge: opened within 60min of a prior stopout (loss) close
    if(lastLossClose!=null&&t.openMs!=null){const gap=(t.openMs-lastLossClose)/60000;if(gap>=0&&gap<RULES.breakMins)v.push({code:'revenge',label:'Revenge (inside the '+breakLabel()+' break)',hard:true});}

    t.violations=v;
    t.revenge=v.some(x=>x.code==='revenge');
    t.ruleBroken=v.some(x=>x.hard);
    if(t.loss&&t.closeMs!=null) lastLossClose=Math.max(lastLossClose||0,t.closeMs);
  });
  return {dayPL,dayCount,weekPL};
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function groupStats(list){
  const n=list.length, wins=list.filter(t=>t.win), losses=list.filter(t=>t.loss);
  const gp=wins.reduce((a,t)=>a+t.pl,0), gl=losses.reduce((a,t)=>a+t.pl,0);
  const total=list.reduce((a,t)=>a+t.pl,0);
  const rs=list.filter(t=>t.R!=null).map(t=>t.R);
  return {
    n, wins:wins.length, losses:losses.length,
    winRate:n?wins.length/n*100:null,
    total, gp, gl,
    profitFactor: gl!==0?Math.abs(gp/gl):(gp>0?Infinity:null),
    avgWin: wins.length?gp/wins.length:null,
    avgLoss: losses.length?gl/losses.length:null,
    expDollar: n?total/n:null,
    expR: rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    rCount: rs.length
  };
}
function maxDrawdown(list){ // on cumulative P&L curve, by close time
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let cum=0,peak=0,mdd=0;s.forEach(t=>{cum+=t.pl;peak=Math.max(peak,cum);mdd=Math.min(mdd,cum-peak);});return mdd;
}
function streaks(list){
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let w=0,l=0,mw=0,ml=0;s.forEach(t=>{if(t.win){w++;l=0;mw=Math.max(mw,w);}else if(t.loss){l++;w=0;ml=Math.max(ml,l);}else{w=0;l=0;}});return{maxWin:mw,maxLoss:ml};
}
function equitySeries(list){
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let cum=0;return s.map(t=>{cum+=t.pl;return{ms:t.closeMs,y:cum,t};});
}
/* consecutive clean trading days (ending at most recent trading day). A clean day = had trades, none with a hard violation */
function cleanDayStreak(list){
  const byDay={};list.forEach(t=>{(byDay[t.dayKey]=byDay[t.dayKey]||[]).push(t);});
  const days=Object.keys(byDay).filter(Boolean).sort();
  let streak=0;
  for(let i=days.length-1;i>=0;i--){const clean=byDay[days[i]].every(t=>!t.ruleBroken);if(clean)streak++;else break;}
  const totalClean=days.filter(d=>byDay[d].every(t=>!t.ruleBroken)).length;
  return {streak,totalClean,totalDays:days.length};
}
/* drawdown episodes on the cumulative P&L curve (by close time) */
function drawdownEpisodes(list){
  const s=equitySeries(list);if(!s.length)return{episodes:[],current:null,worst:null,avgRecoverBars:null};
  let peak=s[0].y,peakIdx=0,inDD=false,startIdx=0,trough=peak,episodes=[];
  for(let i=0;i<s.length;i++){const y=s[i].y;
    if(y>=peak){if(inDD){episodes.push({startIdx,recoverIdx:i,depth:trough-peak,bars:i-startIdx,recovered:true});inDD=false;}peak=y;peakIdx=i;}
    else{if(!inDD){inDD=true;startIdx=peakIdx;trough=y;}else trough=Math.min(trough,y);}
  }
  let current=null;
  if(inDD)current={depth:trough-peak,bars:(s.length-1)-startIdx,recovered:false};
  const recovered=episodes.filter(e=>e.recovered);
  const worst=[...episodes,...(current?[current]:[])].sort((a,b)=>a.depth-b.depth)[0]||null;
  const avgRecoverBars=recovered.length?recovered.reduce((a,e)=>a+e.bars,0)/recovered.length:null;
  return {episodes,current,worst,avgRecoverBars,count:episodes.length};
}
/* ---------- period analytics (today / week / month rollups) ---------- */
function addDaysKey(key,delta){const p=key.split('-').map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]+delta));return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');}
function periodKeys(){
  const t=todayKeyLocal(),now=nowStmt();
  const p=t.split('-').map(Number);
  const lm=new Date(Date.UTC(p[0],p[1]-2,1));
  return {today:t,yesterday:addDaysKey(t,-1),
    week:isoWeek(now),lastWeek:isoWeek(now-7*864e5),
    month:t.slice(0,7),lastMonth:lm.getUTCFullYear()+'-'+String(lm.getUTCMonth()+1).padStart(2,'0')};
}
function bucketStats(list,pred){
  const s=list.filter(pred);
  const pl=s.reduce((a,t)=>a+t.pl,0),wins=s.filter(t=>t.win).length;
  return {pl,n:s.length,wins,winRate:s.length?wins/s.length*100:null};
}
/* per-day P&L quality: green-day rate, best/worst day, average green/red day */
function dayQuality(list){
  const byDay={};list.forEach(t=>{if(t.dayKey)byDay[t.dayKey]=(byDay[t.dayKey]||0)+t.pl;});
  const days=Object.entries(byDay);
  if(!days.length)return null;
  const green=days.filter(d=>d[1]>0),red=days.filter(d=>d[1]<0);
  const best=days.slice().sort((a,b)=>b[1]-a[1])[0],worst=days.slice().sort((a,b)=>a[1]-b[1])[0];
  return {days:days.length,green:green.length,red:red.length,greenRate:green.length/days.length*100,
    best:{date:best[0],pl:best[1]},worst:{date:worst[0],pl:worst[1]},
    avgGreen:green.length?green.reduce((a,d)=>a+d[1],0)/green.length:null,
    avgRed:red.length?red.reduce((a,d)=>a+d[1],0)/red.length:null};
}

/* live pooled status for "now" in display tz */
function liveStatus(){
  const now=nowStmt();const dnow=shifted(now);
  const tKey=dnow.getUTCFullYear()+'-'+String(dnow.getUTCMonth()+1).padStart(2,'0')+'-'+String(dnow.getUTCDate()).padStart(2,'0');
  const wKey=isoWeek(now);
  const todays=STATE.trades.filter(t=>t.dayKey===tKey);
  const weeks=STATE.trades.filter(t=>t.weekKey===wKey);
  const dayPL=todays.reduce((a,t)=>a+t.pl,0),weekPL=weeks.reduce((a,t)=>a+t.pl,0);
  const lastLoss=STATE.trades.filter(t=>t.loss&&t.closeMs!=null).sort((a,b)=>b.closeMs-a.closeMs)[0];
  const sinceLoss=lastLoss?(now-lastLoss.closeMs)/60000:null;
  const inBreak=sinceLoss!=null&&sinceLoss>=0&&sinceLoss<RULES.breakMins;
  // room = how much more you can lose before the cap trips (dayPL + cap; 0 or less = breached)
  const roomDaily=dayPL+RULES.dailyLoss, roomWeekly=weekPL+RULES.weeklyLoss;
  return {tKey,wKey,todays,weeks,dayPL,weekPL,sinceLoss,inBreak,
    roomDaily,roomWeekly,
    dailyHit:dayPL<=-RULES.dailyLoss,weeklyHit:weekPL<=-RULES.weeklyLoss,
    scaled:dayPL>=RULES.scaleAfter};
}
let lockTimer=null;
function renderLockBanner(){
  const host=$('#lockBanner');if(!host)return;
  if(!STATE.trades.length){host.innerHTML='';return;}
  const s=liveStatus();
  const stk=cleanDayStreak(STATE.trades);
  const streakChip=`<span class="streakchip">${stk.streak>0?'<span class="fire">●</span>':'<span style="color:var(--faint)">○</span>'} <b>${stk.streak}</b>&nbsp;clean-day streak</span>`;
  let cls,msg,cd='';
  // the binding constraint is whichever cap has less loss room left
  const weeklyTighter=s.roomWeekly<s.roomDaily;
  const room=Math.max(0,weeklyTighter?s.roomWeekly:s.roomDaily);
  const capName=weeklyTighter?('weekly −'+amt(RULES.weeklyLoss)):('daily −'+amt(RULES.dailyLoss));
  if(s.dailyHit||s.weeklyHit){
    cls='stop';
    if(s.weeklyHit) msg=`<span class="big">⛔ Weekly loss cap (−${amt(RULES.weeklyLoss)}) breached.</span> <span>Week P&L ${usd(s.weekPL)}. Done for the week — walk away.</span>`;
    else            msg=`<span class="big">⛔ Daily loss cap (−${amt(RULES.dailyLoss)}) breached.</span> <span>Day P&L ${usd(s.dayPL)}. Walk away — no more entries today.</span>`;
  } else if(s.inBreak){
    cls='cool';const left=Math.max(0,Math.ceil(RULES.breakMins-s.sinceLoss));
    cd=`<span class="cd">${left}m</span>`;
    msg=`<span class="big">⏳ Cooldown after stopout.</span> <span>${breakLabel()} break — no entries for</span>`;
  } else if(room<=RULES.maxRisk){
    cls='cool';
    msg=`<span class="big">⚠ ${usd(room)} of loss room left.</span> <span>Only ${usd(room)} before the ${capName} cap · day P&L ${usd(s.dayPL)}. One more loser closes you out — trade carefully.</span>`;
  } else {
    cls='ok';
    msg=`<span class="big">✓ Clear to trade.</span> <span>${usd(room)} of loss room before the ${capName} cap · day P&L ${usd(s.dayPL)} · ${s.scaled?'scaled mode (risk '+amt(RULES.scaledRisk)+', '+amt(RULES.drawback)+' lock-in)':'risk up to '+amt(RULES.maxRisk)}</span>`;
  }
  host.innerHTML=`<div class="lockbar ${cls}">${msg} ${cd}<span class="spacer"></span>${streakChip}</div>`;
  clearTimeout(lockTimer);lockTimer=setTimeout(renderLockBanner,30000);
}

/* ============================================================
   CANVAS CHARTS
   ============================================================ */
function setupCanvas(c,h){const w=c.clientWidth||c.parentElement.clientWidth-32;const dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const ctx=c.getContext('2d');ctx.scale(dpr,dpr);return{ctx,w,h};}
const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();

/* chart registry — every chart re-draws (without animation) on window resize */
const CHARTS=new Map();
let chartRszT=null;
window.addEventListener('resize',()=>{clearTimeout(chartRszT);chartRszT=setTimeout(()=>{for(const[c,fn]of CHARTS){if(!c.isConnected)CHARTS.delete(c);else fn(false);}},160);});
function chartTip(canvas){
  const box=canvas.parentElement;
  let tip=box.querySelector('.charttip');
  if(!tip){tip=el('div',{class:'charttip'});box.append(tip);}
  return tip;
}
/* hover on a desktop, touch-and-scrub on a phone (the canvas keeps vertical scrolling) */
function chartHover(canvas,onMove,onLeave){
  let t=0;
  const move=e=>{clearTimeout(t);onMove(e);};
  canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',move);
  const leave=e=>{clearTimeout(t);if(e.pointerType==='mouse')onLeave();else t=setTimeout(onLeave,1800);};
  canvas.addEventListener('pointerleave',leave);canvas.addEventListener('pointercancel',leave);
}
function animFrames(frame,animate,dur){
  if(!animate||REDUCED){frame(1);return;}
  const t0=performance.now();
  (function tick(now){const p=Math.min(1,(now-t0)/(dur||500));frame(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(tick);})(t0);
}

function lineChart(canvas,series,opts={}){
  const draw=animate=>{
    const {ctx,w,h}=setupCanvas(canvas,opts.height||220);
    const pad={l:54,r:14,t:12,b:24};
    const plotW=w-pad.l-pad.r, plotH=h-pad.t-pad.b;
    const all=series.flatMap(s=>s.points);
    if(!all.length){ctx.clearRect(0,0,w,h);ctx.fillStyle=CSSV('--faint');ctx.font='12px sans-serif';ctx.fillText('No closed trades',pad.l,h/2);canvas._hit=null;return;}
    const ys=all.map(p=>p.y);let ymin=Math.min(0,...ys),ymax=Math.max(0,...ys);if(ymin===ymax){ymax+=1;ymin-=1;}
    const xs=all.map(p=>p.x);const xmin=Math.min(...xs),xmax=Math.max(...xs)||xmin+1;
    const X=v=>pad.l+(xmax===xmin?plotW/2:(v-xmin)/(xmax-xmin)*plotW);
    const Y=v=>pad.t+(1-(v-ymin)/(ymax-ymin))*plotH;
    const frame=prog=>{
      ctx.clearRect(0,0,w,h);
      // grid + y labels
      ctx.strokeStyle='#222226';ctx.font='10px '+CSSV('--mono');ctx.textAlign='right';ctx.textBaseline='middle';
      const ticks=5;for(let i=0;i<=ticks;i++){const v=ymin+(ymax-ymin)*i/ticks;const y=Y(v);ctx.globalAlpha=v===0?.5:.25;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=v===0?CSSV('--muted'):CSSV('--faint');ctx.fillText((v<0?'-':'')+CURSYM+Math.abs(v).toFixed(0),pad.l-7,y);}
      // draw-on reveal
      ctx.save();ctx.beginPath();ctx.rect(0,0,pad.l+plotW*prog+3,h);ctx.clip();
      // soft fill under the primary series — fades with distance from the zero line
      const s0=series[0];
      if(opts.fill&&s0&&s0.points.length>1){
        const hexA=(c,a)=>{const m=String(c).trim().match(/^#([0-9a-f]{6})$/i);if(!m)return c;const n=parseInt(m[1],16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';};
        const zp=Math.min(.99,Math.max(.01,(Y(0)-pad.t)/plotH));
        const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+plotH);
        grad.addColorStop(0,hexA(s0.color,.02));grad.addColorStop(zp,hexA(s0.color,.14));grad.addColorStop(1,hexA(s0.color,.02));
        ctx.fillStyle=grad;ctx.beginPath();
        s0.points.forEach((p,i)=>{const x=X(p.x),y=Y(p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
        ctx.lineTo(X(s0.points[s0.points.length-1].x),Y(0));ctx.lineTo(X(s0.points[0].x),Y(0));
        ctx.closePath();ctx.fill();
      }
      // lines
      series.forEach(s=>{if(!s.points.length)return;ctx.strokeStyle=s.color;ctx.lineWidth=s.width||2;ctx.setLineDash(s.dash||[]);ctx.beginPath();s.points.forEach((p,i)=>{const x=X(p.x),y=Y(p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.setLineDash([]);
        const last=s.points[s.points.length-1];ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(X(last.x),Y(last.y),3,0,7);ctx.fill();});
      ctx.restore();
    };
    animFrames(frame,animate,520);
    canvas._hit={X,Y,pad,plotW,plotH,series,frame,ctx};
  };
  CHARTS.set(canvas,draw);
  draw(true);
  if(!canvas._hoverBound){
    canvas._hoverBound=true;
    chartHover(canvas,e=>{
      const hit=canvas._hit;if(!hit)return;
      const tip=chartTip(canvas);
      const r=canvas.getBoundingClientRect();const mx=e.clientX-r.left;
      const pts=hit.series[0].points;if(!pts.length)return;
      let best=pts[0],bd=Infinity;pts.forEach(p=>{const d=Math.abs(hit.X(p.x)-mx);if(d<bd){bd=d;best=p;}});
      hit.frame(1);
      const ctx=hit.ctx,cx=hit.X(best.x),cy=hit.Y(best.y);
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(cx,hit.pad.t);ctx.lineTo(cx,hit.pad.t+hit.plotH);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,3.5,0,7);ctx.fill();
      tip.innerHTML=(best.lab?'<span class="tl">'+escapeHtml(best.lab)+'</span>':'')+'<span class="'+(best.y>=0?'pos':'neg')+'">'+usd(best.y)+'</span>';
      tip.style.left=(canvas.offsetLeft+cx)+'px';tip.style.top=(canvas.offsetTop+cy)+'px';
      tip.classList.add('on');
    },()=>{chartTip(canvas).classList.remove('on');if(canvas._hit)canvas._hit.frame(1);});
  }
}

function barChart(canvas,labels,values,opts={}){
  const draw=animate=>{
    const {ctx,w,h}=setupCanvas(canvas,opts.height||220);
    const pad={l:40,r:12,t:12,b:30};const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
    if(!values.length){ctx.clearRect(0,0,w,h);ctx.fillStyle=CSSV('--faint');ctx.font='12px sans-serif';ctx.fillText('No data',pad.l,h/2);canvas._bhit=null;return;}
    let vmin=Math.min(0,...values),vmax=Math.max(0,...values);if(vmin===vmax)vmax+=1;
    const Y=v=>pad.t+(1-(v-vmin)/(vmax-vmin))*plotH;
    const bw=plotW/values.length;
    const frame=prog=>{
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle='#222226';ctx.beginPath();ctx.moveTo(pad.l,Y(0));ctx.lineTo(w-pad.r,Y(0));ctx.stroke();
      ctx.font='9px '+CSSV('--mono');ctx.textAlign='center';
      values.forEach((v,i)=>{const x=pad.l+i*bw+bw*0.15,bwI=bw*0.7;const y0=Y(0),y=Y(v*prog);
        ctx.fillStyle=opts.colors?opts.colors[i]:(v>=0?CSSV('--win'):CSSV('--accent-bright'));
        ctx.fillRect(x,Math.min(y,y0),bwI,Math.abs(y-y0)||1);
        ctx.fillStyle=CSSV('--faint');ctx.textBaseline='top';ctx.fillText(labels[i],x+bwI/2,h-pad.b+6);});
    };
    animFrames(frame,animate,420);
    canvas._bhit={pad,bw,Y,values,labels,frame};
  };
  CHARTS.set(canvas,draw);
  draw(true);
  if(!canvas._hoverBound){
    canvas._hoverBound=true;
    chartHover(canvas,e=>{
      const hb=canvas._bhit;if(!hb)return;
      const tip=chartTip(canvas);
      const r=canvas.getBoundingClientRect();const mx=e.clientX-r.left;
      const i=Math.floor((mx-hb.pad.l)/hb.bw);
      if(i<0||i>=hb.values.length){tip.classList.remove('on');return;}
      const v=hb.values[i];
      tip.innerHTML='<span class="tl">'+escapeHtml(String(hb.labels[i]))+'</span><span class="'+(v>=0?'pos':'neg')+'">'+(opts.counts?fmt(v,0):usd(v))+'</span>';
      tip.style.left=(canvas.offsetLeft+hb.pad.l+i*hb.bw+hb.bw/2)+'px';
      tip.style.top=(canvas.offsetTop+hb.Y(Math.max(v,0)))+'px';
      tip.classList.add('on');
    },()=>chartTip(canvas).classList.remove('on'));
  }
}

/* horizontal labelled bars (for time/day/setup ranking) */
function hbars(container,rows,opts={}){ // rows: [{label,value,sub}]
  const max=Math.max(1,...rows.map(r=>Math.abs(r.value)));
  const wrap=el('div',{class:'bars'});
  rows.forEach(r=>{
    const w=Math.abs(r.value)/max*100;
    const color=r.value>=0?'var(--win)':'var(--accent)';
    const fill=el('div',{class:'fill'});fill.style.width=w+'%';fill.style.background=color;
    if(r.value>=0)fill.style.left='0';else fill.style.right='0';
    const track=el('div',{class:'track'},fill);
    wrap.append(el('div',{class:'barrow'},
      el('div',{class:'muted'},r.label),
      track,
      el('div',{class:'val '+signCls(r.value)}, opts.money?usd(r.value):fmt(r.value,opts.dp??1))
    ));
  });
  container.append(wrap);
}

/* very small markdown renderer (headings ## , bullets, 1. lists, **bold**) */
function renderMarkdownLite(text){
  const wrap=el('div',{class:'md'});
  const inline=s=>String(s).split(/(\*\*[^*]+\*\*)/g).map(p=>/^\*\*[^*]+\*\*$/.test(p)?el('b',{},p.slice(2,-2)):p);
  let listEl=null,listType=null;
  String(text||'').split(/\r?\n/).forEach(ln=>{
    const t=ln.trim();
    if(!t){listEl=null;listType=null;return;}
    if(/^#{1,6}\s+/.test(t)){listEl=null;wrap.append(el('h4',{class:'mdh'},...inline(t.replace(/^#{1,6}\s+/,''))));return;}
    if(/^\d+[.)]\s+/.test(t)){if(listType!=='ol'){listEl=el('ol',{class:'mdul'});listType='ol';wrap.append(listEl);}listEl.append(el('li',{},...inline(t.replace(/^\d+[.)]\s+/,''))));return;}
    if(/^[-•*]\s+/.test(t)){if(listType!=='ul'){listEl=el('ul',{class:'mdul'});listType='ul';wrap.append(listEl);}listEl.append(el('li',{},...inline(t.replace(/^[-•*]\s+/,''))));return;}
    listEl=null;listType=null;wrap.append(el('p',{class:'mdp'},...inline(t)));
  });
  return wrap;
}

function renderDebriefPanel(root){
  const tkey=todayKeyLocal();
  const today=STATE.trades.filter(t=>t.dayKey===tkey).slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  const dayPL=today.reduce((a,t)=>a+t.pl,0);
  const existing=STATE.debriefs.find(d=>d.date===tkey)||null;

  const panel=el('div',{class:'debrief collapsible'});
  const chev=el('span',{class:'chev'},'▸');
  const hint=el('span',{class:'faint',style:'font-size:.71875rem'},existing?'written':'');
  const head=el('div',{class:'dbhead-row',tabindex:'0',role:'button',onclick:()=>{STATE.debriefOpen=!STATE.debriefOpen;paint();}},
    chev,
    el('div',{class:'eyebrow',style:'margin:0'},'Daily journal'),
    el('span',{class:'pill '+(today.length?(dayPL>=0?'win':'loss'):''),style:'margin-left:auto'},today.length?today.length+' trade'+(today.length>1?'s':'')+' · '+usd(dayPL):'no trades today'),
    hint);
  panel.append(head);
  const body=el('div',{class:'dbbody'});panel.append(body);

  function buildBody(){
    body.innerHTML='';
    if(today.length){
      const tl=el('div',{class:'dbtrades'});
      today.forEach(t=>tl.append(el('div',{class:'dbtrade'},
        el('span',{class:'pill '+t.symCls},t.symbol),el('span',{class:'muted'},t.type),el('span',{class:'faint'},t.session),
        t.ruleBroken?el('span',{class:'pill flag'},'rule'):null,t.revenge?el('span',{class:'pill flag'},'revenge'):null,
        el('span',{class:'num '+signCls(t.pl),style:'margin-left:auto'},usd(t.pl)))));
      body.append(tl);
    }
    body.append(el('label',{class:'fld',style:'margin-top:13px'},'How did today go? — what you saw, what you felt, what you\'d change'));
    const entry=el('textarea',{placeholder:'Chased gold into NY after the first loss. Knew it wasn\'t A+ and took it anyway.\n\n## Tomorrow\n1. No entry without an H1 level.',style:'min-height:150px;font-family:var(--mono);font-size:.8125rem'});
    entry.value=(existing&&existing.text)||'';
    body.append(entry);
    body.append(el('div',{class:'faint',style:'font-size:.75rem;margin-top:6px'},'Saved to this device only. Supports simple markdown — ## headings, - bullets, 1. lists, **bold**.'));

    const save=el('button',{class:'btn primary'},'Save entry');
    const status=el('span',{class:'faint',style:'font-size:.75rem'});
    body.append(el('div',{style:'display:flex;gap:11px;align-items:center;margin-top:12px;flex-wrap:wrap'},save,status));
    const out=el('div',{class:'dbout',style:'margin-top:14px'});body.append(out);

    function show(d){
      out.innerHTML='';
      if(!d||!(d.text||'').trim())return;
      const card=el('div',{class:'debrief-card'});
      card.append(el('div',{class:'faint',style:'font-size:.6875rem;margin-bottom:9px;letter-spacing:.05em'},'ENTRY · '+d.date+(d.updatedAt?' · '+fmtTime(d.updatedAt):'')));
      card.append(renderMarkdownLite(d.text));
      out.append(card);
    }
    show(existing);

    save.addEventListener('click',async()=>{
      save.disabled=true;
      try{
        const prev=STATE.debriefs.find(d=>d.date===tkey);
        const d={date:tkey,createdAt:(prev&&prev.createdAt)||Date.now(),updatedAt:Date.now(),text:entry.value||''};
        await saveDebrief(d);
        show(d);status.textContent='Saved.';hint.textContent='written';
        toast('Journal entry saved','good');
      }catch(err){console.error(err);toast('Could not save the entry',true);}
      finally{save.disabled=false;}
    });
  }
  function paint(){
    chev.textContent=STATE.debriefOpen?'▾':'▸';
    if(STATE.debriefOpen&&!body._built){buildBody();body._built=true;}
    body.style.display=STATE.debriefOpen?'':'none';
  }
  paint();
  root.append(panel);
}

  const K=periodKeys();

  const wrap=el('div',{class:'periodgrid'});

    {k:'Today',cur:t=>t.dayKey===K.today,prev:t=>t.dayKey===K.yesterday,prevLab:'yesterday',today:true},
    {k:'This week',cur:t=>t.weekKey===K.week,prev:t=>t.weekKey===K.lastWeek,prevLab:'last week',week:true},
    {k:'This month',cur:t=>(t.dayKey||'').startsWith(K.month),prev:t=>(t.dayKey||'').startsWith(K.lastMonth),prevLab:'last month'},
    {k:'All time',cur:()=>true,prev:null}
  ];
  defs.forEach(d=>{
    const cur=bucketStats(list,d.cur);
    const card=el('div',{class:'pcard'});
    card.append(el('div',{class:'k'},d.k));
    const v=el('div',{class:'v '+signCls(cur.pl)});card.append(v);

    if(d.prev){
      const prev=bucketStats(list,d.prev);
      if(prev.n||cur.n){
        const diff=cur.pl-prev.pl;
        card.append(el('div',{class:'delta '+signCls(diff)},(diff>=0?'▲ +':'▼ −')+usd(Math.abs(diff))+' vs '+d.prevLab+' ('+usd(prev.pl)+')'));
      }
    }
    if(d.today){
      card.append(
        gaugeRow('Loss room',-Math.min(0,s.dayPL)/RULES.dailyLoss,usd(Math.max(0,s.roomDaily))+' left of −'+amt(RULES.dailyLoss),s.dailyHit));
    }
    if(d.week){
      card.append(gaugeRow('Weekly room',-Math.min(0,s.weekPL)/RULES.weeklyLoss,usd(Math.max(0,s.roomWeekly))+' left of −'+amt(RULES.weeklyLoss),s.weeklyHit));
    }
    wrap.append(card);
  });
  root.append(wrap);
}

    const days={'1W':7,'1M':30,'3M':90}[STATE.heroRange];

    } else if(days&&!ordered.length){
      noteHost.append(el('div',{class:'note',style:'margin-top:12px'},'No closed trades in this range — try a wider window.'));
    }
  }
  requestAnimationFrame(drawEq);
}

/* heat colour for a P&L value scaled against a max magnitude */
function heatColor(v,max){
  if(v===0||max===0)return '#161619';
  const a=Math.min(1,Math.abs(v)/max);
  const o=(0.14+a*0.48).toFixed(3);   // cap ~0.62 so the day number stays legible
  if(v>0)return `rgba(112,168,136,${o})`;
  return `rgba(191,110,102,${o})`;
}

function capFloorVal(){const v=Math.abs(+STATE.settings.capFloor);return v>0?v:15;}

function renderCalendar(host,listArg,key){
  host.innerHTML='';key=key||'main';
  const list=listArg||visibleTrades();
  // day drill-in (main calendar only)
  if(key==='main'&&STATE.calDetail[key]){renderCalendarDay(host,STATE.calDetail[key],list,key);return;}
  const showCap=(key==='main');
  const CAP=capFloorVal();
  const byDay={};list.forEach(t=>{if(t.dayKey)byDay[t.dayKey]=(byDay[t.dayKey]||{pl:0,n:0});if(t.dayKey){byDay[t.dayKey].pl+=t.pl;byDay[t.dayKey].n++;}});
  if(!STATE.calMonths[key]){const last=list.filter(t=>t.closeMs!=null).sort((a,b)=>b.closeMs-a.closeMs)[0];const d=last?shifted(last.closeMs):shifted(nowStmt());STATE.calMonths[key]={y:d.getUTCFullYear(),m:d.getUTCMonth()};}
  const {y,m}=STATE.calMonths[key];
  const ym=y+'-'+String(m+1).padStart(2,'0');
  const monthDays=Object.entries(byDay).filter(([k])=>k.startsWith(ym));
  const monthMax=Math.max(1,...monthDays.map(([,v])=>Math.abs(v.pl)));
  const mTot=monthDays.reduce((a,[,v])=>a+v.pl,0);
  const disc=monthDays.reduce((a,[,v])=>a+Math.max(v.pl,-CAP),0);
  const saved=disc-mTot;

  const head=el('div',{class:'calhead'});
  head.append(
    el('button',{class:'btn sm',onclick:()=>{STATE.calMonths[key]={y:m===0?y-1:y,m:m===0?11:m-1};renderCalendar(host,listArg,key);}},'‹'),
    el('div',{class:'mname'},new Date(Date.UTC(y,m,1)).toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})),
    el('button',{class:'btn sm',onclick:()=>{STATE.calMonths[key]={y:m===11?y+1:y,m:m===11?0:m+1};renderCalendar(host,listArg,key);}},'›'),
    el('button',{class:'btn sm ghost',onclick:()=>{STATE.calMonths[key]=null;renderCalendar(host,listArg,key);}},'Latest'),
    el('span',{style:'margin-left:auto;font-family:var(--mono);font-weight:600',class:signCls(mTot)},usd(mTot))
  );
  host.append(head);

  if(showCap){
    const capIn=el('input',{type:'number',step:'1',min:'1',value:CAP,style:'width:66px;text-align:center;padding:5px 8px',onchange:async e=>{const v=Math.abs(+e.target.value);STATE.settings.capFloor=(v>0?v:15);await saveSettings();renderCalendar(host,listArg,key);}});
    const capline=el('div',{class:'capline'});
    capline.append(
      el('label',{style:'display:flex;align-items:center;gap:7px;color:var(--muted)'},'Daily-loss floor  −'+CURSYM,capIn,'/ day'),
      el('span',{class:'capres'},'If capped at −'+amt(CAP)+'/day: ',el('b',{class:signCls(disc)},usd(disc)),
        saved>0.005?el('b',{class:'pos',style:'margin-left:9px'},'+'+usd(saved)+' saved'):el('span',{class:'faint',style:'margin-left:9px'},'no breach days this month'))
    );
    host.append(capline);
  }

  const grid=el('div',{class:'calgrid'});
  ['Mon','Tue','Wed','Thu','Fri'].forEach(d=>grid.append(el('div',{class:'dow'},d)));
  const daysIn=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const todayKey=todayKeyLocal();
  const weekendHits=[];   // trades whose open day lands on Sat/Sun (rare) — listed under the grid
  let padded=false;
  for(let d=1;d<=daysIn;d++){
    const wd=(new Date(Date.UTC(y,m,d)).getUTCDay()+6)%7;   // Mon=0
    const dkey=ym+'-'+String(d).padStart(2,'0');
    const rec=byDay[dkey];
    if(wd>=5){if(rec)weekendHits.push({dkey,rec});continue;}   // weekends: markets closed, no columns
    if(!padded){for(let i=0;i<wd;i++)grid.append(el('div',{class:'calcell empty'}));padded=true;}
    const cell=el('div',{class:'calcell'+(rec?' has':'')+(dkey===todayKey?' today':'')});
    if(rec){
      const hi=Math.min(1,Math.abs(rec.pl)/monthMax);cell.classList.toggle('hot',hi>=0.42);
      cell.style.background=heatColor(rec.pl,monthMax);
      const breach=showCap&&rec.pl<-CAP;
      if(breach)cell.classList.add('breach');
      cell.title=breach?('Actual: '+usd(rec.pl)+' · Capped: '+usd(-CAP)+' · '+rec.n+' trade'+(rec.n>1?'s':''))
                       :(dkey+': '+usd(rec.pl)+' · '+rec.n+' trade'+(rec.n>1?'s':''));
      cell.tabIndex=0;cell.setAttribute('role','button');cell.setAttribute('aria-label',cell.title);
      cell.addEventListener('click',()=>{if(key==='main'){STATE.calDetail[key]=dkey;renderCalendar(host,listArg,key);}else{STATE.logFilters={};go('log');}});
    }
    cell.append(el('div',{class:'dn'},d));
    if(rec)cell.append(el('div',{class:'cp '+signCls(rec.pl)},usd(rec.pl)),el('div',{class:'ct'},rec.n+'t'));
    grid.append(cell);
  }
  host.append(grid);
  if(weekendHits.length)host.append(el('div',{class:'faint',style:'font-size:.6875rem;margin-top:8px'},'Weekend trades (off-grid): '+weekendHits.map(w=>w.dkey+' '+usd(w.rec.pl)+' · '+w.rec.n+'t').join('  ·  ')));

  if(showCap){
    host.append(el('div',{class:'faint',style:'font-size:.6875rem;margin-top:10px'},'Gold ring = day breached the −'+amt(CAP)+' floor · click any day for its trades & notes.'));

function renderHeatmap(host,listArg){
  host.innerHTML='';
  const list=listArg||visibleTrades();
  const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cell={};let max=0;
  list.forEach(t=>{if(t.hour==null||!t.weekday)return;const k=t.weekday+'|'+t.hour;cell[k]=(cell[k]||0)+t.pl;max=Math.max(max,Math.abs(cell[k]));});
  // hour range present
  const hoursPresent=[...new Set(list.filter(t=>t.hour!=null).map(t=>t.hour))];
  const hMin=hoursPresent.length?Math.min(...hoursPresent):8, hMax=hoursPresent.length?Math.max(...hoursPresent):20;
  const hours=[];for(let h=hMin;h<=hMax;h++)hours.push(h);
  const wrap=el('div',{class:'heatwrap'});
  const grid=el('div',{class:'heatgrid'});
  grid.style.gridTemplateColumns=`40px repeat(${hours.length},1fr)`;
  grid.append(el('div',{}));
  hours.forEach(h=>grid.append(el('div',{class:'hh'},h)));
  order.filter(d=>list.some(t=>t.weekday===d)).forEach(d=>{
    grid.append(el('div',{class:'rl'},d));
    hours.forEach(h=>{
      const v=cell[d+'|'+h]||0;
      const c=el('div',{class:'heatcell'});
      c.style.background=heatColor(v,max);
      if(v!==0)c.title=d+' '+h+':00 — '+usd(v);
      grid.append(c);
    });
  });
  wrap.append(grid);host.append(wrap);
  host.append(el('div',{class:'legend',style:'margin-top:8px'},
    el('span',{},'Net P&L by weekday × open hour'),
    (function(){const s=el('span',{},el('i',{}),'profit');s.firstChild.style.background='rgba(112,168,136,.7)';return s;})(),
    (function(){const s=el('span',{},el('i',{}),'loss');s.firstChild.style.background='rgba(191,110,102,.7)';return s;})()
  ));
}

async function autoFileScreenshots(files){
  if(!files.length)return;
  const tickets=STATE.trades.map(t=>t.ticket).sort((a,b)=>b.length-a.length);
  let filed=0,missed=0;
  for(const f of files){
    const hit=tickets.find(tk=>(f.name||'').includes(tk));

/* ============================================================
   PLAN & TOOLS — pre-trade plans, watchlist, position sizing
   ============================================================ */
function planTol(sym){const i=symInfo(sym);return i.label==='pips'?20*i.size:3.0;}   // within 20 pips, or 3.0 points
async function reconcilePlans(){
  const linked=new Set(STATE.plans.filter(p=>p.ticket).map(p=>p.ticket));
  const cands=STATE.trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  for(const p of STATE.plans){
    if(p.status==='skipped'||p.ticket)continue;
    const tol=planTol(p.symbol);let best=null,bestScore=Infinity;
    for(const t of cands){
      if(linked.has(t.ticket))continue;
      if(t.symbol!==p.symbol||t.type!==p.dir||t.openMs==null)continue;
      if(p.entry!=null){const d=Math.abs((t.openPrice||0)-p.entry);if(d>tol)continue;const score=d+Math.abs(t.openMs-toStmt(p.createdMs))/3.6e6*0.001;if(score<bestScore){bestScore=score;best=t;}}
      else{const dt=t.openMs-toStmt(p.createdMs);if(dt>=-3.6e6&&dt<=24*3.6e6&&dt<bestScore){bestScore=dt;best=t;}}
    }
    if(best){const dp=symInfo(p.symbol).dp;
      p.ticket=best.ticket;p.status='executed';
      p.dev={entry:p.entry!=null?+(best.openPrice-p.entry).toFixed(dp):null,sl:(p.sl!=null&&best.sl!=null)?+(best.sl-p.sl).toFixed(dp):null,tp:(p.tp!=null&&best.tp!=null)?+(best.tp-p.tp).toFixed(dp):null};
      linked.add(best.ticket);await idbPut('plans',p);
    }
  }
  STATE.plans=(await idbAll('plans')).sort((a,b)=>b.createdMs-a.createdMs);
}
/* Default value of a 1.0 price move per 1.0 lot. Known contracts only —
   anything else must come from the user (broker contract specs vary, and a
   wrong guess here sizes a real position wrong). */
function pointValuePerLot(sym){
  if(/^XAU/i.test(sym))return 100;                    // gold: 100 oz per lot
  if(/^XAG/i.test(sym))return 5000;                   // silver: 5000 oz per lot
  if(/^[A-Z]{3}USD$/i.test(sym))return 100000;        // FX quoted in USD: 1 lot = 100k base units
  return null;                                        // indices/CFDs: broker-specific
}
function calcLots(sym,riskUSD,stop,usdjpy,pointValue){
  if(!(riskUSD>0)||!(stop>0))return null;
  if(/JPY/i.test(sym)){if(!(usdjpy>0))return{err:'Enter current USDJPY to size a yen pair'};const pv=1000/usdjpy;const lots=riskUSD/(stop*pv);return{lots,unitNote:CURSYM+(pv*lots).toFixed(2)+' per pip · stop '+stop+' pips'};}
  const pv=(pointValue>0)?pointValue:pointValuePerLot(sym);
  if(!(pv>0))return{err:'Enter this instrument\'s value per 1.0 price move per 1.0 lot — it\'s in your broker\'s contract specification.'};
  const lots=riskUSD/(stop*pv);
  return{lots,unitNote:CURSYM+(pv*lots).toFixed(2)+' per 1.0 move · stop '+stop+' · point value '+pv+'/lot'};
}

        el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
          el('button',{class:'btn primary',onclick:async()=>{STATE.settings.brokerOffsetHours=sug;await saveSettings();STATE.trades=STATE.trades.map(t=>enrich(t));runRules(STATE.trades);toast('Offset set to '+sTxt+'h — sessions re-tagged','good');renderImport();}},'Use '+sTxt+'h'),
          el('button',{class:'btn ghost',onclick:async()=>{STATE.settings.tzHintDismissed=true;await saveSettings();renderImport();}},'No thanks')));
      root.append(hint);
    }
  }

  // trading rules — the risk model the rule engine judges every trade against
  root.append(el('h2',{class:'sec'},'Your trading rules'));

  rp.append(el('div',{class:'note',style:'margin-bottom:13px'},'Aether flags trades that break these. They are yours — set them to the risk model you actually trade, in your account currency. Changing them re-judges your whole history.'));
  const R=Object.assign({},DEFAULT_RULES,STATE.settings.rules||{});
  const RF=[['maxRisk','Max risk per trade'],['dailyLoss','Daily loss cap'],['weeklyLoss','Weekly loss cap'],
            ['scaleAfter','Scale down after a day above'],['scaledRisk','Scaled-down risk'],['drawback','Lock-in stop after scaling'],

  const grid=el('div',{class:'row',style:'flex-wrap:wrap;gap:12px'});

    const inp=el('input',{type:'number',step:'0.01',value:R[k],style:'max-width:150px',
      oninput:e=>{R[k]=e.target.value===''?0:+e.target.value;}});
    grid.append(wrapFld(label,inp));
  });
  rp.append(grid);
  const setupsIn=el('input',{type:'text',value:(STATE.settings.setups||DEFAULT_SETUPS).join(', '),
    placeholder:'BOS, Liquidity sweep, Order block…'});
  rp.append(el('div',{style:'margin-top:12px'},wrapFld('Your setups — comma separated, used for tagging and setup stats',setupsIn)));
  const instIn=el('input',{type:'text',value:(STATE.settings.instruments||[]).join(', '),
    placeholder:'EURUSD, XAUUSD, US30…'});
  rp.append(el('div',{style:'margin-top:12px'},wrapFld('Instruments you trade — anything you import is added automatically',instIn)));
  const rSave=el('button',{class:'btn primary',style:'margin-top:13px'},'Save rules');
  rSave.addEventListener('click',async()=>{
    const bad=RF.filter(([k])=>!(R[k]>0)).map(([,l])=>l);
    if(bad.length){toast('Every rule needs a number above zero — check: '+bad.join(', '),true);return;}
    STATE.settings.rules=R;
    STATE.settings.setups=setupsIn.value.split(',').map(s=>s.trim()).filter(Boolean);
    STATE.settings.instruments=instIn.value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    await saveSettings();
    applyUserConfig();
    STATE.trades=STATE.trades.map(t=>enrich(t));
    runRules(STATE.trades);
    toast('Rules saved — history re-judged','good');
    renderImport();
  });
  rp.append(el('div',{},rSave));
  root.append(rp);


  // backup
  root.append(el('h2',{class:'sec'},'Backup'));
  root.append(el('div',{class:'warn',style:'margin-bottom:12px'},'⚠ Everything (trades, notes, tags, screenshots, settings) lives in this browser\'s IndexedDB. Clearing site data / browser data will erase it permanently. Export a backup regularly — especially before clearing anything.'));
  const bk=el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'});
  bk.append(el('button',{class:'btn primary',onclick:exportBackup},'⤓ Export full backup (.json)'),
    el('button',{class:'btn',onclick:()=>$('#restoreFile').click()},'⤒ Restore from backup'),

/* ============================================================
   SAMPLE DATA (demo mode) — a fabricated account so the app can be
   explored without an MT5 statement. Every record carries demo:true and
   is swept by clearDemoData(); importing a real statement clears it too.
   ============================================================ */
function demoRng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function demoDataset(){
  const rnd=demoRng(20260812);
  const pad=n=>String(n).padStart(2,'0');
  const fmt=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'.'+pad(d.getUTCMonth()+1)+'.'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());};
  const dkey=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());};
  const SYMS={EURUSD:{base:1.083,jit:0.004,dp:5,stop:()=>0.0012+rnd()*0.0022,vol:()=>+(0.02+rnd()*0.08).toFixed(2)},
              XAUUSD:{base:4720,jit:55,dp:2,stop:()=>3+rnd()*6,vol:()=>+(0.01+rnd()*0.04).toFixed(2)},
              US30:{base:39150,jit:380,dp:1,stop:()=>45+rnd()*110,vol:()=>+(0.1+rnd()*0.4).toFixed(2)}};
  const EMOS=['Calm','Confident','FOMO','Anxious','Greedy','Frustrated','Bored','Disciplined'];
  const tags=SETUPS.length?SETUPS:DEFAULT_SETUPS;
  // weekdays over the last ~6 weeks, oldest first, today (or last weekday) last
  const days=[];const nowMs=nowStmt();
  for(let d=42;d>=0;d--){const t=new Date(nowMs-d*864e5);const wd=t.getUTCDay();if(wd===0||wd===6)continue;days.push(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));}
  let ticket=990000001;const trades=[];
  const mk=(dayMs,h,m,symName,type,profit,o)=>{
    o=o||{};const S=SYMS[symName];const dir=type==='buy'?1:-1;
    const open=+(S.base+S.jit*(rnd()-0.5)*2).toFixed(S.dp);
    const stop=S.stop();const win=profit>0;
    const t={ticket:String(ticket++),symbol:symName,type,volume:S.vol(),
      openTime:fmt(dayMs+h*3600e3+m*60e3),closeTime:fmt(dayMs+h*3600e3+(m+12+Math.floor(rnd()*75))*60e3),
      openPrice:open,sl:+(open-dir*stop).toFixed(S.dp),tp:+(open+dir*stop*2.1).toFixed(S.dp),
      closePrice:+(open+dir*(win?stop*1.6:-stop)).toFixed(S.dp),
      commission:0,swap:0,profit:+profit.toFixed(2),
      setups:o.setups!==undefined?o.setups:(rnd()<0.65?[tags[Math.floor(rnd()*tags.length)]]:[]),
      note:o.note||'',emotion:o.emotion!==undefined?o.emotion:(rnd()<0.5?EMOS[Math.floor(rnd()*EMOS.length)]:''),
      confirmation:rnd()<0.4,plannedR:null,actualR:null,
      riskUSD:o.riskUSD!==undefined?o.riskUSD:(rnd()<0.6?5:null),
      session:null,demo:true,updatedAt:Date.now()};
    if(o.openTime)t.openTime=o.openTime;if(o.closeTime)t.closeTime=o.closeTime;
    trades.push(t);return t;};
  const symAt=i=>['EURUSD','XAUUSD','US30'][i%3];
  // background scatter — most days see one or two trades
  const badDay=days[days.length-8],capDay=days[days.length-15],today=days[days.length-1];
  days.forEach((dayMs,i)=>{
    if(dayMs===badDay||dayMs===capDay||dayMs===today)return;
    if(rnd()<0.38)return;
    const n=rnd()<0.35?2:1;
    for(let k=0;k<n;k++){
      const win=rnd()<0.56;
      mk(dayMs,7+Math.floor(rnd()*11),Math.floor(rnd()*59),symAt(i+k),rnd()<0.5?'buy':'sell',
         win?(2+rnd()*6.5):-(1.5+rnd()*3.2));
    }
  });
  // scripted: a single oversized loss (breaks the default per-trade cap)
  mk(capDay,14,10,'XAUUSD','buy',-6.4,{emotion:'Frustrated',riskUSD:5,setups:[tags[0]],
    note:'Moved my stop once and paid for it. The first stop was the right one.'});
  // scripted: the bad day — three losses, a revenge entry inside the break window,
  // then one more trade after the daily cap was already gone
  mk(badDay,9,10,'EURUSD','sell',-3.8,{emotion:'Anxious',riskUSD:5});
  const l2=mk(badDay,11,40,'XAUUSD','buy',-4.1,{emotion:'Frustrated',riskUSD:5});
  const l3=mk(badDay,13,5,'XAUUSD','buy',-3.6,{emotion:'FOMO',riskUSD:5,
    note:'Same idea as the last one. It was not a new setup, it was a rematch.'});
  l3.closeTime=fmt(badDay+13*3600e3+18*60e3);
  mk(badDay,13,22,'XAUUSD','buy',-2.9,{emotion:'FOMO',riskUSD:5,setups:[],
    openTime:fmt(badDay+13*3600e3+22*60e3),note:'Four minutes after the stopout. No plan, just anger.'});
  mk(badDay,15,0,'US30','sell',1.2,{emotion:'',riskUSD:3});
  // scripted: a clean streak for the best-run stat
  const s1=days[days.length-20],s2=days[days.length-19];
  const w1=mk(s1,8,30,'EURUSD','buy',6.8,{emotion:'Disciplined',riskUSD:5,setups:[tags[0]]});
  mk(s1,12,15,'US30','sell',4.9,{emotion:'Calm',riskUSD:5});
  mk(s2,9,45,'XAUUSD','buy',7.4,{emotion:'Confident',riskUSD:5,setups:[tags.length>1?tags[1]:tags[0]]});
  // today: one win, one small loss, so the day strip is alive
  mk(today,8,5,'EURUSD','buy',4.1,{emotion:'Calm',riskUSD:5,setups:[tags[0]]});
  mk(today,10,35,'US30','sell',-2.3,{emotion:'',riskUSD:5});
  // a plan that reconciles onto the streak trade, and one still pending
  const plans=[
    {id:'demo-plan-1',symbol:w1.symbol,dir:w1.type,entry:w1.openPrice,sl:w1.sl,tp:w1.tp,
     setups:w1.setups.slice(),session:'London',plannedR:2,riskUSD:5,
     note:'Planned at the level the night before. Waited for the retest.',
     createdMs:parseMT5Date(w1.openTime)-2*3600e3,status:'pending',ticket:null,demo:true},
    {id:'demo-plan-2',symbol:'XAUUSD',dir:'sell',entry:+(SYMS.XAUUSD.base+80).toFixed(2),sl:+(SYMS.XAUUSD.base+92).toFixed(2),tp:+(SYMS.XAUUSD.base+40).toFixed(2),
     setups:[tags[0]],session:'NY',plannedR:3,riskUSD:5,note:'Waiting for price to reach the zone.',
     createdMs:Date.now()-3600e3,status:'pending',ticket:null,demo:true}];
  const debriefs=[{date:dkey(badDay),createdAt:badDay,updatedAt:badDay,demo:true,
    text:'## What happened\nThree losses before lunch and I knew the third was a rematch, not a setup. Then I re-entered four minutes after the stopout.\n\n**The cap did its job** — the damage stopped where the rules said it would.\n\n## Tomorrow\n1. After two losses, close the platform for an hour.\n2. No re-entry on the same idea without a fresh signal.'}];
  return {trades,plans,debriefs};
}
function hasRealTrades(){return STATE.trades.some(t=>!t.demo);}
async function loadDemoData(){
  if(hasRealTrades()){toast('Sample data only loads into an empty journal',true);return;}
  if(!DB.db)await openDB();
  const {trades,plans,debriefs}=demoDataset();
  for(const t of trades)await idbPut('trades',t);
  for(const p of plans)await idbPut('plans',p);
  for(const d of debriefs)await idbPut('debriefs',d);
  STATE.settings.demoData=true;
  STATE.settings.account={name:'Sample data',number:'DEMO',currency:'USD',server:'Aether demo',kind:'sample',company:'Not a real account',demo:true};
  STATE.settings.summary=null;
  await saveSettings();
  await loadAll();
  await reconcilePlans();
  toast('Sample data loaded — explore freely, clear it from Import','good');
  go('dashboard');
}
async function clearDemoData(silent){
  if(!DB.db)await openDB();
  for(const t of await idbAll('trades'))if(t.demo)await idbDel('trades',String(t.ticket));
  for(const p of await idbAll('plans'))if(p.demo)await idbDel('plans',p.id);
  for(const d of await idbAll('debriefs'))if(d.demo)await idbDel('debriefs',d.date);
  if(STATE.settings.account&&STATE.settings.account.demo){STATE.settings.account=null;STATE.settings.summary=null;}
  STATE.settings.demoData=false;await saveSettings();
  await loadAll();
  if(!silent)toast('Sample data cleared','good');
}

/* ---------- CSV export of the enriched trade log ---------- */
function csvCell(v){
  if(v==null)return'';
  if(Array.isArray(v))v=v.join(' | ');
  if(typeof v==='boolean')v=v?'yes':'';
  v=String(v);
  if(/^[=+@\t]/.test(v))v="'"+v;         // spreadsheet formula-injection guard
  return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function exportTradesCSV(){
  const list=STATE.trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  if(!list.length){toast('Nothing to export — import a statement first',true);return;}
  const cols=['ticket','symbol','type','volume','openTime','closeTime','openPrice','closePrice','sl','tp','commission','swap','profit','R','session','weekday','dayKey','weekKey','durationMin','riskUSD','plannedR','setups','emotion','confirmation','revenge','ruleBroken','violations','note'];
  const rows=[cols.join(',')];
  for(const t of list)rows.push(cols.map(c=>csvCell(c==='violations'?(t.violations||[]).map(x=>x.label):t[c])).join(','));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:'aether-trades-'+new Date().toISOString().slice(0,10)+'.csv'});
  document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('CSV exported — '+list.length+' trades','good');
}

async function handleStatement(file){
  const ipage=$('#page-import');
  const loader=el('div',{class:'loading',style:'margin-bottom:14px'},el('span',{class:'spinner'}),'Reading your statement…');
  ipage.prepend(loader);
  try{
    const text=await readMT5File(file);
    const parsed=parseMT5(text);
    if(!parsed.trades.length)throw new Error('No closed positions found in the file.');
    const held=STATE.account;
    if(held&&!held.demo&&held.number&&parsed.account.number&&String(held.number)!==String(parsed.account.number)&&hasRealTrades()
       &&!confirm('This statement is for account #'+parsed.account.number+', but this journal holds account #'+held.number+'.\n\nImporting merges both accounts into one journal. Continue?')){loader.remove();return;}
    if(!DB.db)await openDB(); // self-heal if IndexedDB wasn't ready at boot
    if(STATE.settings.demoData)await clearDemoData(true);   // a real statement replaces the sample account
    // merge: preserve enrichment + dedupe by ticket
    let added=0,updated=0;const now=Date.now();
    for(const pt of parsed.trades){
      const existing=await idbGet('trades',pt.ticket);
      if(existing){updated++;await idbPut('trades',Object.assign({},existing,pt,{updatedAt:now}));}
      else {added++;await idbPut('trades',Object.assign({setups:[],note:'',emotion:'',confirmation:false,plannedR:null,actualR:null,riskUSD:null,session:null},pt,{updatedAt:now}));}
    }
    STATE.settings.account=parsed.account;STATE.settings.summary=parsed.summary;
    await saveSettings();
    await loadAll();
    await reconcilePlans();
    toast(`Imported ${parsed.trades.length} trades — ${added} new, ${updated} updated`,'good');
    STATE.settings.importsSinceBackup=(STATE.settings.importsSinceBackup||0)+1;await saveSettings();
    if(STATE.settings.importsSinceBackup%3===0)
      setTimeout(()=>toast(STATE.settings.importsSinceBackup+' imports since your last backup — everything lives in this browser, so export one from Import → Backup'),3100);
    renderImport();
  }catch(err){console.error(err);loader.remove();
    const root=$('#page-import');
    const storage=!DB.db||/transaction|indexed\s*db|object ?store|database/i.test(err.message||'');
    if(storage){
      toast('Storage unavailable — import not saved',true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Your statement parsed fine, but this browser context can\'t use IndexedDB, so nothing could be saved. Open this file directly in a normal browser tab (not a private/incognito window or a sandboxed preview) and try again.'));
    } else {
      toast('Import failed: '+err.message,true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Could not read this file: '+escapeHtml(err.message)+' — export your history from MT5 as an HTML "Trade History Report" and try again.'));
    }}
}

async function exportBackup(){
  const trades=await idbAll('trades');
  const images=await idbAll('images');
  const imgOut=[];
  for(const im of images){const b64=await blobToB64(im.blob);imgOut.push({id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,data:b64});}
  const debriefs=await idbAll('debriefs');
  const livetrades=await idbAll('livetrades');
  const plans=await idbAll('plans');
  const payload={app:'Aether',version:1,exported:new Date().toISOString(),settings:STATE.settings,trades,plans,debriefs,livetrades,images:imgOut};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:'aether-backup-'+new Date().toISOString().slice(0,10)+'.json'});document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
  STATE.settings.importsSinceBackup=0;await saveSettings();
  toast('Backup downloaded — '+trades.length+' trades, '+plans.length+' plans, '+images.length+' images','good');
}
function blobToB64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});}
function b64ToBlob(d){const[meta,data]=d.split(',');const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

async function importBackup(file){
  if(!confirm('Restore from backup? This merges the backup into your current data (existing tickets are overwritten).'))return;
  try{
    const text=await file.text();const p=JSON.parse(text);
    if(p.app!=='Aether')if(!confirm('This doesn\'t look like an Aether backup. Continue anyway?'))return;
    if(p.settings){
      // Only adopt keys this app actually has. Backups from older builds carry
      // dead keys (sync URLs, API keys) that must not be persisted here.
      const clean={};for(const k in DEFAULT_SETTINGS)if(k in p.settings)clean[k]=p.settings[k];
      STATE.settings=Object.assign({},DEFAULT_SETTINGS,clean);await saveSettings();
    }
    for(const t of(p.trades||[]))await idbPut('trades',t);
    for(const pl of(p.plans||[]))if(pl&&pl.id)await idbPut('plans',pl);
    for(const d of(p.debriefs||[]))await idbPut('debriefs',d);
    for(const lt of(p.livetrades||[]))await idbPut('livetrades',lt);
    for(const im of(p.images||[]))await idbPut('images',{id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,blob:b64ToBlob(im.data)});
    await loadAll();toast('Backup restored','good');renderImport();
  }catch(err){console.error(err);toast('Restore failed: '+err.message,true);}
}

function renderRules(){

  const rules=[
    ['Daily loss cap',amt(RULES.dailyLoss)+' daily loss limit — pooled across all instruments. This is the primary discipline: trade freely while you still have loss room.'],
    ['Weekly loss cap',amt(RULES.weeklyLoss)+' weekly loss limit — pooled across all instruments.'],
    ['Risk per trade','Max '+amt(RULES.maxRisk)+' risk on any single trade.'],
    ['Profit scaling','After +'+amt(RULES.scaleAfter)+' on the day, scale risk down to '+amt(RULES.scaledRisk)+' per trade with a '+amt(RULES.drawback)+' drawback (lock-in) stop.'],
    ['Break after stopout','Mandatory '+RULES.breakMins+'-minute break after any stopout — no new entries inside that window.']
  ];

  root.append(rp);
  root.append(el('div',{class:'note',style:'margin-top:10px'},'Instruments differ in point value, typical stop width and spread, so position size has to be worked out per instrument — but your '+amt(RULES.maxRisk)+' / '+amt(RULES.dailyLoss)+' / '+amt(RULES.weeklyLoss)+' caps apply identically to all of them.'));

  // editable key levels
  root.append(el('h2',{class:'sec'},'Key levels'));
  INSTRUMENTS.forEach(sym=>{
    const info=symInfo(sym);
    const box=el('div',{class:'panel',style:'margin-bottom:14px'});
    box.append(el('h4',{style:'margin:0 0 12px'},el('span',{class:'pill '+info.cls},sym),' ',el('span',{class:'muted',style:'font-weight:400'},'recurring levels')));
    const list=STATE.settings.keyLevels[sym]||(STATE.settings.keyLevels[sym]=[]);
    const rows=el('div');
    function draw(){
      rows.innerHTML='';
      list.forEach((lv,i)=>{
        const labIn=el('input',{class:'lblw',type:'text',value:lv.label,placeholder:'Label',oninput:e=>lv.label=e.target.value});
        const valIn=el('input',{type:'text',value:lv.value,placeholder:'Price / zone',oninput:e=>lv.value=e.target.value});
        rows.append(el('div',{class:'levelrow'},labIn,valIn,el('button',{class:'btn sm danger',onclick:async()=>{list.splice(i,1);await saveSettings();draw();}},'✕')));
      });
      if(!list.length)rows.append(el('div',{class:'faint',style:'font-size:.75rem;margin-bottom:8px'},'No levels yet for '+sym+' — add the ones you keep coming back to.'));
    }
    draw();
    box.append(rows);
    box.append(el('div',{style:'display:flex;gap:10px;margin-top:6px'},
      el('button',{class:'btn sm',onclick:async()=>{list.push({label:'',value:''});await saveSettings();draw();}},'+ Add level'),
      el('button',{class:'btn sm primary',onclick:async()=>{await saveSettings();toast(sym+' levels saved','good');}},'Save '+sym)));
    root.append(box);
  });
}

  root.append(el('div',{class:'eyebrow'},'Live pooled status · '+tKey));
  const cards=el('div',{class:'cards',style:'margin-bottom:18px'});
  cards.append(
    statCard('Loss room today',usd(Math.max(0,roomDaily)),'before the −'+amt(RULES.dailyLoss)+' cap',roomDaily<=RULES.maxRisk?'neg':'pos'),
    statCard('Day P&L',usd(dayPL),'cap -'+amt(RULES.dailyLoss),signCls(dayPL)),
    statCard('Week P&L',usd(weekPL),'cap -'+amt(RULES.weeklyLoss),signCls(weekPL)),
    statCard('Since last stopout',sinceLoss==null||sinceLoss<0?'—':(sinceLoss<60?Math.round(sinceLoss)+'m':Math.floor(sinceLoss/60)+'h '+Math.round(sinceLoss%60)+'m'),inBreak?('in '+RULES.breakMins+'m break'):'clear',inBreak?'neg':'pos')
  );
  root.append(cards);

  const dailyOK=dayPL>-RULES.dailyLoss, weeklyOK=weekPL>-RULES.weeklyLoss;
  const scaled=dayPL>=RULES.scaleAfter;

  root.append(el('h2',{class:'sec'},'Pre-trade checklist'));
  const auto=[
    [dailyOK,'Within daily loss cap', `Day P&L ${usd(dayPL)} vs −${amt(RULES.dailyLoss)} limit · ${usd(Math.max(0,roomDaily))} of room left.`],
    [weeklyOK,'Within weekly loss cap', `Week P&L ${usd(weekPL)} vs −${amt(RULES.weeklyLoss)} limit · ${usd(Math.max(0,roomWeekly))} of room left.`],
    [!inBreak,'Not inside the '+breakLabel()+' stopout break', inBreak?`Last stopout was ${Math.round(sinceLoss)}m ago — wait ${Math.max(0,Math.ceil(RULES.breakMins-sinceLoss))}m more.`:'No recent stopout blocking you.']
  ];
  auto.forEach(a=>{root.append(el('div',{class:'check '+(a[0]?'auto-ok':'auto-bad')},
    el('div',{style:'font-size:1rem;margin-top:1px'},a[0]?'✓':'⚠'),
    el('div',{},el('div',{class:'ttl'},a[1]),el('div',{class:'desc'},a[2]))));});

  if(scaled)root.append(el('div',{class:'note',style:'margin-bottom:9px'},'You\'re past +'+amt(RULES.scaleAfter)+' today — scaling rule active: risk '+amt(RULES.scaledRisk)+' per trade, lock in with a '+amt(RULES.drawback)+' drawback stop.'));

  const manual=[
    ['Risk ≤ '+amt(scaled?RULES.scaledRisk:RULES.maxRisk),'Position sized for this instrument so the worst case stays inside your per-trade cap.'],
    ['Higher timeframe agrees','Structure above your entry timeframe supports the direction?'],
    ['Entry trigger confirmed','A signal you defined in advance actually fired — not anticipation?'],
    ['Level mapped','Entry tied to a level you marked before the session?'],
    ['Exit defined','Stop and target both set before entry, not after?']
  ];
  manual.forEach(m=>root.append(el('label',{class:'check'},el('input',{type:'checkbox'}),el('div',{},el('div',{class:'ttl'},m[0]),el('div',{class:'desc'},m[1])))));

  root.append(el('h2',{class:'sec'},'Post-trade review'));
  const pr=el('div',{class:'panel'});
  ['Did I follow my plan exactly, or improvise?','Was the entry a real confirmed signal or a forced trade?','If it lost — was it a clean stop (acceptable) or a rule-break?','What did the H1→15m→5m read actually tell me?','One thing to repeat. One thing to cut.'].forEach(q=>pr.append(el('div',{class:'kv'},el('span',{class:'k'},'•'),el('span',{style:'flex:1;margin-left:8px'},q))));
  pr.append(el('div',{style:'margin-top:10px'},el('button',{class:'btn',onclick:()=>go('log')},'Open trade log to journal →')));
  root.append(pr);
}

(async function(){
  // ask the OS not to evict our storage (best-effort; matters most on iOS)
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{await openDB();await loadAll();}catch(e){console.error(e);toast('Storage error — IndexedDB unavailable',true);}
  go('dashboard');
  // PWA: register the offline service worker when hosted over http(s); no-op on file://
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
