/* ============================================================
   SAMPLE DATA (demo mode) — a fabricated account so the app can be
   explored without an MT5 statement. Every record carries demo:true and
   is swept by clearDemoData(); importing a real statement clears it too.
   ============================================================ */
function demoRng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function demoDataset(){
  const rnd=demoRng(20260812);
  const pad=n=>String(n).padStart(2,'0');
  const fmt=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'.'+pad(d.getUTCMonth()+1)+'.'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());};
  const dkey=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());};
  const SYMS={EURUSD:{base:1.083,jit:0.004,dp:5,stop:()=>0.0012+rnd()*0.0022,vol:()=>+(0.02+rnd()*0.08).toFixed(2)},
              XAUUSD:{base:4720,jit:55,dp:2,stop:()=>3+rnd()*6,vol:()=>+(0.01+rnd()*0.04).toFixed(2)},
              US30:{base:39150,jit:380,dp:1,stop:()=>45+rnd()*110,vol:()=>+(0.1+rnd()*0.4).toFixed(2)}};
  const EMOS=['Calm','Confident','FOMO','Anxious','Greedy','Frustrated','Bored','Disciplined'];
  const tags=SETUPS.length?SETUPS:DEFAULT_SETUPS;
  // weekdays over the last ~6 weeks, oldest first, today (or last weekday) last
  const days=[];const nowMs=nowStmt();
  for(let d=42;d>=0;d--){const t=new Date(nowMs-d*864e5);const wd=t.getUTCDay();if(wd===0||wd===6)continue;days.push(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));}
  let ticket=990000001;const trades=[];
  const mk=(dayMs,h,m,symName,type,profit,o)=>{
    o=o||{};const S=SYMS[symName];const dir=type==='buy'?1:-1;
    const open=+(S.base+S.jit*(rnd()-0.5)*2).toFixed(S.dp);
    const stop=S.stop();const win=profit>0;
    const t={ticket:String(ticket++),symbol:symName,type,volume:S.vol(),
      openTime:fmt(dayMs+h*3600e3+m*60e3),closeTime:fmt(dayMs+h*3600e3+(m+12+Math.floor(rnd()*75))*60e3),
      openPrice:open,sl:+(open-dir*stop).toFixed(S.dp),tp:+(open+dir*stop*2.1).toFixed(S.dp),
      closePrice:+(open+dir*(win?stop*1.6:-stop)).toFixed(S.dp),
      commission:0,swap:0,profit:+profit.toFixed(2),
      setups:o.setups!==undefined?o.setups:(rnd()<0.65?[tags[Math.floor(rnd()*tags.length)]]:[]),
      note:o.note||'',emotion:o.emotion!==undefined?o.emotion:(rnd()<0.5?EMOS[Math.floor(rnd()*EMOS.length)]:''),
      confirmation:rnd()<0.4,plannedR:null,actualR:null,
      riskUSD:o.riskUSD!==undefined?o.riskUSD:(rnd()<0.6?5:null),
      session:null,demo:true,updatedAt:Date.now()};
    if(o.openTime)t.openTime=o.openTime;if(o.closeTime)t.closeTime=o.closeTime;
    trades.push(t);return t;};
  const symAt=i=>['EURUSD','XAUUSD','US30'][i%3];
  // background scatter — most days see one or two trades
  const badDay=days[days.length-8],capDay=days[days.length-15],today=days[days.length-1];
  days.forEach((dayMs,i)=>{
    if(dayMs===badDay||dayMs===capDay||dayMs===today)return;
    if(rnd()<0.38)return;
    const n=rnd()<0.35?2:1;
    for(let k=0;k<n;k++){
      const win=rnd()<0.56;
      mk(dayMs,7+Math.floor(rnd()*11),Math.floor(rnd()*59),symAt(i+k),rnd()<0.5?'buy':'sell',
         win?(2+rnd()*6.5):-(1.5+rnd()*3.2));
    }
  });
  // scripted: a single oversized loss (breaks the default per-trade cap)
  mk(capDay,14,10,'XAUUSD','buy',-6.4,{emotion:'Frustrated',riskUSD:5,setups:[tags[0]],
    note:'Moved my stop once and paid for it. The first stop was the right one.'});
  // scripted: the bad day — three losses, a revenge entry inside the break window,
  // then one more trade after the daily cap was already gone
  mk(badDay,9,10,'EURUSD','sell',-3.8,{emotion:'Anxious',riskUSD:5});
  const l2=mk(badDay,11,40,'XAUUSD','buy',-4.1,{emotion:'Frustrated',riskUSD:5});
  const l3=mk(badDay,13,5,'XAUUSD','buy',-3.6,{emotion:'FOMO',riskUSD:5,
    note:'Same idea as the last one. It was not a new setup, it was a rematch.'});
  l3.closeTime=fmt(badDay+13*3600e3+18*60e3);
  mk(badDay,13,22,'XAUUSD','buy',-2.9,{emotion:'FOMO',riskUSD:5,setups:[],
    openTime:fmt(badDay+13*3600e3+22*60e3),note:'Four minutes after the stopout. No plan, just anger.'});
  mk(badDay,15,0,'US30','sell',1.2,{emotion:'',riskUSD:3});
  // scripted: a clean streak for the best-run stat
  const s1=days[days.length-20],s2=days[days.length-19];
  const w1=mk(s1,8,30,'EURUSD','buy',6.8,{emotion:'Disciplined',riskUSD:5,setups:[tags[0]]});
  mk(s1,12,15,'US30','sell',4.9,{emotion:'Calm',riskUSD:5});
  mk(s2,9,45,'XAUUSD','buy',7.4,{emotion:'Confident',riskUSD:5,setups:[tags.length>1?tags[1]:tags[0]]});
  // today: one win, one small loss, so the day strip is alive
  mk(today,8,5,'EURUSD','buy',4.1,{emotion:'Calm',riskUSD:5,setups:[tags[0]]});
  mk(today,10,35,'US30','sell',-2.3,{emotion:'',riskUSD:5});
  // a plan that reconciles onto the streak trade, and one still pending
  const plans=[
    {id:'demo-plan-1',symbol:w1.symbol,dir:w1.type,entry:w1.openPrice,sl:w1.sl,tp:w1.tp,
     setups:w1.setups.slice(),session:'London',plannedR:2,riskUSD:5,
     note:'Planned at the level the night before. Waited for the retest.',
     createdMs:parseMT5Date(w1.openTime)-2*3600e3,status:'pending',ticket:null,demo:true},
    {id:'demo-plan-2',symbol:'XAUUSD',dir:'sell',entry:+(SYMS.XAUUSD.base+80).toFixed(2),sl:+(SYMS.XAUUSD.base+92).toFixed(2),tp:+(SYMS.XAUUSD.base+40).toFixed(2),
     setups:[tags[0]],session:'NY',plannedR:3,riskUSD:5,note:'Waiting for price to reach the zone.',
     createdMs:Date.now()-3600e3,status:'pending',ticket:null,demo:true}];
  const debriefs=[{date:dkey(badDay),createdAt:badDay,updatedAt:badDay,demo:true,
    text:'## What happened\nThree losses before lunch and I knew the third was a rematch, not a setup. Then I re-entered four minutes after the stopout.\n\n**The cap did its job** — the damage stopped where the rules said it would.\n\n## Tomorrow\n1. After two losses, close the platform for an hour.\n2. No re-entry on the same idea without a fresh signal.'}];
  return {trades,plans,debriefs};
}
function hasRealTrades(){return STATE.trades.some(t=>!t.demo);}
async function loadDemoData(){
  if(hasRealTrades()){toast('Sample data only loads into an empty journal',true);return;}
  if(!DB.db)await openDB();
  const {trades,plans,debriefs}=demoDataset();
  for(const t of trades)await idbPut('trades',t);
  for(const p of plans)await idbPut('plans',p);
  for(const d of debriefs)await idbPut('debriefs',d);
  STATE.settings.demoData=true;
  STATE.settings.account={name:'Sample data',number:'DEMO',currency:'USD',server:'Aether demo',kind:'sample',company:'Not a real account',demo:true};
  STATE.settings.summary=null;
  await saveSettings();
  await loadAll();
  await reconcilePlans();
  toast('Sample data loaded — explore freely, clear it from Data & Settings','good');
  go('dashboard');
}
async function clearDemoData(silent){
  if(!DB.db)await openDB();
  for(const t of await idbAll('trades'))if(t.demo)await idbDel('trades',String(t.ticket));
  for(const p of await idbAll('plans'))if(p.demo)await idbDel('plans',p.id);
  for(const d of await idbAll('debriefs'))if(d.demo)await idbDel('debriefs',d.date);
  if(STATE.settings.account&&STATE.settings.account.demo){STATE.settings.account=null;STATE.settings.summary=null;}
  STATE.settings.demoData=false;await saveSettings();
  await loadAll();
  if(!silent)toast('Sample data cleared','good');
}

/* ---------- CSV export of the enriched trade log ---------- */
function csvCell(v){
  if(v==null)return'';
  if(Array.isArray(v))v=v.join(' | ');
  if(typeof v==='boolean')v=v?'yes':'';
  v=String(v);
  if(/^[=+@\t]/.test(v))v="'"+v;         // spreadsheet formula-injection guard
  return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function exportTradesCSV(){
  const list=STATE.trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  if(!list.length){toast('Nothing to export — import a statement first',true);return;}
  const cols=['ticket','symbol','type','volume','openTime','closeTime','openPrice','closePrice','sl','tp','commission','swap','profit','R','session','weekday','dayKey','weekKey','durationMin','riskUSD','plannedR','setups','emotion','confirmation','revenge','ruleBroken','violations','note'];
  const rows=[cols.join(',')];
  for(const t of list)rows.push(cols.map(c=>csvCell(c==='violations'?(t.violations||[]).map(x=>x.label):t[c])).join(','));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:'aether-trades-'+new Date().toISOString().slice(0,10)+'.csv'});
  document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('CSV exported — '+list.length+' trades','good');
}

async function handleStatement(file){
  const ipage=$('#page-import');
  const loader=el('div',{class:'loading',style:'margin-bottom:14px'},el('span',{class:'spinner'}),'Reading your statement…');
  ipage.prepend(loader);
  try{
    const text=await readMT5File(file);
    const parsed=parseMT5(text);
    if(!parsed.trades.length)throw new Error('No closed positions found in the file.');
    const held=STATE.account;
    if(held&&!held.demo&&held.number&&parsed.account.number&&String(held.number)!==String(parsed.account.number)&&hasRealTrades()
       &&!confirm('This statement is for account #'+parsed.account.number+', but this journal holds account #'+held.number+'.\n\nImporting merges both accounts into one journal. Continue?')){loader.remove();return;}
    if(!DB.db)await openDB(); // self-heal if IndexedDB wasn't ready at boot
    if(STATE.settings.demoData)await clearDemoData(true);   // a real statement replaces the sample account
    // merge: preserve enrichment + dedupe by ticket
    let added=0,updated=0;const now=Date.now();
    for(const pt of parsed.trades){
      const existing=await idbGet('trades',pt.ticket);
      if(existing){updated++;await idbPut('trades',Object.assign({},existing,pt,{updatedAt:now}));}
      else {added++;await idbPut('trades',Object.assign({setups:[],note:'',emotion:'',confirmation:false,plannedR:null,actualR:null,riskUSD:null,session:null},pt,{updatedAt:now}));}
    }
    STATE.settings.account=parsed.account;STATE.settings.summary=parsed.summary;
    await saveSettings();
    await loadAll();
    await reconcilePlans();
    toast(`Imported ${parsed.trades.length} trades — ${added} new, ${updated} updated`,'good');
    STATE.settings.importsSinceBackup=(STATE.settings.importsSinceBackup||0)+1;await saveSettings();
    if(STATE.settings.importsSinceBackup%3===0)
      setTimeout(()=>toast(STATE.settings.importsSinceBackup+' imports since your last backup — everything lives in this browser, so export one from Data & Settings → Backup'),3100);
    renderImport();
  }catch(err){console.error(err);loader.remove();
    const root=$('#page-import');
    const storage=!DB.db||/transaction|indexed\s*db|object ?store|database/i.test(err.message||'');
    if(storage){
      toast('Storage unavailable — import not saved',true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Your statement parsed fine, but this browser context can\'t use IndexedDB, so nothing could be saved. Open this file directly in a normal browser tab (not a private/incognito window or a sandboxed preview) and try again.'));
    } else {
      toast('Import failed: '+err.message,true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Could not read this file: '+escapeHtml(err.message)+' — export your history from MT5 as an HTML "Trade History Report" and try again.'));
    }}
}

async function exportBackup(){
  const trades=await idbAll('trades');
  const images=await idbAll('images');
  const imgOut=[];
  for(const im of images){const b64=await blobToB64(im.blob);imgOut.push({id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,data:b64});}
  const debriefs=await idbAll('debriefs');
  const livetrades=await idbAll('livetrades');
  const plans=await idbAll('plans');
  const payload={app:'Aether',version:1,exported:new Date().toISOString(),settings:STATE.settings,trades,plans,debriefs,livetrades,images:imgOut};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:'aether-backup-'+new Date().toISOString().slice(0,10)+'.json'});document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
  STATE.settings.importsSinceBackup=0;await saveSettings();
  toast('Backup downloaded — '+trades.length+' trades, '+plans.length+' plans, '+images.length+' images','good');
}
function blobToB64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});}
function b64ToBlob(d){const[meta,data]=d.split(',');const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

async function importBackup(file){
  if(!confirm('Restore from backup? This merges the backup into your current data (existing tickets are overwritten).'))return;
  try{
    const text=await file.text();const p=JSON.parse(text);
    if(p.app!=='Aether')if(!confirm('This doesn\'t look like an Aether backup. Continue anyway?'))return;
    if(p.settings){
      // Only adopt keys this app actually has. Backups from older builds carry
      // dead keys (sync URLs, API keys) that must not be persisted here.
      const clean={};for(const k in DEFAULT_SETTINGS)if(k in p.settings)clean[k]=p.settings[k];
      STATE.settings=Object.assign({},DEFAULT_SETTINGS,clean);await saveSettings();
    }
    for(const t of(p.trades||[]))await idbPut('trades',t);
    for(const pl of(p.plans||[]))if(pl&&pl.id)await idbPut('plans',pl);
    for(const d of(p.debriefs||[]))await idbPut('debriefs',d);
    for(const lt of(p.livetrades||[]))await idbPut('livetrades',lt);
    for(const im of(p.images||[]))await idbPut('images',{id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,blob:b64ToBlob(im.data)});
    await loadAll();toast('Backup restored','good');renderImport();
  }catch(err){console.error(err);toast('Restore failed: '+err.message,true);}
}

/* Each rule, the words it is edited under, and one line on what it does. The
   meaning of every rule is unchanged — this is the same risk model runRules() judges. */
const RULE_FIELDS=[
  {grp:'Per trade',k:'maxRisk',label:'Max risk per trade',money:true,help:'The most you may risk on any single trade.'},
  {grp:'Loss caps',k:'dailyLoss',label:'Daily loss cap',money:true,help:'Pooled across all instruments. The primary discipline: trade freely while you still have loss room.'},
  {grp:'Loss caps',k:'weeklyLoss',label:'Weekly loss cap',money:true,help:'Pooled across all instruments.'},
  {grp:'Profit scaling',k:'scaleAfter',label:'Scale down after a day above',money:true,help:'Once the day is up this much, risk per trade scales down.'},
  {grp:'Profit scaling',k:'scaledRisk',label:'Scaled-down risk',money:true,help:'Risk per trade once scaling is active.'},
  {grp:'Profit scaling',k:'drawback',label:'Lock-in stop after scaling',money:true,help:'The drawback (lock-in) stop that protects the day once scaled.'},
  {grp:'After a stopout',k:'breakMins',label:'Forced break after a stopout (mins)',money:false,help:'Mandatory break after any stopout — no new entries inside that window.'}
];
function renderRules(){
  const root=$('#page-rules');root.innerHTML='';
  root.append(el('h2',{class:'sec'},'Your trading rules'),
    el('div',{class:'cap'},'Pooled across every instrument you trade. Aether flags trades that break these — set them to the risk model you actually trade, in your account currency. Changing them re-judges your whole history.'));
  const rp=el('div',{class:'panel rulesform'});
  const R=Object.assign({},DEFAULT_RULES,STATE.settings.rules||{});
  let grpBox=null,grpName=null;
  RULE_FIELDS.forEach(f=>{
    if(f.grp!==grpName){grpName=f.grp;grpBox=el('div',{class:'rulefields'});rp.append(el('div',{class:'rulegrp'},el('div',{class:'k'},f.grp),grpBox));}
    const id='rule-'+f.k;
    const inp=el('input',{type:'number',id,step:f.k==='breakMins'?'1':'0.01',min:'0',inputmode:'decimal',value:R[f.k],'aria-describedby':id+'-help',
      oninput:e=>{R[f.k]=e.target.value===''?0:+e.target.value;}});
    grpBox.append(el('div',{class:'rulefld'},
      el('label',{class:'fld',for:id},f.label+(f.money?' ('+CURSYM.trim()+')':'')),
      inp,
      el('div',{class:'help',id:id+'-help'},f.help)));
  });
  const setupsIn=el('input',{type:'text',id:'rule-setups',value:(STATE.settings.setups||DEFAULT_SETUPS).join(', '),placeholder:'BOS, Liquidity sweep, Order block…'});
  const instIn=el('input',{type:'text',id:'rule-instruments',value:(STATE.settings.instruments||[]).join(', '),placeholder:'EURUSD, XAUUSD, US30…'});
  rp.append(el('div',{class:'rulegrp'},el('div',{class:'k'},'Vocabulary'),
    el('div',{class:'rulefld wide'},el('label',{class:'fld',for:'rule-setups'},'Your setups'),setupsIn,el('div',{class:'help'},'Comma separated. Used for tagging trades and for setup stats.')),
    el('div',{class:'rulefld wide',style:'margin-top:14px'},el('label',{class:'fld',for:'rule-instruments'},'Instruments you trade'),instIn,el('div',{class:'help'},'Anything you import is added automatically.'))));
  const rSave=el('button',{class:'btn primary'},'Save rules');
  rSave.addEventListener('click',async()=>{
    const bad=RULE_FIELDS.filter(f=>!(R[f.k]>0)).map(f=>f.label);
    if(bad.length){toast('Every rule needs a number above zero — check: '+bad.join(', '),true);return;}
    STATE.settings.rules=R;
    STATE.settings.setups=setupsIn.value.split(',').map(s=>s.trim()).filter(Boolean);
    STATE.settings.instruments=instIn.value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
    await saveSettings();
    applyUserConfig();
    STATE.trades=STATE.trades.map(t=>enrich(t));
    runRules(STATE.trades);
    toast('Rules saved — history re-judged','good');
    renderLockBanner();
    renderRules();
  });
  rp.append(el('div',{class:'rulesave'},rSave));
  root.append(rp);
  root.append(el('div',{class:'cap',style:'margin-top:12px'},'Instruments differ in point value, typical stop width and spread, so position size has to be worked out per instrument — but your '+amt(RULES.maxRisk)+' / '+amt(RULES.dailyLoss)+' / '+amt(RULES.weeklyLoss)+' caps apply identically to all of them.'));

  // editable key levels
  root.append(el('h2',{class:'sec'},'Key levels'),el('div',{class:'cap'},'Recurring levels you keep coming back to, per instrument.'));
  INSTRUMENTS.forEach(sym=>{
    const info=symInfo(sym);
    const box=el('div',{class:'panel',style:'margin-bottom:14px'});
    box.append(el('h4',{style:'margin:0 0 12px'},el('span',{class:'pill '+info.cls},sym)));
    const list=STATE.settings.keyLevels[sym]||(STATE.settings.keyLevels[sym]=[]);
    const rows=el('div');
    function draw(){
      rows.innerHTML='';
      list.forEach((lv,i)=>{
        const labIn=el('input',{class:'lblw',type:'text',value:lv.label,placeholder:'Label','aria-label':sym+' level label',oninput:e=>lv.label=e.target.value});
        const valIn=el('input',{type:'text',value:lv.value,placeholder:'Price / zone','aria-label':sym+' level price or zone',oninput:e=>lv.value=e.target.value});
        rows.append(el('div',{class:'levelrow'},labIn,valIn,el('button',{class:'btn icon','aria-label':'Remove level',title:'Remove',onclick:async()=>{list.splice(i,1);await saveSettings();draw();}},icon('x'))));
      });
      if(!list.length)rows.append(el('div',{class:'faint',style:'font-size:.75rem;margin-bottom:8px'},'No levels yet for '+sym+' — add the ones you keep coming back to.'));
    }
    draw();
    box.append(rows);
    box.append(el('div',{style:'display:flex;gap:10px;margin-top:6px'},
      el('button',{class:'btn sm',onclick:async()=>{list.push({label:'',value:''});await saveSettings();draw();}},icon('plus'),'Add level'),
      el('button',{class:'btn sm',onclick:async()=>{await saveSettings();toast(sym+' levels saved','good');}},'Save '+sym)));
    root.append(box);
  });
}

/* ============================================================
   CHECKLIST
   ============================================================ */
/* ticks live in memory only (as before) — they survive moving between pages, not a reload */
const CHECK_TICKS=new Set();
function renderChecklist(){
  const root=$('#page-checklist');root.innerHTML='';
  // live pooled usage TODAY / THIS WEEK — the same numbers the banner uses
  const {tKey,dayPL,weekPL,sinceLoss,inBreak,roomDaily,roomWeekly}=liveStatus();
  root.append(el('div',{class:'eyebrow'},'Live pooled status · '+tKey));
  const figs=el('div',{class:'panel',style:'margin-bottom:8px'});
  figs.append(el('div',{class:'figrow'},
    figure('Loss room today',usd(Math.max(0,roomDaily)),roomDaily<=RULES.maxRisk?'neg':'pos','before the −'+amt(RULES.dailyLoss)+' cap'),
    figure('Day P&L',usd(dayPL),signCls(dayPL),'cap -'+amt(RULES.dailyLoss)),
    figure('Week P&L',usd(weekPL),signCls(weekPL),'cap -'+amt(RULES.weeklyLoss)),
    figure('Since last stopout',sinceLoss==null||sinceLoss<0?'—':(sinceLoss<60?Math.round(sinceLoss)+'m':Math.floor(sinceLoss/60)+'h '+Math.round(sinceLoss%60)+'m'),inBreak?'neg':'pos',inBreak?('in '+RULES.breakMins+'m break'):'clear')));
  root.append(figs);

  const dailyOK=dayPL>-RULES.dailyLoss, weeklyOK=weekPL>-RULES.weeklyLoss;
  const scaled=dayPL>=RULES.scaleAfter;

  root.append(el('h2',{class:'sec'},'Pre-trade checklist'));
  const auto=[
    [dailyOK,'Within daily loss cap', `Day P&L ${usd(dayPL)} vs −${amt(RULES.dailyLoss)} limit · ${usd(Math.max(0,roomDaily))} of room left.`],
    [weeklyOK,'Within weekly loss cap', `Week P&L ${usd(weekPL)} vs −${amt(RULES.weeklyLoss)} limit · ${usd(Math.max(0,roomWeekly))} of room left.`],
    [!inBreak,'Not inside the '+breakLabel()+' stopout break', inBreak?`Last stopout was ${Math.round(sinceLoss)}m ago — wait ${Math.max(0,Math.ceil(RULES.breakMins-sinceLoss))}m more.`:'No recent stopout blocking you.']
  ];
  const manual=[
    ['Risk ≤ '+amt(scaled?RULES.scaledRisk:RULES.maxRisk),'Position sized for this instrument so the worst case stays inside your per-trade cap.'],
    ['Higher timeframe agrees','Structure above your entry timeframe supports the direction?'],
    ['Entry trigger confirmed','A signal you defined in advance actually fired — not anticipation?'],
    ['Level mapped','Entry tied to a level you marked before the session?'],
    ['Exit defined','Stop and target both set before entry, not after?']
  ];

  // progress across both kinds, and a clear Ready once everything passes
  const prog=el('div',{class:'ckprog','aria-live':'polite'});
  const meter=el('div',{class:'ckmeter'},el('i',{}));
  const reset=el('button',{class:'btn sm ghost',onclick:()=>{CHECK_TICKS.clear();root.querySelectorAll('.tick input').forEach(c=>{c.checked=false;});upd();}},icon('refresh'),'Reset');
  root.append(el('div',{class:'ckhead'},prog,reset),meter);
  function upd(){
    const autoOK=auto.filter(a=>a[0]).length,ticked=manual.filter((_,i)=>CHECK_TICKS.has(i)).length;
    const total=auto.length+manual.length,n=autoOK+ticked,ready=n===total;
    prog.className='ckprog'+(ready?' ready':autoOK<auto.length?' blocked':'');
    prog.replaceChildren(...(ready?[icon('checkCircle'),el('b',{},'Ready'),' — every check passes']:[el('b',{},n+' of '+total),' checks pass'+(autoOK<auto.length?' · an automatic check is failing':'')]));
    meter.className='ckmeter'+(ready?' ready':'');meter.firstChild.style.width=(n/total*100)+'%';
    reset.disabled=!CHECK_TICKS.size;
  }

  // automatic checks are facts read from the journal — a status row, not something to tick
  const facts=el('div',{class:'panel cklist',role:'list','aria-label':'Automatic checks'});
  facts.append(el('div',{class:'ckgrp'},'From your journal'));
  auto.forEach(a=>facts.append(el('div',{class:'fact '+(a[0]?'ok':'bad'),role:'listitem'},
    el('span',{class:'fic'},icon(a[0]?'checkCircle':'alert')),
    el('div',{},el('div',{class:'ttl'},a[1]),el('div',{class:'desc'},a[2])))));
  root.append(facts);

  if(scaled)root.append(el('div',{class:'note',style:'margin:12px 0 0'},'You\'re past +'+amt(RULES.scaleAfter)+' today — scaling rule active: risk '+amt(RULES.scaledRisk)+' per trade, lock in with a '+amt(RULES.drawback)+' drawback stop.'));

  // manual checks: full-width rows, the whole row is the tap target
  const ticks=el('div',{class:'panel cklist',style:'margin-top:12px'});
  ticks.append(el('div',{class:'ckgrp'},'Before you enter'));
  manual.forEach((m,i)=>{
    const cb=el('input',{type:'checkbox',onchange:e=>{if(e.target.checked)CHECK_TICKS.add(i);else CHECK_TICKS.delete(i);upd();}});
    cb.checked=CHECK_TICKS.has(i);
    ticks.append(el('label',{class:'tick'},cb,el('span',{class:'tickmark','aria-hidden':'true'},icon('check')),el('div',{},el('div',{class:'ttl'},m[0]),el('div',{class:'desc'},m[1]))));
  });
  root.append(ticks);
  upd();

  root.append(el('h2',{class:'sec'},'Post-trade review'));
  const pr=el('div',{class:'panel'});
  ['Did I follow my plan exactly, or improvise?','Was the entry a real confirmed signal or a forced trade?','If it lost — was it a clean stop (acceptable) or a rule-break?','What did the H1→15m→5m read actually tell me?','One thing to repeat. One thing to cut.'].forEach(q=>pr.append(el('div',{class:'kv'},el('span',{class:'k'},'•'),el('span',{style:'flex:1;margin-left:8px'},q))));
  pr.append(el('div',{style:'margin-top:10px'},el('button',{class:'btn',onclick:()=>go('log')},'Open trade log to journal →')));
  root.append(pr);
}

/* ============================================================
   BOOT
   ============================================================ */
(async function(){
  // ask the OS not to evict our storage (best-effort; matters most on iOS)
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{await openDB();await loadAll();}catch(e){console.error(e);toast('Storage error — IndexedDB unavailable',true);}
  go('dashboard');
  // PWA: register the offline service worker when hosted over http(s); no-op on file://
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
