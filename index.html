<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Offline trading journal for MetaTrader 5. Import your statement, tag your trades and hold yourself to your own risk rules. Your data never leaves your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Aether — Trading Journal">
<meta property="og:description" content="Offline trading journal for MetaTrader 5. No account, no server — your data never leaves your browser.">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aether">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Aether — Trading Journal</title>
<style>
:root{
  --bg:#0a0a0b; --panel:#111113; --panel2:#17171a;
  --line:#1d1d20; --line2:#26262b; --border:#37373d;
  --text:#ececee; --muted:#8f8f97; --faint:#74747d;   /* faint is 4.3:1 on the page — it labels data, so it has to be readable */
  --accent:#9c5550; --accent-bright:#cf837c;
  --win:#3f6b55; --win-bright:#8bbd9f;
  --gbp:#93a7bb; --xau:#b8aa8b;
  --amber:#b9a26b;
  --r:10px; --r-lg:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --elev:none;
  --dur:.15s; --dur-pg:.22s; --ease:cubic-bezier(.4,0,.2,1);
  --sp:28px;
  --spring:cubic-bezier(.22,1,.36,1);   /* a critically damped settle: fast start, no overshoot */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:.875rem;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:.004em;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-optical-sizing:auto}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:.8125rem}
a{color:var(--text);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#232327;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#2e2e33}
::-webkit-scrollbar-track{background:transparent}
::selection{background:#2e2e33}

@keyframes fadeRise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout: top bar instead of sidebar ---------- */
#app{display:flex;flex-direction:column;min-height:100vh}
#sidebar{width:100%;height:auto;position:sticky;top:0;z-index:40;display:flex;flex-direction:row;align-items:center;gap:10px;background:rgba(10,10,11,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid transparent;transition:border-color .25s ease;padding:0 20px;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:0 18px 0 0;border-bottom:0;border-right:1px solid var(--line);margin-right:4px;align-self:stretch;display:flex;align-items:center}
.brand .logo{font-size:.875rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
.brand .logo b{color:inherit;font-weight:600}
nav{display:flex;flex:1;padding:0;overflow-x:auto;gap:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.navbtn{display:flex;align-items:center;width:auto;flex:none;white-space:nowrap;text-align:left;background:none;border:0;color:var(--muted);padding:16px 13px 14px;font-size:.8125rem;font-weight:500;border-left:0;border-bottom:2px solid transparent;transition:color var(--dur),border-color var(--dur)}
.navbtn:hover{color:var(--text);background:none}
.navbtn.active{color:var(--text);font-weight:600;background:none;border-bottom-color:var(--text)}
.navbtn .ico{display:none}
.navlabel{display:none}
.sidefoot{display:none}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:static;background:none;border-bottom:0;padding:30px 28px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1160px;width:100%;margin:0 auto}
header .ttl{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
header .spacer{flex:1}
.segmented{display:inline-flex;background:none;border:1px solid var(--line2);border-radius:8px;overflow:hidden;padding:2px;gap:2px}
.segmented button{background:none;border:0;color:var(--muted);padding:5px 13px;font-size:.75rem;font-weight:600;letter-spacing:.02em;border-radius:6px;transition:background var(--dur),color var(--dur)}
.segmented button:hover{color:var(--text)}
.segmented button.on{background:var(--text);color:var(--bg)}
.acctchip{font-size:.6875rem;color:var(--faint);text-align:right;line-height:1.35}
.acctchip b{color:var(--muted);font-weight:600}
.content{padding:18px 28px 64px;max-width:1160px;width:100%;margin:0 auto}

.page{display:none}
.page.active{display:block;animation:fadeRise var(--dur-pg) var(--ease)}

/* sub-tabs */
.subtabs{display:inline-flex;gap:2px;background:none;border:1px solid var(--line2);border-radius:8px;padding:3px;margin-bottom:24px;flex-wrap:wrap}
.subtabs button{background:none;border:0;color:var(--muted);padding:7px 15px;font-size:.78125rem;font-weight:500;letter-spacing:.01em;border-radius:6px;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.subtabs button:hover{color:var(--text)}
.subtabs button.on{background:var(--text);color:var(--bg);font-weight:600}
.subtabs button.on:hover{background:var(--text)}
.tabbody.fadein{animation:fadeIn var(--dur-pg) var(--ease)}

/* ---------- Dashboard › Performance: the page's hero ---------- */
.perf{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px 20px;margin-bottom:16px;background:var(--panel)}
.perfhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.perfttl{margin:0;font-size:1.0625rem;font-weight:600;letter-spacing:-.005em}
.perfhead .rangebtns{margin-left:auto}
.perf>.k{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.perfnum{font-size:3.25rem;line-height:1;margin-top:10px}
.discline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8125rem;color:var(--muted);margin:12px 0 18px;line-height:1.5}
.discline b{font-family:var(--mono);font-weight:600}
.discline .sep{color:var(--faint)}
.chartwrap{position:relative}
.perf .legend{margin-top:10px}
.perf .figrow{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.legend i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed;background:none!important}
.dashfoot{margin-top:18px}
@media(max-width:600px){.perf{padding:18px 16px 16px}.perfnum{font-size:2.5rem}.perf .figrow{gap:14px 26px}}

/* ---------- Bits ---------- */
/* Type roles: page title (header .ttl) › section heading (h2.sec) › card micro-label (.k) › form label (.fld) › caption (.cap) */
.eyebrow{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;font-weight:600}
h2.sec{font-size:1.0625rem;letter-spacing:-.005em;margin:40px 0 14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:12px;line-height:1.3}
h2.sec::before{content:none}
h2.sec:first-child{margin-top:0}
.cap{font-size:.75rem;color:var(--faint);line-height:1.5}
h2.sec+.cap{margin:-8px 0 14px}
/* Surfaces: page (--bg) › card (--panel + --line border) › inset (--panel2, no border). A card never holds a card. */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.inset{background:var(--panel2);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:1fr 1fr}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color var(--dur)}
.stat:hover{border-color:var(--border)}
.stat .k{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-size:1.625rem;font-weight:600;font-family:var(--mono);margin-top:9px;letter-spacing:-.025em;line-height:1.05}
.stat .sub{font-size:.75rem;color:var(--muted);margin-top:4px}
/* an inline row of figures inside one card, instead of a card per figure */
.figrow{display:flex;flex-wrap:wrap;gap:16px 36px}
.figrow .f .k{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.figrow .f .v{font-family:var(--mono);font-size:1.125rem;font-weight:600;margin-top:5px;letter-spacing:-.01em}
.figrow .f .sub{font-size:.75rem;color:var(--muted);margin-top:2px}
/* large display numbers: the system sans with tabular figures reads lighter than a 58px monospace */
.display,.stat .v.display{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:600}
/* icons: inline SVG, sized to the text around them */
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.pos{color:var(--win-bright)} .neg{color:var(--accent-bright)} .num{font-family:var(--mono)}
.pill{display:inline-block;font-size:.65625rem;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);background:none;font-weight:500}
.pill.gbp{color:var(--gbp);border-color:#333c46}
.pill.xau{color:var(--xau);border-color:#413c30}
.pill.win{color:var(--win-bright);border-color:#2c4638}
.pill.loss{color:var(--accent-bright);border-color:#4a322f}
.pill.flag{color:var(--accent-bright);border-color:#4a322f;background:#171112}
.pill.soft{color:var(--amber);border-color:#413c2c}
.tag-chip{display:inline-block;font-size:.6875rem;padding:4px 11px;border-radius:20px;background:none;border:1px solid var(--line2);color:var(--muted);margin:2px 4px 2px 0;transition:border-color var(--dur),color var(--dur)}
.tag-chip:hover{border-color:var(--border);color:var(--text)}
.tag-chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

/* Buttons: one white primary per view; everything else outlined or ghost. Destructive = ghost with red text. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:none;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 15px;font-size:.8125rem;font-weight:500;line-height:1.35;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{border-color:var(--border);background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#fff;border-color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:5px 11px;font-size:.75rem;gap:6px}
.btn.danger{border-color:transparent;color:var(--accent-bright)}
.btn.danger:hover{background:#171112;border-color:transparent;color:var(--accent-bright)}
/* square icon-only button (remove, delete) — quiet until hovered */
.btn.icon{padding:0;width:34px;height:34px;flex:none;border-color:transparent;color:var(--faint)}
.btn.icon:hover{color:var(--accent-bright);background:#171112;border-color:transparent}
.btn.icon .ic{width:17px;height:17px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:.8125rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;transition:color var(--dur),text-decoration-color var(--dur)}
.linkbtn:hover{color:var(--text);text-decoration-color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:.78125rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--faint);font-size:.59375rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th .arr{opacity:.5;font-size:.5625rem}
tbody tr{transition:background var(--dur)}
.logtable td[data-k=flags]{white-space:nowrap}
.logtable td[data-k=flags] .pill+.pill{margin-left:4px}
.pill.more{color:var(--faint)}
.logtop{display:none}
.filterbtn .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--text);color:var(--bg);font-size:.6875rem;font-weight:700}
.clearf{display:flex;align-items:flex-end;padding-bottom:6px}
tbody tr:hover{background:#151517;cursor:pointer}
td.r,th.r{text-align:right}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
/* inside a card, tables and day cards become insets */
.chartbox .tablewrap,.panel .tablewrap{border:0;background:var(--panel2);border-radius:8px}
.chartbox .tablewrap th,.panel .tablewrap th{background:var(--panel2)}
.chartbox .plancard{border:0;background:var(--panel2)}
.muted{color:var(--muted)} .faint{color:var(--faint)}

.empty{text-align:center;color:var(--muted);padding:56px 22px;border:1px dashed var(--line2);border-radius:var(--r-lg)}
.empty .big{font-size:1rem;color:var(--text);margin-bottom:7px;font-weight:600}

/* notes and warnings are insets: tinted fill, no border, so they can sit inside a card */
.warn{background:#1a1213;border-radius:8px;padding:12px 15px;color:#d6b0aa;font-size:.8125rem;line-height:1.55}
.note{background:var(--panel2);border-radius:8px;padding:12px 15px;color:var(--muted);font-size:.8125rem;line-height:1.6}

input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  background:#0d0d0f;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%;transition:border-color var(--dur)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--border)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label.fld,.fld{display:block;font-size:.75rem;letter-spacing:0;color:var(--muted);margin:0 0 6px;font-weight:500}
.help{font-size:.75rem;color:var(--faint);margin-top:6px;line-height:1.45}
.row{display:flex;gap:12px 14px;flex-wrap:wrap}
.row>div{flex:0 1 200px;min-width:120px}
.row>div.wide{flex:1 1 280px}
.rulegrp{padding:18px 0;border-top:1px solid var(--line)}
.rulegrp:first-child{padding-top:2px;border-top:0}
.rulegrp>.k{font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:12px}
.rulefields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px 24px}
.rulefld input[type=number]{max-width:160px}
.rulefld.wide input{max-width:560px}
.rulesave{padding-top:18px;border-top:1px solid var(--line)}
.dropzone{display:flex;align-items:center;justify-content:center;gap:10px}
.dropzone .ic{width:20px;height:20px}

.dropzone{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--faint);background:none;font-size:.8125rem;transition:border-color var(--dur),color var(--dur),background var(--dur)}
.dropzone:hover{border-color:var(--border);color:var(--muted)}
.dropzone.hot{border-color:var(--muted);color:var(--text);background:var(--panel2)}
@media(hover:none){.dropzone.drag-only{display:none}}

/* loading */
.spinner{width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--muted);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;flex-shrink:0}
.loading{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:.8125rem;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- Modal ---------- */
#overlay{position:fixed;inset:0;display:none;z-index:50;overscroll-behavior:contain}
/* the scrim is its own layer so it can dim in step with the sheet (--scrim is driven by the spring) */
#overlay::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);opacity:var(--scrim,1)}
#overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
#overlay.closing,#overlay.closing .modal{pointer-events:none}
.modal{position:relative;background:var(--panel);border:1px solid var(--line2);border-top-color:#35353b;border-radius:var(--r-lg);width:100%;max-width:760px;box-shadow:0 32px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.4)}
.modal .mhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:1}
.modal .mhead h3{margin:0;font-size:.9375rem;font-weight:600}
.modal .mbody{padding:22px}
.modal .mfoot{position:sticky;bottom:0;z-index:1;display:flex;gap:10px;align-items:center;padding:14px 22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 var(--r-lg) var(--r-lg)}
.closeX{margin-left:auto;background:none;border:0;color:var(--faint);font-size:1.375rem;line-height:1;transition:color var(--dur)}
.closeX:hover{color:var(--text)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.shot{position:relative;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#000}
.shot img{width:100%;display:block;cursor:zoom-in}
.shot .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.72);border:0;color:#fff;border-radius:5px;font-size:.6875rem;padding:2px 6px}

/* charts */
canvas{display:block;width:100%;touch-action:pan-y}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative}
.chartbox h4{margin:0 0 4px;font-size:.8125rem;font-weight:600;letter-spacing:.01em}
.chartbox .cap{font-size:.75rem;color:var(--faint);margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:.6875rem;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.charttip{position:absolute;pointer-events:none;background:#0d0d0f;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.71875rem;font-family:var(--mono);color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5;white-space:nowrap;transform:translate(-50%,-118%);opacity:0;transition:opacity .12s}
.charttip.on{opacity:1}
.charttip .tl{color:var(--faint);font-size:.59375rem;letter-spacing:.06em;display:block;font-family:var(--sans)}
.rangebtns{display:inline-flex;gap:2px;background:none;border:1px solid var(--line2);border-radius:8px;padding:2px;margin-left:auto}
.rangebtns button{background:none;border:0;color:var(--muted);font-size:.6875rem;font-weight:600;padding:4px 10px;border-radius:6px;transition:background var(--dur),color var(--dur);letter-spacing:.04em}
.rangebtns button:hover{color:var(--text)}
.rangebtns button.on{background:var(--text);color:var(--bg)}



/* daily debrief */
.debrief{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;background:var(--panel)}
.dbtrades{display:flex;flex-direction:column;gap:6px;margin:11px 0 2px}
.dbtrade{display:flex;align-items:center;gap:10px;font-size:.78125rem;padding:8px 12px;border-radius:8px;background:var(--panel2)}
.debrief-card{border-radius:8px;padding:16px 18px;background:var(--panel2)}
.md h4.mdh{margin:16px 0 7px;font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border:0;padding:0;display:block}
.md h4.mdh::before{content:none}
.md h4.mdh:first-child{margin-top:0}
.md .mdp{margin:0 0 9px;font-size:.8125rem;line-height:1.65}
.md .mdul{margin:0 0 10px;padding-left:20px}
.md .mdul li{margin:4px 0;font-size:.8125rem;line-height:1.6}
.md b{color:var(--text)}
.debrief.collapsible{padding:0;overflow:hidden}
.dbhead-row{display:flex;align-items:center;gap:11px;padding:15px 20px;cursor:pointer;transition:background var(--dur) var(--ease)}
.dbhead-row:hover{background:rgba(255,255,255,.025)}
.dbhead-row .chev{color:var(--faint);width:16px;height:16px;flex-shrink:0;display:grid;place-items:center}
.dbhead-row .chev .ic{width:16px;height:16px;transition:transform .32s var(--spring)}

/* ============================================================
   FLUID INTERFACE PASS
   Response on press, sliding indicators, material depth,
   and the sheet/dialog presentation driven by the spring
   layer in the motion script below.
   ============================================================ */

/* ---------- Response: feedback on pointer-down, instant ---------- */
html{-webkit-tap-highlight-color:transparent}
a,button,input,select,textarea,label,tbody tr,.calcell.has,.dbhead-row,.dropzone{touch-action:manipulation}
.btn{transition:background var(--dur),border-color var(--dur),transform .32s var(--spring)}
.btn:active{transform:scale(.97);transition-duration:var(--dur),var(--dur),.09s}
.btn:disabled:active{transform:none}
button.tag-chip{transition:border-color var(--dur),color var(--dur),transform .32s var(--spring)}
button.tag-chip:active{transform:scale(.95);transition-duration:var(--dur),var(--dur),.09s}
.segmented button,.subtabs button,.rangebtns button,.statusbtns button{transition:background var(--dur),color var(--dur),transform .32s var(--spring)}
.segmented button:active,.subtabs button:active,.rangebtns button:active,.statusbtns button:active{transform:scale(.96);transition-duration:var(--dur),var(--dur),.09s}
.navbtn:active{color:var(--text);transition-duration:0s}
tbody tr:active{background:#1b1b1f;transition-duration:0s}
.dbhead-row:active{background:rgba(255,255,255,.05);transition-duration:0s}
.calcell.has:active{transform:scale(.97);transition-duration:.09s}
.closeX{width:36px;height:36px;margin:-8px -8px -8px auto;border-radius:50%;display:grid;place-items:center;flex:none;transition:color var(--dur),background var(--dur),transform .32s var(--spring)}
.closeX:hover{background:var(--panel2)}
.closeX .ic{width:20px;height:20px}
.closeX:active{transform:scale(.9);transition-duration:var(--dur),var(--dur),.09s}
input:focus,select:focus,textarea:focus{border-color:var(--muted);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{transition:border-color var(--dur),box-shadow var(--dur)}
/* iOS zooms the page when a focused field is under 16px — keep touch fields at 16 */
@media(pointer:coarse){input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{font-size:1rem}}

/* ---------- Sliding indicators: the selection travels, it doesn't jump ---------- */
nav{position:relative}
nav.thumbed::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--tw,0px);transform:translateX(var(--tx,0px));background:var(--text);border-radius:2px 2px 0 0;pointer-events:none}
nav.thumbed.thumb-anim::after{transition:transform .42s var(--spring),width .42s var(--spring)}
nav.thumbed .navbtn.active{border-bottom-color:transparent}
.segmented,.subtabs,.rangebtns,.statusbtns{position:relative;isolation:isolate}
/* The thumb sits above the labels and blends by difference, so a label reads
   dark-on-light exactly where the thumb covers it — mid-slide included. */
.segmented.thumbed::before,.subtabs.thumbed::before,.rangebtns.thumbed::before,.statusbtns.thumbed::before{content:"";position:absolute;z-index:1;left:0;top:0;width:var(--tw,0px);height:var(--th,0px);transform:translate(var(--tx,0px),var(--ty,0px));background:var(--text);border-radius:6px;mix-blend-mode:difference;pointer-events:none}
.segmented.thumbed.thumb-anim::before,.subtabs.thumbed.thumb-anim::before,.rangebtns.thumbed.thumb-anim::before,.statusbtns.thumbed.thumb-anim::before{transition:transform .38s var(--spring),width .38s var(--spring),height .38s var(--spring)}
.segmented.thumbed button.on,.subtabs.thumbed button.on,.subtabs.thumbed button.on:hover,.rangebtns.thumbed button.on,.statusbtns.thumbed button.on{background:transparent;color:var(--text)}

/* ---------- Materials: scroll-edge instead of a permanent divider ---------- */
#sidebar::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(rgba(0,0,0,.34),transparent);opacity:0;transition:opacity .25s ease;pointer-events:none}

<script>
/* ============================================================
   MOTION — springs, the sheet gesture, sliding indicators.
   Self-contained and dependency-free (the app stays offline).

   The rule all of it follows: motion starts from the value that is
   on screen right now, keeps the velocity it already has, and can be
   grabbed or reversed at any instant. Nothing here locks out input.

   Public surface, called by the app further down:
     presentModal()   show #overlay (dialog on desktop, sheet on a phone)
     dismissModal()   hide it along the path it arrived by
   ============================================================ */
(function(){
'use strict';
var overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
var bar=document.getElementById('sidebar'),nav=document.getElementById('nav');
var mqReduce=matchMedia('(prefers-reduced-motion: reduce)');
var mqSheet=matchMedia('(max-width: 640px)');
function clamp(n,a,b){return n<a?a:n>b?b:n;}

/* A spring on one number. Tuned with Apple's two designer parameters —
   damping ratio (1 = settles with no overshoot) and response (seconds) —
   instead of mass/stiffness/damping. Calling to() mid-flight keeps the live
   value and velocity, which is what makes every animation interruptible. */
function Spring(render){
  var x=0,v=0,target=0,k=0,c=0,prec=.5,raf=0,last=0,onRest=null;
  function tick(now){
    var dt=clamp((now-last)/1000,0,1);last=now;      // a late frame catches up instead of slowing the motion down
    while(dt>1e-6){var h=Math.min(dt,.004);v+=(-k*(x-target)-c*v)*h;x+=v*h;dt-=h;}
    if(Math.abs(x-target)<prec&&Math.abs(v)<prec*20){
      x=target;v=0;raf=0;render(x);
      var done=onRest;onRest=null;if(done)done();
      return;
    }
    render(x);raf=requestAnimationFrame(tick);
  }
  return{
    value:function(){return x;},
    moving:function(){return raf!==0;},
    /* the finger takes over: freeze where it is, forget the destination */
    stop:function(){if(raf){cancelAnimationFrame(raf);raf=0;}v=0;onRest=null;},
    set:function(n){this.stop();x=n;render(x);},
    to:function(n,o,done){
      var w=2*Math.PI/(o.response||.35);
      k=w*w;c=2*(o.damping==null?1:o.damping)*w;
      prec=o.precision||.5;target=n;onRest=done||null;
      if(o.velocity!=null)v=o.velocity;          // gesture hand-off; otherwise carry the live velocity
      if(!raf){last=performance.now();raf=requestAnimationFrame(tick);}
    }
  };
}

/* Where a flick would come to rest, by the same exponential decay scrolling uses. */
function project(velocity,rate){rate=rate||.998;return(velocity/1000)*rate/(1-rate);}
/* Past a boundary the sheet follows less and less — it resists, it doesn't stop dead. */
function rubberband(over,dim,k){k=k||.55;return(over*dim*k)/(dim+k*Math.abs(over));}

/* ---------- Modal: dialog on desktop, bottom sheet on a phone ---------- */
var state='closed';          // 'closed' | 'open' | 'closing'
var mode='dialog';           // 'dialog' | 'sheet' | 'fade' (reduced motion)
var H=1;                     // sheet travel in px
var handoff=null;            // release velocity passed from the drag to dismissModal
var lastPoint=null;          // where the user last pressed — the dialog grows from there
var returnFocus=null;        // what had focus before the dialog opened

function paint(n){
  if(mode==='sheet'){
    modal.style.transform='translate3d(0,'+n.toFixed(2)+'px,0)';
    overlay.style.setProperty('--scrim',clamp(1-n/H,0,1).toFixed(3));
  }else{
    var p=clamp(n,0,1);
    modal.style.opacity=p.toFixed(3);
    if(mode==='dialog')modal.style.transform='scale('+(.94+.06*n).toFixed(4)+')';
    overlay.style.setProperty('--scrim',p.toFixed(3));
  }
}
var sp=Spring(paint);
function pickMode(){return mqReduce.matches?'fade':mqSheet.matches?'sheet':'dialog';}
function clearInline(){modal.style.transform='';modal.style.opacity='';overlay.style.removeProperty('--scrim');}
function settleOpen(){if(state==='open'&&mode!=='sheet')modal.style.transform='';}
function finishClose(){
  state='closed';overlay.classList.remove('open','closing');
  clearInline();modal.style.transformOrigin='';
}

window.presentModal=function(){
  var fresh=state==='closed';
  var next=pickMode();
  if(fresh)returnFocus=document.activeElement;
  if(!fresh&&next!==mode){sp.stop();clearInline();fresh=true;}
  mode=next;state='open';
  overlay.classList.add('open');overlay.classList.remove('closing');
  if(!modal.contains(document.activeElement)){try{modal.focus({preventScroll:true});}catch(_){}}
  if(mode==='sheet'){
    if(fresh)modal.style.transform='';
    H=Math.max(1,modal.offsetHeight);
    if(fresh)sp.set(H);
    sp.to(0,{damping:1,response:.38});
    return;
  }
  if(fresh){
    if(mode==='dialog'){
      // anchor to the source: scale out of the row or button that was pressed
      var r=modal.getBoundingClientRect(),ox=r.width/2,oy=Math.min(r.height/2,220);

    }

  }

};

window.dismissModal=function(){
  if(state!=='open')return;
  state='closing';overlay.classList.add('closing');   // the page underneath is live again immediately
  if(returnFocus&&returnFocus.isConnected&&returnFocus.focus){try{returnFocus.focus({preventScroll:true});}catch(_){}}
  returnFocus=null;
  var vel=handoff;handoff=null;
  if(mode==='sheet'){
    H=Math.max(1,modal.offsetHeight);
    sp.to(H,{damping:1,response:.3,velocity:vel==null?undefined:vel},finishClose);
  }else{
    sp.to(0,{damping:1,response:mode==='fade'?.16:.26,precision:.002},finishClose);
  }

/* Tab stays inside the dialog while it is open */
document.addEventListener('keydown',function(e){
  if(e.key!=='Tab'||state!=='open')return;
  var f=[].filter.call(modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'),function(n){return !n.disabled&&n.offsetParent!==null;});
  if(!f.length){e.preventDefault();return;}
  var first=f[0],last=f[f.length-1],a=document.activeElement;
  if(!modal.contains(a)||a===modal){e.preventDefault();(e.shiftKey?last:first).focus();}
  else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
});
function requestClose(){if(typeof closeModal==='function')closeModal();else window.dismissModal();}

/* Sheet drag — 1:1 with the finger from the grabber/header, velocity kept at release. */
var drag=null,HYSTERESIS=6;
function sample(e){
  drag.hist.push({t:e.timeStamp,y:e.clientY});
  while(drag.hist.length>2&&e.timeStamp-drag.hist[0].t>100)drag.hist.shift();
}
function releaseVelocity(h,now){
  var a=h[0],b=h[h.length-1];
  if(h.length<2||now-b.t>80||b.t===a.t)return 0;   // the finger paused before lifting: no throw
  return(b.y-a.y)/(b.t-a.t)*1000;
}
modal.addEventListener('pointerdown',function(e){
  if(mode!=='sheet'||state==='closed'||drag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var head=e.target.closest&&e.target.closest('.mhead');
  if(!head||e.target.closest('button,a,input,select,textarea'))return;
  drag={id:e.pointerId,startY:e.clientY,base:sp.value(),active:false,hist:[],head:head};
  sample(e);
  H=Math.max(1,modal.offsetHeight);
  if(sp.moving()){
    // grabbed mid-flight — opening or closing — so it follows the finger from where it is
    sp.stop();drag.active=true;
    if(state==='closing'){state='open';overlay.classList.remove('closing');}
  }
  try{head.setPointerCapture(e.pointerId);}catch(_){}
});
modal.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  sample(e);
  if(!drag.active){
    if(Math.abs(e.clientY-drag.startY)<HYSTERESIS)return;
    drag.active=true;drag.startY=e.clientY;          // re-anchor so crossing the threshold doesn't jump
    drag.head.style.cursor='grabbing';
  }
  var y=drag.base+(e.clientY-drag.startY);
  if(y<0)y=-rubberband(-y,H);
  sp.set(y);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;d.head.style.cursor='';
  try{d.head.releasePointerCapture(e.pointerId);}catch(_){}
  if(!d.active)return;                               // it was a tap
  var vel=e.type==='pointercancel'?0:releaseVelocity(d.hist,e.timeStamp);
  var y=sp.value();
  // decide from where the throw would land, not from where the finger let go
  if(e.type!=='pointercancel'&&y+project(vel)>H*.5){handoff=vel;requestClose();}
  else sp.to(0,{response:.3,damping:Math.abs(vel)>400?.8:1,velocity:vel});
}
modal.addEventListener('pointerup',endDrag);
modal.addEventListener('pointercancel',endDrag);

function onModeChange(){
  if(state==='closed')return;
  sp.stop();drag=null;
  if(state==='closing'){finishClose();return;}
  mode=pickMode();clearInline();
}
[mqSheet,mqReduce].forEach(function(m){if(m.addEventListener)m.addEventListener('change',onModeChange);else if(m.addListener)m.addListener(onModeChange);});

/* ---------- Feedback on touch-down ---------- */
document.addEventListener('pointerdown',function(e){lastPoint={x:e.clientX,y:e.clientY,t:performance.now()};},true);
document.addEventListener('touchstart',function(){},{passive:true});   // lets :active fire on iOS

/* ---------- Scroll edge: the bar only separates once content is under it ---------- */
var scrolled=false;
function onScroll(){var s=(window.scrollY||document.documentElement.scrollTop)>4;if(s!==scrolled){scrolled=s;bar.classList.toggle('scrolled',s);}}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();

/* ---------- Sliding indicators for the nav and every segmented control ----------
   The app only toggles .active/.on. We measure the selected button and move a
   pseudo-element to it through custom properties, so no markup is added. */
var GROUPS='.segmented,.subtabs,.rangebtns,.statusbtns';
var placed=new WeakMap();
function place(box,cur,animate){
  if(!cur||!cur.offsetWidth){
    if(cur===null&&box.classList.contains('thumbed')){box.classList.remove('thumbed','thumb-anim');placed.delete(box);}
    return false;
  }
  var key=cur.offsetLeft+','+cur.offsetTop+','+cur.offsetWidth+','+cur.offsetHeight;
  var prev=placed.get(box);
  if(prev===key)return false;
  var glide=animate&&prev!==undefined;
  if(!glide&&box.classList.contains('thumb-anim'))box.classList.remove('thumb-anim');
  var s=box.style;
  s.setProperty('--tx',cur.offsetLeft+'px');s.setProperty('--ty',cur.offsetTop+'px');
  s.setProperty('--tw',cur.offsetWidth+'px');s.setProperty('--th',cur.offsetHeight+'px');

/* ============================================================
   MT5 PARSER  (validated against real MT5 Trade History Report exports)
   ============================================================ */
function decodeEntities(s){return String(s).replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/\s+/g,' ').trim();}
function stripTags(s){return decodeEntities(String(s).replace(/<[^>]*>/g,''));}

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

function parseMT5(html){
  const r={account:{},trades:[],summary:{}};
  const grabHead=label=>{const m=html.match(new RegExp('>\\s*'+escRe(label)+'\\s*<\\/th>\\s*<th[^>]*>([\\s\\S]*?)<\\/th>','i'));return m?stripTags(m[1]):null;};
  r.account.name=grabHead('Name:');
  const acct=grabHead('Account:');r.account.raw=acct;
  if(acct){const m=acct.match(/^(\d+)\s*\(([^)]*)\)/);if(m){r.account.number=m[1];const p=m[2].split(',').map(x=>x.trim());r.account.currency=p[0]||null;r.account.server=p[1]||null;r.account.kind=p.slice(2).join(', ')||null;}else r.account.number=acct;}
  r.account.company=grabHead('Company:');
  r.account.reportDate=grabHead('Date:');
  // leverage may appear in some statements
  const lev=html.match(/Leverage[:\s]*<\/[^>]*>\s*<[^>]*>\s*<b>([\s\S]*?)<\/b>/i);if(lev)r.account.leverage=stripTags(lev[1]);

  // Positions section only
  const posIdx=html.search(/<b>\s*Positions\s*<\/b>/i);
  const ordIdx=html.search(/<b>\s*Orders\s*<\/b>/i);
  const dealIdx=html.search(/<b>\s*Deals\s*<\/b>/i);
  if(posIdx<0) throw new Error("No 'Positions' section found — is this an MT5 Trade History Report?");
  let end=html.length;
  if(ordIdx>posIdx)end=ordIdx;else if(dealIdx>posIdx)end=dealIdx;
  const section=html.slice(posIdx,end);

  const rowRe=/<tr[^>]*align="right"[^>]*>([\s\S]*?)<\/tr>/gi;let rm;
  while((rm=rowRe.exec(section))){
    const cellsRaw=[...rm[1].matchAll(/<td([^>]*)>([\s\S]*?)<\/td>/gi)];
    const cells=cellsRaw.filter(c=>!/class\s*=\s*"[^"]*hidden/i.test(c[1])).map(c=>stripTags(c[2]));
    if(cells.length<13)continue;
    const ticket=cells[1], type=(cells[3]||'').toLowerCase();
    if(!/^\d+$/.test(ticket))continue;
    if(type!=='buy'&&type!=='sell')continue;
    r.trades.push({ticket,openTime:cells[0],symbol:cells[2],type,
      volume:pnum(cells[4]),openPrice:pnum(cells[5]),sl:pnum(cells[6]),tp:pnum(cells[7]),
      closeTime:cells[8],closePrice:pnum(cells[9]),commission:pnum(cells[10]),swap:pnum(cells[11]),profit:pnum(cells[12])});
  }

  const sg=label=>{const m=html.match(new RegExp(escRe(label)+'\\s*<\\/td>\\s*<td[^>]*>\\s*<b>([\\s\\S]*?)<\\/b>','i'));return m?stripTags(m[1]):null;};
  const S=r.summary;
  S.balance=sg('Balance:');S.equity=sg('Equity:');S.freeMargin=sg('Free Margin:');S.floatingPL=sg('Floating P/L:');
  S.netProfit=sg('Total Net Profit:');S.grossProfit=sg('Gross Profit:');S.grossLoss=sg('Gross Loss:');
  S.profitFactor=sg('Profit Factor:');S.expectedPayoff=sg('Expected Payoff:');S.recoveryFactor=sg('Recovery Factor:');S.sharpe=sg('Sharpe Ratio:');
  S.ddAbsolute=sg('Balance Drawdown Absolute:');S.ddMaximal=sg('Balance Drawdown Maximal:');S.ddRelative=sg('Balance Drawdown Relative:');
  S.totalTrades=sg('Total Trades:');S.shortTrades=sg('Short Trades (won %):');S.longTrades=sg('Long Trades (won %):');
  S.profitTrades=sg('Profit Trades (% of total):');S.lossTrades=sg('Loss Trades (% of total):');
  S.largestProfit=sg('Largest profit trade:');S.largestLoss=sg('Largest loss trade:');
  S.avgProfit=sg('Average profit trade:');S.avgLoss=sg('Average loss trade:');
  S.maxConsecWins=sg('Maximum consecutive wins ($):');S.maxConsecLosses=sg('Maximum consecutive losses ($):');
  return r;
}

/* read an MT5 file handling UTF-16 LE BOM (and falling back to UTF-8) */
function readMT5File(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const buf=fr.result;const bytes=new Uint8Array(buf);
      let text;
      if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE){text=new TextDecoder('utf-16le').decode(buf);}
      else if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF){text=new TextDecoder('utf-16be').decode(buf);}
      else {
        // heuristic: lots of NUL bytes => utf-16le without BOM
        let nul=0;for(let i=1;i<Math.min(bytes.length,400);i+=2)if(bytes[i]===0)nul++;
        text=nul>80?new TextDecoder('utf-16le').decode(buf):new TextDecoder('utf-8').decode(buf);
      }
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      res(text);
    };
    fr.onerror=()=>rej(fr.error);
    fr.readAsArrayBuffer(file);
  });
}

/* ============================================================
   ENRICHMENT — per-trade derived fields
   ============================================================ */
function parseMT5Date(str){ // accepts MT5 "2026.06.01 11:01:04" and eToro "01-06-2026 11:01:04"
  if(!str)return null;
  let m=str.match(/(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
  if(m)return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]||0);
  m=str.match(/(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
  if(m)return Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]||0);
  return null;
}
function shifted(ms){return ms==null?null:new Date(ms+(STATE.settings.brokerOffsetHours||0)*3600e3);}
/* A real timestamp, moved onto the statement's clock. Trade times are the broker's
   wall-clock read as if it were UTC, and brokerOffsetHours maps that clock onto the
   trader's own. So a real moment lands on the statement clock as the device's
   wall-clock (read the same way) minus that offset. The result compares directly
   with openMs/closeMs, and shifted(nowStmt()) is the trader's local date and time.
   Using Date.now() raw here is what made "today" and the stopout break drift by
   the broker's UTC offset. */
function toStmt(ms){return ms-new Date(ms).getTimezoneOffset()*60000-(STATE.settings.brokerOffsetHours||0)*3600e3;}
function nowStmt(){return toStmt(Date.now());}
function sessionFor(ms){const d=shifted(ms);if(!d)return'Off';const h=d.getUTCHours();
  if(h>=3&&h<11)return'Asian';if(h>=11&&h<16)return'London';if(h>=16&&h<24)return'NY';return'Late';}
function dayKey(ms){const d=shifted(ms);if(!d)return'';return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function isoWeek(ms){const d=shifted(ms);if(!d)return'';const dt=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const dn=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-dn+3);const f=new Date(Date.UTC(dt.getUTCFullYear(),0,4));const wk=1+Math.round(((dt-f)/86400000-3+((f.getUTCDay()+6)%7))/7);return dt.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');}
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function weekday(ms){const d=shifted(ms);return d?WD[d.getUTCDay()]:'';}

function enrich(t){
  const e=Object.assign({},t);
  e.broker=t.broker||'MT5';
  e.violations=t.violations||[];e.ruleBroken=!!t.ruleBroken;e.revenge=!!t.revenge;
  e.openMs=parseMT5Date(t.openTime);e.closeMs=parseMT5Date(t.closeTime);
  e.durationMin=(e.openMs!=null&&e.closeMs!=null)?Math.max(0,Math.round((e.closeMs-e.openMs)/60000)):null;
  const info=symInfo(t.symbol);e.unit=info.label;e.symCls=info.cls;
  const dir=t.type==='buy'?1:-1;
  e.priceMove=(t.closePrice!=null&&t.openPrice!=null)?dir*(t.closePrice-t.openPrice):null;
  e.pips=e.priceMove!=null?+(e.priceMove/info.size).toFixed(1):null;
  e.net=(t.profit||0)+(t.commission||0)+(t.swap||0); // many brokers report profit already net of comm/swap; keep raw profit as primary
  e.pl=t.profit==null?0:t.profit;
  e.win=e.pl>0; e.loss=e.pl<0;
  e.autoSession=sessionFor(e.openMs);
  e.session=e.session||e.autoSession;
  // R from SL (price-based) — robust without pip $ value
  if(t.sl!=null&&t.openPrice!=null&&Math.abs(t.openPrice-t.sl)>0&&e.priceMove!=null){
    e.rFromSL=+(e.priceMove/Math.abs(t.openPrice-t.sl)).toFixed(2);
  } else e.rFromSL=null;
  // effective R: user actualR > rFromSL > (profit/riskUSD)
  if(e.actualR!=null&&!isNaN(e.actualR))e.R=+e.actualR;
  else if(e.rFromSL!=null)e.R=e.rFromSL;
  else if(e.riskUSD>0)e.R=+(e.pl/e.riskUSD).toFixed(2);
  else e.R=null;
  e.dayKey=dayKey(e.openMs);e.weekKey=isoWeek(e.openMs);e.weekday=weekday(e.openMs);
  e.hour=shifted(e.openMs)?shifted(e.openMs).getUTCHours():null;
  return e;
}

/* ============================================================
   RULE ENGINE — pooled across all instruments
   ============================================================ */
function runRules(trades){
  const ts=trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  const dayPL={},dayCount={},weekPL={};
  ts.forEach(t=>{dayPL[t.dayKey]=(dayPL[t.dayKey]||0)+t.pl;dayCount[t.dayKey]=(dayCount[t.dayKey]||0)+1;weekPL[t.weekKey]=(weekPL[t.weekKey]||0)+t.pl;});
  let lastLossClose=null;
  ts.forEach(t=>{
    const v=[];
    // realized loss bigger than the $5 cap -> stop wasn't where it should be
    if(t.pl < -(RULES.maxRisk+0.05)) v.push({code:'loss>cap',label:'Loss exceeded the '+amt(RULES.maxRisk)+' cap',hard:true});
    // entered risk over cap
    if(t.riskUSD!=null&&t.riskUSD>RULES.maxRisk+0.001) v.push({code:'risk>5',label:'Planned risk over '+amt(RULES.maxRisk),hard:true});
    // kept trading AFTER the daily cap was already realized (forward-looking, pooled)
    const dayRealBefore=ts.filter(o=>o.dayKey===t.dayKey&&o.closeMs!=null&&t.openMs!=null&&o.closeMs<=t.openMs).reduce((a,o)=>a+o.pl,0);
    if(dayRealBefore<=-RULES.dailyLoss) v.push({code:'daily',label:'Traded after the −'+amt(RULES.dailyLoss)+' daily cap',hard:true});
    // kept trading AFTER the weekly cap was already realized
    const weekRealBefore=ts.filter(o=>o.weekKey===t.weekKey&&o.closeMs!=null&&t.openMs!=null&&o.closeMs<=t.openMs).reduce((a,o)=>a+o.pl,0);
    if(weekRealBefore<=-RULES.weeklyLoss) v.push({code:'weekly',label:'Traded after the −'+amt(RULES.weeklyLoss)+' weekly cap',hard:true});
    // revenge: opened within 60min of a prior stopout (loss) close
    if(lastLossClose!=null&&t.openMs!=null){const gap=(t.openMs-lastLossClose)/60000;if(gap>=0&&gap<RULES.breakMins)v.push({code:'revenge',label:'Revenge (inside the '+breakLabel()+' break)',hard:true});}

    t.violations=v;
    t.revenge=v.some(x=>x.code==='revenge');
    t.ruleBroken=v.some(x=>x.hard);
    if(t.loss&&t.closeMs!=null) lastLossClose=Math.max(lastLossClose||0,t.closeMs);
  });
  return {dayPL,dayCount,weekPL};
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function groupStats(list){
  const n=list.length, wins=list.filter(t=>t.win), losses=list.filter(t=>t.loss);
  const gp=wins.reduce((a,t)=>a+t.pl,0), gl=losses.reduce((a,t)=>a+t.pl,0);
  const total=list.reduce((a,t)=>a+t.pl,0);
  const rs=list.filter(t=>t.R!=null).map(t=>t.R);
  return {
    n, wins:wins.length, losses:losses.length,
    winRate:n?wins.length/n*100:null,
    total, gp, gl,
    profitFactor: gl!==0?Math.abs(gp/gl):(gp>0?Infinity:null),
    avgWin: wins.length?gp/wins.length:null,
    avgLoss: losses.length?gl/losses.length:null,
    expDollar: n?total/n:null,
    expR: rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    rCount: rs.length
  };
}
function maxDrawdown(list){ // on cumulative P&L curve, by close time
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let cum=0,peak=0,mdd=0;s.forEach(t=>{cum+=t.pl;peak=Math.max(peak,cum);mdd=Math.min(mdd,cum-peak);});return mdd;
}
function streaks(list){
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let w=0,l=0,mw=0,ml=0;s.forEach(t=>{if(t.win){w++;l=0;mw=Math.max(mw,w);}else if(t.loss){l++;w=0;ml=Math.max(ml,l);}else{w=0;l=0;}});return{maxWin:mw,maxLoss:ml};
}
function equitySeries(list){
  const s=list.filter(t=>t.closeMs!=null).slice().sort((a,b)=>a.closeMs-b.closeMs);
  let cum=0;return s.map(t=>{cum+=t.pl;return{ms:t.closeMs,y:cum,t};});
}
/* consecutive clean trading days (ending at most recent trading day). A clean day = had trades, none with a hard violation */
function cleanDayStreak(list){
  const byDay={};list.forEach(t=>{(byDay[t.dayKey]=byDay[t.dayKey]||[]).push(t);});
  const days=Object.keys(byDay).filter(Boolean).sort();
  let streak=0;
  for(let i=days.length-1;i>=0;i--){const clean=byDay[days[i]].every(t=>!t.ruleBroken);if(clean)streak++;else break;}
  const totalClean=days.filter(d=>byDay[d].every(t=>!t.ruleBroken)).length;
  return {streak,totalClean,totalDays:days.length};
}
/* drawdown episodes on the cumulative P&L curve (by close time) */
function drawdownEpisodes(list){
  const s=equitySeries(list);if(!s.length)return{episodes:[],current:null,worst:null,avgRecoverBars:null};
  let peak=s[0].y,peakIdx=0,inDD=false,startIdx=0,trough=peak,episodes=[];
  for(let i=0;i<s.length;i++){const y=s[i].y;
    if(y>=peak){if(inDD){episodes.push({startIdx,recoverIdx:i,depth:trough-peak,bars:i-startIdx,recovered:true});inDD=false;}peak=y;peakIdx=i;}
    else{if(!inDD){inDD=true;startIdx=peakIdx;trough=y;}else trough=Math.min(trough,y);}
  }
  let current=null;
  if(inDD)current={depth:trough-peak,bars:(s.length-1)-startIdx,recovered:false};
  const recovered=episodes.filter(e=>e.recovered);
  const worst=[...episodes,...(current?[current]:[])].sort((a,b)=>a.depth-b.depth)[0]||null;
  const avgRecoverBars=recovered.length?recovered.reduce((a,e)=>a+e.bars,0)/recovered.length:null;
  return {episodes,current,worst,avgRecoverBars,count:episodes.length};
}
/* ---------- period analytics (today / week / month rollups) ---------- */
function addDaysKey(key,delta){const p=key.split('-').map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]+delta));return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');}
function periodKeys(){
  const t=todayKeyLocal(),now=nowStmt();
  const p=t.split('-').map(Number);
  const lm=new Date(Date.UTC(p[0],p[1]-2,1));
  return {today:t,yesterday:addDaysKey(t,-1),
    week:isoWeek(now),lastWeek:isoWeek(now-7*864e5),
    month:t.slice(0,7),lastMonth:lm.getUTCFullYear()+'-'+String(lm.getUTCMonth()+1).padStart(2,'0')};
}
function bucketStats(list,pred){
  const s=list.filter(pred);
  const pl=s.reduce((a,t)=>a+t.pl,0),wins=s.filter(t=>t.win).length;
  return {pl,n:s.length,wins,winRate:s.length?wins/s.length*100:null};
}
/* per-day P&L quality: green-day rate, best/worst day, average green/red day */
function dayQuality(list){
  const byDay={};list.forEach(t=>{if(t.dayKey)byDay[t.dayKey]=(byDay[t.dayKey]||0)+t.pl;});
  const days=Object.entries(byDay);
  if(!days.length)return null;
  const green=days.filter(d=>d[1]>0),red=days.filter(d=>d[1]<0);
  const best=days.slice().sort((a,b)=>b[1]-a[1])[0],worst=days.slice().sort((a,b)=>a[1]-b[1])[0];
  return {days:days.length,green:green.length,red:red.length,greenRate:green.length/days.length*100,
    best:{date:best[0],pl:best[1]},worst:{date:worst[0],pl:worst[1]},
    avgGreen:green.length?green.reduce((a,d)=>a+d[1],0)/green.length:null,
    avgRed:red.length?red.reduce((a,d)=>a+d[1],0)/red.length:null};
}

/* live pooled status for "now" in display tz */
function liveStatus(){
  const now=nowStmt();const dnow=shifted(now);
  const tKey=dnow.getUTCFullYear()+'-'+String(dnow.getUTCMonth()+1).padStart(2,'0')+'-'+String(dnow.getUTCDate()).padStart(2,'0');
  const wKey=isoWeek(now);
  const todays=STATE.trades.filter(t=>t.dayKey===tKey);
  const weeks=STATE.trades.filter(t=>t.weekKey===wKey);
  const dayPL=todays.reduce((a,t)=>a+t.pl,0),weekPL=weeks.reduce((a,t)=>a+t.pl,0);
  const lastLoss=STATE.trades.filter(t=>t.loss&&t.closeMs!=null).sort((a,b)=>b.closeMs-a.closeMs)[0];
  const sinceLoss=lastLoss?(now-lastLoss.closeMs)/60000:null;
  const inBreak=sinceLoss!=null&&sinceLoss>=0&&sinceLoss<RULES.breakMins;
  // room = how much more you can lose before the cap trips (dayPL + cap; 0 or less = breached)
  const roomDaily=dayPL+RULES.dailyLoss, roomWeekly=weekPL+RULES.weeklyLoss;
  return {tKey,wKey,todays,weeks,dayPL,weekPL,sinceLoss,inBreak,
    roomDaily,roomWeekly,
    dailyHit:dayPL<=-RULES.dailyLoss,weeklyHit:weekPL<=-RULES.weeklyLoss,
    scaled:dayPL>=RULES.scaleAfter};
}
let lockTimer=null;
/* One reading of liveStatus() shared by the full banner and the header pill,
   so the two can never disagree. The binding constraint is whichever cap has
   less loss room left. */
function statusSummary(){
  const s=liveStatus();
  const weeklyTighter=s.roomWeekly<s.roomDaily;
  const room=Math.max(0,weeklyTighter?s.roomWeekly:s.roomDaily);
  const capName=weeklyTighter?('weekly −'+amt(RULES.weeklyLoss)):('daily −'+amt(RULES.dailyLoss));
  if(s.dailyHit||s.weeklyHit){
    if(s.weeklyHit)return{cls:'stop',ic:'stop',big:'Weekly loss cap (−'+amt(RULES.weeklyLoss)+') breached.',detail:'Week P&L '+usd(s.weekPL)+'. Done for the week — walk away.',pill:'Weekly cap hit'};
    return{cls:'stop',ic:'stop',big:'Daily loss cap (−'+amt(RULES.dailyLoss)+') breached.',detail:'Day P&L '+usd(s.dayPL)+'. Walk away — no more entries today.',pill:'Daily cap hit'};
  }
  if(s.inBreak){
    const left=Math.max(0,Math.ceil(RULES.breakMins-s.sinceLoss));
    return{cls:'cool',ic:'clock',big:'Cooldown after stopout.',detail:breakLabel()+' break — no entries for',cd:left+'m',pill:'Cooldown · '+left+'m'};
  }
  if(room<=RULES.maxRisk)return{cls:'cool',ic:'alert',big:usd(room)+' of loss room left.',detail:'Only '+usd(room)+' before the '+capName+' cap · day P&L '+usd(s.dayPL)+'. One more loser closes you out — trade carefully.',pill:'Tight · '+usd(room)+' room'};
  return{cls:'ok',ic:'checkCircle',big:'Clear to trade.',detail:usd(room)+' of loss room before the '+capName+' cap · day P&L '+usd(s.dayPL)+' · '+(s.scaled?'scaled mode (risk '+amt(RULES.scaledRisk)+', '+amt(RULES.drawback)+' lock-in)':'risk up to '+amt(RULES.maxRisk)),pill:'Clear · '+usd(room)+' room'};
}
/* the full banner belongs where the question "may I trade?" is asked; everywhere else a pill in the header */
const BANNER_PAGES=['dashboard','checklist'];
function renderLockBanner(){
  const host=$('#lockBanner'),pill=$('#statusPill');if(!host)return;
  clearTimeout(lockTimer);
  if(!STATE.trades.length){host.innerHTML='';if(pill)pill.hidden=true;return;}

/* ============================================================
   CANVAS CHARTS
   ============================================================ */
function setupCanvas(c,h){const w=c.clientWidth||c.parentElement.clientWidth-32;const dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const ctx=c.getContext('2d');ctx.scale(dpr,dpr);return{ctx,w,h};}
const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();

/* chart registry — every chart re-draws (without animation) on window resize */
const CHARTS=new Map();
let chartRszT=null;
window.addEventListener('resize',()=>{clearTimeout(chartRszT);chartRszT=setTimeout(()=>{for(const[c,fn]of CHARTS){if(!c.isConnected)CHARTS.delete(c);else fn(false);}},160);});
function chartTip(canvas){

/* hover on a desktop, touch-and-scrub on a phone (the canvas keeps vertical scrolling) */
function chartHover(canvas,onMove,onLeave){

function animFrames(frame,animate,dur){

  const t0=performance.now();
  (function tick(now){const p=Math.min(1,(now-t0)/(dur||500));frame(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(tick);})(t0);
}

function lineChart(canvas,series,opts={}){

}

/* a "nice" tick step (1, 2 or 5 × 10ⁿ) so axis labels land on round numbers */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p;}
/* a bar with its far end rounded — the top for gains, the bottom for losses */
function barPath(ctx,x,y,w,h,r,up){

/* opts: height, colors[], counts (integer axis + tooltip), ref:{value,label} for a dashed reference line */
function barChart(canvas,labels,values,opts={}){

    const {ctx,w,h}=setupCanvas(canvas,opts.height||220);
    const pad={l:opts.counts?32:54,r:12,t:16,b:28};const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;
    if(!values.length){ctx.clearRect(0,0,w,h);ctx.fillStyle=CSSV('--faint');ctx.font='12px sans-serif';ctx.fillText('No data',pad.l,h/2);canvas._bhit=null;return;}

    // bars are capped in width and the group is centred, so two months don't become two slabs
    const n=values.length,slot=Math.min(plotW/n,80),bwI=Math.min(56,slot*.68),x0=pad.l+(plotW-slot*n)/2;
    const grid=CSSV('--line2'),faint=CSSV('--faint'),muted=CSSV('--muted'),mono=CSSV('--mono');
    const frame=prog=>{
      ctx.clearRect(0,0,w,h);
      ctx.font='10px '+mono;ctx.textAlign='right';ctx.textBaseline='middle';ctx.lineWidth=1;
      for(let v=vmin;v<=vmax+step/2;v+=step){
        const y=Math.round(Y(v))+.5,zero=Math.abs(v)<step/1e6;
        ctx.strokeStyle=grid;ctx.globalAlpha=zero?1:.5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.globalAlpha=1;
        ctx.fillStyle=zero?muted:faint;
        ctx.fillText(opts.counts?String(Math.round(v)):(v<0?'-':'')+CURSYM+Math.abs(Math.round(v)).toLocaleString('en-US'),pad.l-8,y);
      }
      ctx.textAlign='center';ctx.textBaseline='top';
      let lastRight=-Infinity;
      values.forEach((v,i)=>{
        const cx=x0+i*slot+slot/2,x=cx-bwI/2,y0=Y(0),y=Y(v*prog);
        ctx.fillStyle=opts.colors?opts.colors[i]:(v>=0?CSSV('--win'):CSSV('--accent-bright'));
        if(v!==0)barPath(ctx,x,Math.min(y,y0),bwI,Math.max(1,Math.abs(y-y0)),4,v>=0);
        const lw=ctx.measureText(String(labels[i])).width;
        if(cx-lw/2>lastRight+6){ctx.fillStyle=faint;ctx.fillText(labels[i],cx,h-pad.b+8);lastRight=cx+lw/2;}
      });
      if(ref){
        const y=Math.round(Y(ref.value))+.5;
        ctx.strokeStyle=CSSV('--amber');ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.setLineDash([]);
        if(ref.label){ctx.fillStyle=CSSV('--amber');ctx.textAlign='right';ctx.textBaseline='bottom';ctx.font='10px '+CSSV('--sans');ctx.fillText(ref.label,w-pad.r,y-3);}
      }
    };
    animFrames(frame,animate,420);
    canvas._bhit={x0,slot,Y,values,labels,frame};
  };
  CHARTS.set(canvas,draw);
  draw(true);
  if(!canvas._hoverBound){
    canvas._hoverBound=true;
    chartHover(canvas,e=>{
      const hb=canvas._bhit;if(!hb)return;
      const tip=chartTip(canvas);
      const r=canvas.getBoundingClientRect();const mx=e.clientX-r.left;
      const i=Math.floor((mx-hb.x0)/hb.slot);
      if(i<0||i>=hb.values.length){tip.classList.remove('on');return;}
      const v=hb.values[i];
      tip.innerHTML='<span class="tl">'+escapeHtml(String(hb.labels[i]))+'</span><span class="'+(v>=0?'pos':'neg')+'">'+(opts.counts?fmt(v,0):usd(v))+'</span>';
      tip.style.left=(canvas.offsetLeft+hb.x0+i*hb.slot+hb.slot/2)+'px';
      tip.style.top=(canvas.offsetTop+hb.Y(Math.max(v,0)))+'px';
      tip.classList.add('on');
    },()=>chartTip(canvas).classList.remove('on'));
  }
}

/* horizontal labelled bars (for time/day/setup ranking) */
function hbars(container,rows,opts={}){ // rows: [{label,value,sub}]
  const max=Math.max(1,...rows.map(r=>Math.abs(r.value)));
  const wrap=el('div',{class:'bars'});
  rows.forEach(r=>{
    const w=Math.abs(r.value)/max*100;
    const color=r.value>=0?'var(--win)':'var(--accent)';
    const fill=el('div',{class:'fill'});fill.style.width=w+'%';fill.style.background=color;
    if(r.value>=0)fill.style.left='0';else fill.style.right='0';
    const track=el('div',{class:'track'},fill);
    wrap.append(el('div',{class:'barrow'},
      el('div',{class:'muted'},r.label),
      track,
      el('div',{class:'val '+signCls(r.value)}, opts.money?usd(r.value):fmt(r.value,opts.dp??1))
    ));
  });
  container.append(wrap);
}

/* very small markdown renderer (headings ## , bullets, 1. lists, **bold**) */
function renderMarkdownLite(text){
  const wrap=el('div',{class:'md'});
  const inline=s=>String(s).split(/(\*\*[^*]+\*\*)/g).map(p=>/^\*\*[^*]+\*\*$/.test(p)?el('b',{},p.slice(2,-2)):p);
  let listEl=null,listType=null;
  String(text||'').split(/\r?\n/).forEach(ln=>{
    const t=ln.trim();
    if(!t){listEl=null;listType=null;return;}
    if(/^#{1,6}\s+/.test(t)){listEl=null;wrap.append(el('h4',{class:'mdh'},...inline(t.replace(/^#{1,6}\s+/,''))));return;}
    if(/^\d+[.)]\s+/.test(t)){if(listType!=='ol'){listEl=el('ol',{class:'mdul'});listType='ol';wrap.append(listEl);}listEl.append(el('li',{},...inline(t.replace(/^\d+[.)]\s+/,''))));return;}
    if(/^[-•*]\s+/.test(t)){if(listType!=='ul'){listEl=el('ul',{class:'mdul'});listType='ul';wrap.append(listEl);}listEl.append(el('li',{},...inline(t.replace(/^[-•*]\s+/,''))));return;}
    listEl=null;listType=null;wrap.append(el('p',{class:'mdp'},...inline(t)));
  });
  return wrap;
}

function renderPeriodStrip(root,list){

    {k:'Today',cur:t=>t.dayKey===K.today,prev:t=>t.dayKey===K.yesterday,prevLab:'yesterday',today:true},
    {k:'This week',cur:t=>t.weekKey===K.week,prev:t=>t.weekKey===K.lastWeek,prevLab:'last week',week:true},
    {k:'This month',cur:t=>(t.dayKey||'').startsWith(K.month),prev:t=>(t.dayKey||'').startsWith(K.lastMonth),prevLab:'last month'}

        gaugeRow('Loss room',-Math.min(0,s.dayPL)/RULES.dailyLoss,usd(Math.max(0,s.roomDaily))+' left of −'+amt(RULES.dailyLoss),s.dailyHit));

/* ---- Dashboard › Performance: the page's one hero ----
   Net P&L for the chosen range, the discipline story in one line, the curve
   with its rules-followed twin, and four supporting figures for the same range. */
const RANGES=[['1W','1W',7,'last 7 days'],['1M','1M',30,'last 30 days'],['3M','3M',90,'last 90 days'],['ALL','All',null,'all time']];
function countBetween(node,from,to,f,dur){
  if(REDUCED||from==null||!isFinite(from)||!isFinite(to)){node.textContent=f(to);return;}
  const t0=performance.now();dur=dur||420;
  (function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);node.textContent=f(from+(to-from)*e);if(p<1)requestAnimationFrame(step);})(t0);

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* "2026-11-13" → "13 Nov" (a statement-clock day key, so no timezone maths) */
function fmtDay(key){if(!key)return'';const p=key.split('-');return (+p[2])+' '+MONTHS[+p[1]-1];}
/* A trade time as "13 Nov · 10:35", adding the year only when it isn't this year.
   openMs/closeMs are statement-clock values, not real timestamps, so they go
   through shifted() and the getUTC* getters — never local date formatting. */
function fmtStmt(ms){
  const d=shifted(ms);if(!d)return'';
  const y=d.getUTCFullYear(),cy=shifted(nowStmt()).getUTCFullYear();
  return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+(y!==cy?' '+y:'')+' · '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
}

/* heat colour for a P&L value scaled against a max magnitude */
function heatColor(v,max,wide){
  if(v===0||max===0)return wide?'transparent':'#161619';
  const a=Math.min(1,Math.abs(v)/max);
  // the heatmap has no numbers on it, so it can use the full range — and a square-root
  // curve, so a weak cell is still clearly not an empty one. The calendar caps ~0.62 so its numbers stay legible.
  const o=(wide?0.24+Math.sqrt(a)*0.6:0.14+a*0.48).toFixed(3);
  if(v>0)return `rgba(112,168,136,${o})`;
  return `rgba(191,110,102,${o})`;
}

    el('button',{class:'btn sm',onclick:()=>{STATE.calMonths[key]={y:m===11?y+1:y,m:m===11?0:m+1};renderCalendar(host,listArg,key);},'aria-label':'Next month'},icon('chevR')),

    );

  const grid=el('div',{class:'calgrid'});

function renderHeatmap(host,listArg){
  host.innerHTML='';host.classList.add('heathost');
  const list=listArg||visibleTrades();
  const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cell={},cnt={};let max=0;
  list.forEach(t=>{if(t.hour==null||!t.weekday)return;const k=t.weekday+'|'+t.hour;cell[k]=(cell[k]||0)+t.pl;cnt[k]=(cnt[k]||0)+1;max=Math.max(max,Math.abs(cell[k]));});
  // hour range present
  const hoursPresent=[...new Set(list.filter(t=>t.hour!=null).map(t=>t.hour))];
  const hMin=hoursPresent.length?Math.min(...hoursPresent):8, hMax=hoursPresent.length?Math.max(...hoursPresent):20;
  const hours=[];for(let h=hMin;h<=hMax;h++)hours.push(h);
  const wrap=el('div',{class:'heatwrap'});
  const grid=el('div',{class:'heatgrid'});
  grid.style.gridTemplateColumns=`40px repeat(${hours.length},minmax(18px,1fr))`;
  grid.append(el('div',{}));
  hours.forEach(h=>grid.append(el('div',{class:'hh'},h)));
  order.filter(d=>list.some(t=>t.weekday===d)).forEach(d=>{
    grid.append(el('div',{class:'rl'},d));

      const k=d+'|'+h,v=cell[k]||0;
      const c=el('div',{class:'heatcell'+(cnt[k]?' has':'')});
      c.style.background=heatColor(v,max,true);
      if(cnt[k]){c.tabIndex=0;c.dataset.k=k;c.setAttribute('aria-label',d+' '+h+':00 — '+usd(v)+' over '+cnt[k]+' trade'+(cnt[k]>1?'s':''));}
      grid.append(c);

  });
  wrap.append(grid);host.append(wrap);
  // the value used to live only in a title attribute, which touch screens can't reach
  const tip=el('div',{class:'charttip',role:'status'});host.append(tip);
  let sel=null;
  function show(c){
    if(sel&&sel!==c)sel.classList.remove('sel');
    if(!c||!c.dataset.k){sel=null;tip.classList.remove('on');return;}
    sel=c;c.classList.add('sel');
    const [d,h]=c.dataset.k.split('|'),v=cell[c.dataset.k],n=cnt[c.dataset.k];
    tip.innerHTML='<span class="tl">'+d+' '+h+':00 · '+n+' trade'+(n>1?'s':'')+'</span><span class="'+(v>=0?'pos':'neg')+'">'+usd(v)+'</span>';
    const hr=host.getBoundingClientRect(),cr=c.getBoundingClientRect();
    tip.style.left=Math.min(hr.width-60,Math.max(60,cr.left-hr.left+cr.width/2))+'px';tip.style.top=(cr.top-hr.top-2)+'px';
    tip.classList.add('on');
  }

  chartHover(grid,e=>{const n=document.elementFromPoint(e.clientX,e.clientY);show(n&&n.closest?n.closest('.heatcell'):null);},hide);
  grid.addEventListener('focusin',e=>show(e.target.closest('.heatcell')));
  grid.addEventListener('focusout',hide);
  host.append(el('div',{class:'legend',style:'margin-top:8px'},
    el('span',{},'Net P&L by weekday × open hour · tap or hover a cell'),
    (function(){const s=el('span',{},el('i',{}),'profit');s.firstChild.style.background='rgba(112,168,136,.7)';return s;})(),
    (function(){const s=el('span',{},el('i',{}),'loss');s.firstChild.style.background='rgba(191,110,102,.7)';return s;})()
  ));
}

  await idbPut('images',{id,ticket,name:file.name||'pasted.png',type:file.type,added:Date.now(),blob:file});
  const area=$('#shotsArea');if(area&&currentTicket===ticket)renderShots(ticket,area);
  toast('Screenshot attached','good');
}
async function autoFileScreenshots(files){
  if(!files.length)return;
  const tickets=STATE.trades.map(t=>t.ticket).sort((a,b)=>b.length-a.length);
  let filed=0,missed=0;
  for(const f of files){
    const hit=tickets.find(tk=>(f.name||'').includes(tk));
    if(hit){await addImage(hit,f);filed++;}else missed++;
  }
  toast(filed?`Filed ${filed} screenshot${filed>1?'s':''} by ticket${missed?', '+missed+' unmatched':''}`:'No filenames matched a ticket — open a trade to attach manually',!filed);
}
/* global paste: if modal open, attach to current trade; else try ticket-in-name auto-match on Import page */
document.addEventListener('paste',e=>{
  const items=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length)return;
  if(currentTicket){items.forEach(i=>{const f=i.getAsFile();if(f)addImage(currentTicket,f);});}
});

/* ============================================================
   PLAN & TOOLS — pre-trade plans, watchlist, position sizing
   ============================================================ */
function planTol(sym){const i=symInfo(sym);return i.label==='pips'?20*i.size:3.0;}   // within 20 pips, or 3.0 points
async function reconcilePlans(){
  const linked=new Set(STATE.plans.filter(p=>p.ticket).map(p=>p.ticket));
  const cands=STATE.trades.slice().sort((a,b)=>(a.openMs||0)-(b.openMs||0));
  for(const p of STATE.plans){
    if(p.status==='skipped'||p.ticket)continue;
    const tol=planTol(p.symbol);let best=null,bestScore=Infinity;
    for(const t of cands){
      if(linked.has(t.ticket))continue;
      if(t.symbol!==p.symbol||t.type!==p.dir||t.openMs==null)continue;
      if(p.entry!=null){const d=Math.abs((t.openPrice||0)-p.entry);if(d>tol)continue;const score=d+Math.abs(t.openMs-toStmt(p.createdMs))/3.6e6*0.001;if(score<bestScore){bestScore=score;best=t;}}
      else{const dt=t.openMs-toStmt(p.createdMs);if(dt>=-3.6e6&&dt<=24*3.6e6&&dt<bestScore){bestScore=dt;best=t;}}
    }
    if(best){const dp=symInfo(p.symbol).dp;
      p.ticket=best.ticket;p.status='executed';
      p.dev={entry:p.entry!=null?+(best.openPrice-p.entry).toFixed(dp):null,sl:(p.sl!=null&&best.sl!=null)?+(best.sl-p.sl).toFixed(dp):null,tp:(p.tp!=null&&best.tp!=null)?+(best.tp-p.tp).toFixed(dp):null};
      linked.add(best.ticket);await idbPut('plans',p);
    }
  }
  STATE.plans=(await idbAll('plans')).sort((a,b)=>b.createdMs-a.createdMs);
}
/* Default value of a 1.0 price move per 1.0 lot. Known contracts only —
   anything else must come from the user (broker contract specs vary, and a
   wrong guess here sizes a real position wrong). */
function pointValuePerLot(sym){
  if(/^XAU/i.test(sym))return 100;                    // gold: 100 oz per lot
  if(/^XAG/i.test(sym))return 5000;                   // silver: 5000 oz per lot
  if(/^[A-Z]{3}USD$/i.test(sym))return 100000;        // FX quoted in USD: 1 lot = 100k base units
  return null;                                        // indices/CFDs: broker-specific
}
function calcLots(sym,riskUSD,stop,usdjpy,pointValue){
  if(!(riskUSD>0)||!(stop>0))return null;
  if(/JPY/i.test(sym)){if(!(usdjpy>0))return{err:'Enter current USDJPY to size a yen pair'};const pv=1000/usdjpy;const lots=riskUSD/(stop*pv);return{lots,unitNote:CURSYM+(pv*lots).toFixed(2)+' per pip · stop '+stop+' pips'};}
  const pv=(pointValue>0)?pointValue:pointValuePerLot(sym);
  if(!(pv>0))return{err:'Enter this instrument\'s value per 1.0 price move per 1.0 lot — it\'s in your broker\'s contract specification.'};
  const lots=riskUSD/(stop*pv);
  return{lots,unitNote:CURSYM+(pv*lots).toFixed(2)+' per 1.0 move · stop '+stop+' · point value '+pv+'/lot'};
}

  root.append(el('h2',{class:'sec'},'Pre-trade plan'),el('div',{class:'cap'},'Log the trade before you take it.'));

  const entryIn=el('input',{type:'number',step:'any',inputmode:'decimal',value:formPlan.entry??'',placeholder:ph(symInfo(formPlan.symbol).dp),oninput:e=>{formPlan.entry=e.target.value===''?null:+e.target.value;updRR();}});
  const r1=el('div',{class:'row',style:'margin-bottom:12px'});

  r1.append(wrapFld('Symbol',symSel),wrapFld('Direction',dirSel),wrapFld('Session',sessSel));
  form.append(r1);
  const r2=el('div',{class:'row',style:'margin-bottom:12px'});
  r2.append(
    wrapFld('Entry',entryIn),
    wrapFld('Stop loss',el('input',{type:'number',step:'any',inputmode:'decimal',value:formPlan.sl??'',oninput:e=>{formPlan.sl=e.target.value===''?null:+e.target.value;updRR();}})),
    wrapFld('Take profit',el('input',{type:'number',step:'any',inputmode:'decimal',value:formPlan.tp??'',oninput:e=>{formPlan.tp=e.target.value===''?null:+e.target.value;updRR();}}))
  );
  form.append(r2);
  const r3=el('div',{class:'row',style:'margin-bottom:12px'});
  r3.append(
    wrapFld('Planned R',el('input',{type:'number',step:'0.1',inputmode:'decimal',value:formPlan.plannedR??'',oninput:e=>formPlan.plannedR=e.target.value===''?null:+e.target.value})),
    wrapFld('Risk ('+CURSYM.trim()+')',el('input',{type:'number',step:'0.01',inputmode:'decimal',value:formPlan.riskUSD??'',oninput:e=>formPlan.riskUSD=e.target.value===''?null:+e.target.value}))
  );
  form.append(r3);
  form.append(el('label',{class:'fld'},'Setups'));
  const tagWrap=el('div',{style:'margin-bottom:12px'});
  // chips toggle in place, as in the trade detail
  SETUPS.forEach(s=>{const on=formPlan.setups.includes(s);const chip=el('button',{class:'tag-chip'+(on?' on':''),'aria-pressed':String(on),onclick:()=>{const i=formPlan.setups.indexOf(s);if(i<0)formPlan.setups.push(s);else formPlan.setups.splice(i,1);chip.classList.toggle('on',i<0);chip.setAttribute('aria-pressed',String(i<0));}},s);tagWrap.append(chip);});
  form.append(tagWrap);
  const noteA=el('textarea',{placeholder:'e.g. H1 bullish BOS, price sweeping SSL into demand at 214.00 breaker — long on 5m confirmation.',oninput:e=>formPlan.note=e.target.value});noteA.value=formPlan.note||'';
  form.append(wrapFld('Thesis / level',noteA));
  // reward:risk preview, live as the prices are typed
  const rr=el('div',{class:'note',style:'margin-top:12px','aria-live':'polite'});
  function updRR(){
    const ok=formPlan.entry!=null&&formPlan.sl!=null&&formPlan.tp!=null&&Math.abs(formPlan.entry-formPlan.sl)>0;
    rr.style.display=ok?'':'none';if(!ok)return;
    const dp=symInfo(formPlan.symbol).dp,risk=Math.abs(formPlan.entry-formPlan.sl),rew=Math.abs(formPlan.tp-formPlan.entry);

    const info=symInfo(p.symbol);const card=el('div',{class:'plancard '+(p.status==='executed'?'executed':p.status==='skipped'?'skipped':'')});
    const ph=el('div',{class:'ph'});
    ph.append(el('span',{class:'pill '+info.cls},p.symbol),el('span',{class:'pill '+(p.dir==='buy'?'win':'loss')},p.dir),
      el('span',{class:'meta'},new Date(p.createdMs).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})));
    const sb=el('div',{class:'statusbtns',style:'margin-left:auto'});
    [['pending','Pending'],['executed','Taken'],['skipped','Skipped']].forEach(([v,lab])=>sb.append(el('button',{class:p.status===v?'on':'',onclick:async()=>{p.status=v;if(v!=='executed'){p.ticket=null;p.dev=null;}await savePlan(p);renderPlan();}},lab)));
    ph.append(sb);
    card.append(ph);
    const dpp=symInfo(p.symbol).dp;
    const facts=[];if(p.entry!=null)facts.push('entry '+fmt(p.entry,dpp));if(p.sl!=null)facts.push('SL '+fmt(p.sl,dpp));if(p.tp!=null)facts.push('TP '+fmt(p.tp,dpp));if(p.plannedR!=null)facts.push(fmt(p.plannedR,1)+'R');if(p.riskUSD!=null)facts.push(amt(p.riskUSD)+' risk');
    card.append(el('div',{class:'meta'},facts.join(' · ')||'—'));
    if(p.setups&&p.setups.length)card.append(el('div',{style:'margin-top:6px'},...p.setups.map(s=>el('span',{class:'tag-chip'},s))));
    if(p.note)card.append(el('div',{class:'meta',style:'margin-top:6px'},p.note));
    if(p.status==='executed'&&p.ticket){
      const t=STATE.trades.find(x=>x.ticket===p.ticket);
      const dev=p.dev||{};
      const devStr=[];if(dev.entry!=null)devStr.push('entry '+(dev.entry===0?'<span class="match">exact</span>':'<span class="off">'+(dev.entry>0?'+':'')+dev.entry+'</span>'));if(dev.sl!=null)devStr.push('SL '+(dev.sl===0?'<span class="match">exact</span>':'<span class="off">'+(dev.sl>0?'+':'')+dev.sl+'</span>'));
      card.append(el('div',{class:'dev',style:'margin-top:8px',html:'→ Taken as #'+escapeHtml(p.ticket)+(t?' · result '+(t.pl>=0?'<span class="match">':'<span class="off">')+usd(t.pl)+'</span>':'')+(devStr.length?' · vs plan: '+devStr.join(', '):'')}));
      if(t)card.append(el('div',{style:'margin-top:6px'},el('button',{class:'btn sm ghost',onclick:()=>openTrade(t.ticket)},'Open trade →')));
    }
    ph.append(el('button',{class:'btn icon','aria-label':'Delete plan',title:'Delete plan',onclick:async()=>{if(confirm('Delete this plan?')){await deletePlan(p.id);renderPlan();}}},icon('trash')));

/* ---- Plan & Tools › Position size ---- */
function planSize(root){
  /* ---- position size calculator ---- */
  root.append(el('h2',{class:'sec'},'Position size'),el('div',{class:'cap'},'Lots for a given risk and stop distance.'));
  const calc=el('div',{class:'panel'});
  const pvStore=STATE.settings.pointValues||(STATE.settings.pointValues={});
  const cstate={symbol:INSTRUMENTS[0]||'',risk:RULES.maxRisk,stop:null,usdjpy:STATE.settings.usdjpy||null,
    get pointValue(){return pvStore[this.symbol]??pointValuePerLot(this.symbol);}};
  const out=el('div',{style:'margin-top:6px'});
  function recalc(){
    out.innerHTML='';
    const isJpy=/JPY/i.test(cstate.symbol);
    const r=calcLots(cstate.symbol,cstate.risk,cstate.stop,cstate.usdjpy,cstate.pointValue);
    if(!r){out.append(el('div',{class:'faint',style:'font-size:.75rem'},'Enter risk and stop distance.'));return;}
    if(r.err){out.append(el('div',{class:'warn'},r.err));return;}
    out.append(el('div',{class:'calc-out'},fmt(r.lots,2)+' lots'),el('div',{class:'meta',style:'margin-top:4px'},r.unitNote));
    if(r.lots<0.01)out.append(el('div',{class:'note',style:'margin-top:8px'},'That\'s below 0.01 lots — your stop is wide for a '+amt(cstate.risk)+' risk. Tighten the stop or accept a smaller position.'));
  }
  const cr=el('div',{class:'row'});
  const cSym=el('select',{onchange:e=>{cstate.symbol=e.target.value;renderPlanCalcStop();recalc();}});INSTRUMENTS.forEach(s=>cSym.append(el('option',{value:s,selected:cstate.symbol===s?'':null},s)));
  const cRisk=el('input',{type:'number',step:'0.5',value:cstate.risk,oninput:e=>{cstate.risk=+e.target.value||0;recalc();}});
  const stopWrap=el('div');
  const jpyWrap=el('div');
  function renderPlanCalcStop(){
    const isJpy=/JPY/i.test(cstate.symbol);
    stopWrap.innerHTML='';stopWrap.append(el('label',{class:'fld'},isJpy?'Stop (pips)':'Stop (price move)'),el('input',{type:'number',step:isJpy?'1':'0.1',value:cstate.stop??'',placeholder:isJpy?'e.g. 12':'e.g. 5.0',oninput:e=>{cstate.stop=e.target.value===''?null:+e.target.value;recalc();}}));
    jpyWrap.innerHTML='';
    if(isJpy)jpyWrap.append(el('label',{class:'fld'},'USDJPY rate'),el('input',{type:'number',step:'0.01',value:cstate.usdjpy??'',placeholder:'e.g. 190.50',oninput:e=>{cstate.usdjpy=e.target.value===''?null:+e.target.value;STATE.settings.usdjpy=cstate.usdjpy;saveSettings();recalc();}}));
    else jpyWrap.append(el('label',{class:'fld'},'Point value / lot'),el('input',{type:'number',step:'any',value:cstate.pointValue??'',placeholder:'100000 FX · 100 gold · see broker specs',oninput:e=>{const v=e.target.value===''?null:+e.target.value;if(v>0)pvStore[cstate.symbol]=v;else delete pvStore[cstate.symbol];saveSettings();recalc();}}));
  }
  renderPlanCalcStop();
  cr.append(wrapFld('Symbol',cSym),wrapFld('Risk ('+CURSYM.trim()+')',cRisk),stopWrap,jpyWrap);
  calc.append(cr,out);
  calc.append(el('div',{class:'cap',style:'margin-top:16px;padding-top:14px;border-top:1px solid var(--line)'},'Point value is what a 1.0 price move on 1.0 lot is worth: 100,000 for USD-quoted FX pairs, 100 for gold — for indices and other CFDs check your broker\'s contract specs, then it\'s remembered per symbol. Values assume a USD-quoted account; if yours isn\'t, treat the result as approximate. The per-trade cap of '+amt(RULES.maxRisk)+' stays the same for every instrument.'));
  root.append(calc);
  recalc();
}

  const tzPanel=el('div',{class:'panel'});

  tzIn.id='tzOffset';
  tzPanel.append(el('label',{class:'fld',for:'tzOffset'},'Statement-time → your-time offset (hours)'),tzIn,el('div',{class:'help'},'MT5 timestamps are in your broker server time. If that clock differs from the one you think in, set the hour offset here so session tagging and time-of-day stats line up with your day. Leave at 0 if the statement times already match.'));
