async function handleStatement(file){
  const ipage=$('#page-import');
  const loader=el('div',{class:'loading',style:'margin-bottom:14px'},el('span',{class:'spinner'}),'Reading your statement…');
  ipage.prepend(loader);
  try{
    const text=await readMT5File(file);
    const parsed=parseMT5(text);
    if(!parsed.trades.length)throw new Error('No closed positions found in the file.');
    if(!DB.db)await openDB(); // self-heal if IndexedDB wasn't ready at boot
    // merge: preserve enrichment + dedupe by ticket
    let added=0,updated=0;const now=Date.now();
    for(const pt of parsed.trades){
      const existing=await idbGet('trades',pt.ticket);
      if(existing){updated++;await idbPut('trades',Object.assign({},existing,pt,{updatedAt:now}));}
      else {added++;await idbPut('trades',Object.assign({setups:[],note:'',emotion:'',confirmation:false,plannedR:null,actualR:null,riskUSD:null,session:null},pt,{updatedAt:now}));}
    }
    STATE.settings.account=parsed.account;STATE.settings.summary=parsed.summary;
    await saveSettings();
    await loadAll();
    await reconcilePlans();
    toast(`Imported ${parsed.trades.length} trades — ${added} new, ${updated} updated`,'good');
    renderImport();
  }catch(err){console.error(err);loader.remove();
    const root=$('#page-import');
    const storage=!DB.db||/transaction|indexed\s*db|object ?store|database/i.test(err.message||'');
    if(storage){
      toast('Storage unavailable — import not saved',true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Your statement parsed fine, but this browser context can\'t use IndexedDB, so nothing could be saved. Open this file directly in a normal browser tab (not a private/incognito window or a sandboxed preview) and try again.'));
    } else {
      toast('Import failed: '+err.message,true);
      root.prepend(el('div',{class:'warn',style:'margin-bottom:14px'},'Could not read this file: '+escapeHtml(err.message)+' — export your history from MT5 as an HTML "Trade History Report" and try again.'));
    }}
}

async function exportBackup(){
  const trades=await idbAll('trades');
  const images=await idbAll('images');
  const imgOut=[];
  for(const im of images){const b64=await blobToB64(im.blob);imgOut.push({id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,data:b64});}
  const debriefs=await idbAll('debriefs');
  const livetrades=await idbAll('livetrades');
  const payload={app:'Aether',version:1,exported:new Date().toISOString(),settings:STATE.settings,trades,debriefs,livetrades,images:imgOut};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:'aether-backup-'+new Date().toISOString().slice(0,10)+'.json'});document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Backup downloaded — '+trades.length+' trades, '+images.length+' images','good');
}
function blobToB64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});}
function b64ToBlob(d){const[meta,data]=d.split(',');const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

async function importBackup(file){
  if(!confirm('Restore from backup? This merges the backup into your current data (existing tickets are overwritten).'))return;
  try{
    const text=await file.text();const p=JSON.parse(text);
    if(p.app!=='Aether')if(!confirm('This doesn\'t look like an Aether backup. Continue anyway?'))return;
    if(p.settings){STATE.settings=Object.assign({},DEFAULT_SETTINGS,p.settings);await saveSettings();}
    for(const t of(p.trades||[]))await idbPut('trades',t);
    for(const d of(p.debriefs||[]))await idbPut('debriefs',d);
    for(const lt of(p.livetrades||[]))await idbPut('livetrades',lt);
    for(const im of(p.images||[]))await idbPut('images',{id:im.id,ticket:im.ticket,name:im.name,type:im.type,added:im.added,blob:b64ToBlob(im.data)});
    await loadAll();toast('Backup restored','good');renderImport();
  }catch(err){console.error(err);toast('Restore failed: '+err.message,true);}
}

/* ============================================================
   RULES & LEVELS
   ============================================================ */
function renderRules(){
  const root=$('#page-rules');root.innerHTML='';
  root.append(el('div',{class:'eyebrow'},'Your trading rules · pooled across every instrument you trade'));
  const rules=[
    ['Daily loss cap',amt(RULES.dailyLoss)+' daily loss limit — pooled across all instruments. This is the primary discipline: trade freely while you still have loss room.'],
    ['Weekly loss cap',amt(RULES.weeklyLoss)+' weekly loss limit — pooled across all instruments.'],
    ['Risk per trade','Max '+amt(RULES.maxRisk)+' risk on any single trade.'],
    ['Profit scaling','After +'+amt(RULES.scaleAfter)+' on the day, scale risk down to '+amt(RULES.scaledRisk)+' per trade with a '+amt(RULES.drawback)+' drawback (lock-in) stop.'],
    ['Break after stopout','Mandatory '+RULES.breakMins+'-minute break after any stopout — no new entries inside that window.']
  ];
  const rp=el('div',{class:'panel'});
  rules.forEach(r=>rp.append(el('div',{class:'kv',style:'align-items:flex-start;flex-direction:column;gap:2px'},el('span',{style:'font-weight:600'},r[0]),el('span',{class:'muted'},r[1]))));
  root.append(rp);
  root.append(el('div',{class:'note',style:'margin-top:10px'},'Instruments differ in point value, typical stop width and spread, so position size has to be worked out per instrument — but your '+amt(RULES.maxRisk)+' / '+amt(RULES.dailyLoss)+' / '+amt(RULES.weeklyLoss)+' caps apply identically to all of them.'));

  // editable key levels
  root.append(el('h2',{class:'sec'},'Key levels'));
  INSTRUMENTS.forEach(sym=>{
    const info=symInfo(sym);
    const box=el('div',{class:'panel',style:'margin-bottom:14px'});
    box.append(el('h4',{style:'margin:0 0 12px'},el('span',{class:'pill '+info.cls},sym),' ',el('span',{class:'muted',style:'font-weight:400'},'recurring levels')));
    const list=STATE.settings.keyLevels[sym]||(STATE.settings.keyLevels[sym]=[]);
    const rows=el('div');
    function draw(){
      rows.innerHTML='';
      list.forEach((lv,i)=>{
        const labIn=el('input',{class:'lblw',type:'text',value:lv.label,placeholder:'Label',oninput:e=>lv.label=e.target.value});
        const valIn=el('input',{type:'text',value:lv.value,placeholder:'Price / zone',oninput:e=>lv.value=e.target.value});
        rows.append(el('div',{class:'levelrow'},labIn,valIn,el('button',{class:'btn sm danger',onclick:async()=>{list.splice(i,1);await saveSettings();draw();}},'✕')));
      });
      if(!list.length)rows.append(el('div',{class:'faint',style:'font-size:12px;margin-bottom:8px'},'No levels yet for '+sym+' — add the ones you keep coming back to.'));
    }
    draw();
    box.append(rows);
    box.append(el('div',{style:'display:flex;gap:10px;margin-top:6px'},
      el('button',{class:'btn sm',onclick:async()=>{list.push({label:'',value:''});await saveSettings();draw();}},'+ Add level'),
      el('button',{class:'btn sm primary',onclick:async()=>{await saveSettings();toast(sym+' levels saved','good');}},'Save '+sym)));
    root.append(box);
  });
}

/* ============================================================
   CHECKLIST
   ============================================================ */
function renderChecklist(){
  const root=$('#page-checklist');root.innerHTML='';
  // live pooled usage TODAY / THIS WEEK
  const now=Date.now();const today=dayKey(now-(STATE.settings.brokerOffsetHours||0)*3600e3); // approximate "today" in display tz
  // simpler: compute today's key from current display time
  const dnow=new Date(now+(STATE.settings.brokerOffsetHours||0)*3600e3);
  const tKey=dnow.getUTCFullYear()+'-'+String(dnow.getUTCMonth()+1).padStart(2,'0')+'-'+String(dnow.getUTCDate()).padStart(2,'0');
  const wKey=isoWeek(now);
  const todays=STATE.trades.filter(t=>t.dayKey===tKey);
  const weeks=STATE.trades.filter(t=>t.weekKey===wKey);
  const dayPL=todays.reduce((a,t)=>a+t.pl,0),weekPL=weeks.reduce((a,t)=>a+t.pl,0);
  const lastLoss=STATE.trades.filter(t=>t.loss&&t.closeMs!=null).sort((a,b)=>b.closeMs-a.closeMs)[0];
  const sinceLoss=lastLoss?(now-lastLoss.closeMs)/60000:null;
  const inBreak=sinceLoss!=null&&sinceLoss<RULES.breakMins;

  const roomDaily=dayPL+RULES.dailyLoss, roomWeekly=weekPL+RULES.weeklyLoss;
  root.append(el('div',{class:'eyebrow'},'Live pooled status · '+tKey));
  const cards=el('div',{class:'cards',style:'margin-bottom:18px'});
  cards.append(
    statCard('Loss room today',usd(Math.max(0,roomDaily)),'before the −'+amt(RULES.dailyLoss)+' cap',roomDaily<=RULES.maxRisk?'neg':'pos'),
    statCard('Day P&L',usd(dayPL),'cap -'+amt(RULES.dailyLoss),signCls(dayPL)),
    statCard('Week P&L',usd(weekPL),'cap -'+amt(RULES.weeklyLoss),signCls(weekPL)),
    statCard('Since last stopout',sinceLoss==null?'—':(sinceLoss<60?Math.round(sinceLoss)+'m':Math.floor(sinceLoss/60)+'h '+Math.round(sinceLoss%60)+'m'),inBreak?('in '+RULES.breakMins+'m break'):'clear',inBreak?'neg':'pos')
  );
  root.append(cards);

  const dailyOK=dayPL>-RULES.dailyLoss, weeklyOK=weekPL>-RULES.weeklyLoss;
  const scaled=dayPL>=RULES.scaleAfter;

  root.append(el('h2',{class:'sec'},'Pre-trade checklist'));
  const auto=[
    [dailyOK,'Within daily loss cap', `Day P&L ${usd(dayPL)} vs −${amt(RULES.dailyLoss)} limit · ${usd(Math.max(0,roomDaily))} of room left.`],
    [weeklyOK,'Within weekly loss cap', `Week P&L ${usd(weekPL)} vs −${amt(RULES.weeklyLoss)} limit · ${usd(Math.max(0,roomWeekly))} of room left.`],
    [!inBreak,'Not inside a 1-hour stopout break', inBreak?`Last stopout was ${Math.round(sinceLoss)}m ago — wait ${Math.max(0,Math.ceil(RULES.breakMins-sinceLoss))}m more.`:'No recent stopout blocking you.']
  ];
  auto.forEach(a=>{root.append(el('div',{class:'check '+(a[0]?'auto-ok':'auto-bad')},
    el('div',{style:'font-size:16px;margin-top:1px'},a[0]?'✓':'⚠'),
    el('div',{},el('div',{class:'ttl'},a[1]),el('div',{class:'desc'},a[2]))));});

  if(scaled)root.append(el('div',{class:'note',style:'margin-bottom:9px'},'You\'re past +'+amt(RULES.scaleAfter)+' today — scaling rule active: risk '+amt(RULES.scaledRisk)+' per trade, lock in with a '+amt(RULES.drawback)+' drawback stop.'));

  const manual=[
    ['Risk ≤ '+amt(scaled?RULES.scaledRisk:RULES.maxRisk),'Position sized for this instrument so the worst case stays inside your per-trade cap.'],
    ['Higher timeframe agrees','Structure above your entry timeframe supports the direction?'],
    ['Entry trigger confirmed','A signal you defined in advance actually fired — not anticipation?'],
    ['Level mapped','Entry tied to a level you marked before the session?'],
    ['Exit defined','Stop and target both set before entry, not after?']
  ];
  manual.forEach(m=>root.append(el('label',{class:'check'},el('input',{type:'checkbox'}),el('div',{},el('div',{class:'ttl'},m[0]),el('div',{class:'desc'},m[1])))));

  root.append(el('h2',{class:'sec'},'Post-trade review'));
  const pr=el('div',{class:'panel'});
  ['Did I follow my plan exactly, or improvise?','Was the entry a real confirmed signal or a forced trade?','If it lost — was it a clean stop (acceptable) or a rule-break?','What did the H1→15m→5m read actually tell me?','One thing to repeat. One thing to cut.'].forEach(q=>pr.append(el('div',{class:'kv'},el('span',{class:'k'},'•'),el('span',{style:'flex:1;margin-left:8px'},q))));
  pr.append(el('div',{style:'margin-top:10px'},el('button',{class:'btn',onclick:()=>go('log')},'Open trade log to journal →')));
  root.append(pr);
}

  // ask the OS not to evict our storage (best-effort; matters most on iOS)
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{await openDB();await loadAll();}catch(e){console.error(e);toast('Storage error — IndexedDB unavailable',true);}
  go('dashboard');
  // PWA: register the offline service worker when hosted over http(s); no-op on file://
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
